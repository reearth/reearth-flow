name: Set up engine CI environment
description: |
  Shared post-checkout setup for engine CI jobs: installs the pinned Rust
  toolchain, restores the cargo cache, and installs the CLI tools needed by the
  job. Defaults to cargo-make (used by every job); a job that needs extra tools
  (e.g. lint needs taplo-cli) passes them via `tools`.

  The calling job MUST run `step-security/harden-runner` and `actions/checkout`
  before invoking this action — checkout is required for GitHub to locate this
  local composite action, and harden-runner must precede any network egress.

  Node.js, glb-decompress, and yaml-include are intentionally NOT installed
  here — only the jobs that need them install them, to keep setup time minimal.

inputs:
  shared-key:
    description: |
      Rust cache shared-key. All engine CI jobs use the same key so that the
      first job to finish a clean build seeds the cache for the others on the
      next run.
    required: false
    default: engine-ci
  rust-components:
    description: Optional extra rustup components to install (comma-separated).
    required: false
    default: ""
  tools:
    description: |
      Comma-separated CLI tools to install via taiki-e/install-action.
      Defaults to cargo-make, which every job needs to run `cargo make`.
      Jobs needing more (e.g. lint needs taplo-cli) override this.
    required: false
    default: cargo-make
  setup-proj-grid:
    description: |
      Whether to pre-fetch and cache the JGD2011 Japan geoid grid
      (jp_gsi_gsigeo2011.tif) that PROJ needs for EPSG:6697 height
      transforms. Without this, PROJ falls back to its on-demand network
      download from cdn.proj.org, which is unreliable under CI egress
      restrictions and silently degrades transforms (no error, wrong
      height) rather than failing loudly. Enable for jobs that exercise
      plateau geometry/height reprojection (test-qc, test-conv).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@2ea1b3bdd0261867664fd125505456a7b9c3385c # 1.93.1
      with:
        components: ${{ inputs.rust-components }}
    - name: Cache cargo registry
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        workspaces: engine
        shared-key: ${{ inputs.shared-key }}
    - name: install required tools
      uses: taiki-e/install-action@74e87cbfa15a59692b158178d8905a61bf6fca95 # v2.75.20
      with:
        tool: ${{ inputs.tools }}
    - name: Cache PROJ grid data
      if: inputs.setup-proj-grid == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        # ~/.local/share/proj is PROJ's default user-writable directory for
        # on-demand grid downloads (matches local dev, where this file
        # already lives after PROJ auto-fetched it once). No PROJ_DATA/
        # PROJ_LIB override needed - this is where PROJ already looks.
        path: ~/.local/share/proj
        key: proj-grids-v1-jp_gsi_gsigeo2011
    - name: Fetch JGD2011 Japan geoid grid
      if: inputs.setup-proj-grid == 'true'
      shell: bash
      run: |
        mkdir -p ~/.local/share/proj
        grid=~/.local/share/proj/jp_gsi_gsigeo2011.tif
        if [ -s "$grid" ]; then
          echo "PROJ grid already cached at $grid"
        else
          echo "Fetching PROJ grid to $grid"
          curl -fsSL --retry 3 --retry-delay 2 --proto '=https' --tlsv1.2 -o "$grid" https://cdn.proj.org/jp_gsi_gsigeo2011.tif
        fi
