name: Install KTX build toolchain
description: |
  Installs cmake/clang/libclang and warms the KTX-Software source tarball
  cache, needed to build the `new-geometry` feature's `ktx2-rw` dependency
  (which compiles KTX-Software from source).

runs:
  using: composite
  steps:
    - name: Install KTX build toolchain (cmake + libclang for ktx2-rw)
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cmake clang libclang-dev
      working-directory: /
    - name: Cache KTX-Software source tarball
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        # Path and version are what ktx2-rw@0.2.4's build.rs hard-codes as its
        # fallback; bump the key when ktx2-rw bumps KTX-Software.
        path: /tmp/ktx-software-v4.4.0.tar.gz
        key: ktx-software-v4.4.0
    - name: Fetch and verify KTX-Software tarball (fallback for ktx2-rw build.rs)
      shell: bash
      env:
        KTX_TARBALL: /tmp/ktx-software-v4.4.0.tar.gz
        KTX_URL: https://github.com/KhronosGroup/KTX-Software/archive/refs/tags/v4.4.0.tar.gz
        # sha256 of the GitHub source archive for KTX-Software v4.4.0. Bump
        # alongside the cache key and path when ktx2-rw bumps KTX-Software.
        KTX_SHA256: 3585d76edcdcbe3a671479686f8c81c1c10339f419e4b02a9a6f19cc6e4e0612
      run: |
        if ! echo "${KTX_SHA256}  ${KTX_TARBALL}" | sha256sum -c - 2>/dev/null; then
          curl -fsSL --retry 5 --retry-all-errors -o "${KTX_TARBALL}" "${KTX_URL}"
          echo "${KTX_SHA256}  ${KTX_TARBALL}" | sha256sum -c -
        fi
      working-directory: /
