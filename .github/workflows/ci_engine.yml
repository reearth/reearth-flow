name: ci-engine

on:
  workflow_call:

env:
  # Disable incremental compilation.
  CARGO_INCREMENTAL: 0
  # Allow more retries for network requests in cargo (downloading crates) and
  # rustup (installing toolchains). This should help to reduce flaky CI failures
  # from transient network timeouts or other issues.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Don't emit giant backtraces in the CI logs.
  RUST_BACKTRACE: short
  FLOW_RUNTIME_ACTION_LOG_DISABLE: true

defaults:
  run:
    working-directory: engine

jobs:
  ci:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@8831c82abf29b34eb2caac48d5f999ecfc0d8eef # v4.1
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-swapfile: 'true'
          remove-cached-tools: 'true'
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy, rustfmt
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: engine
          shared-key: "engine-ci"
      - name: install required tools
        uses: taiki-e/install-action@74e87cbfa15a59692b158178d8905a61bf6fca95 # v2.75.20
        with:
          tool: taplo-cli,cargo-make,cargo-edit
      - name: install yaml-include
        run: cargo install yaml-include
      - name: Compare version with previous commit
        if: ${{ !(github.ref == 'refs/heads/main') }}
        run: |
          # Only enforce an engine version bump when engine sources actually
          # changed. ci-engine also runs for workflow-only changes (ci.yml,
          # ci_engine.yml, build_docker_push_worker.yml are in its changed-files
          # filter), which must not require a version bump.
          if git diff --quiet HEAD~1 HEAD -- . ; then
            echo "No engine changes between HEAD~1 and HEAD - skipping version check"
            exit 0
          fi
          # Try to get previous version, handle new files
          PREV_VERSION=$(git show "HEAD~1:engine/Cargo.toml" 2>/dev/null | grep '^version' | cut -d '"' -f2) || PREV_VERSION=""
          if [ -z "$PREV_VERSION" ]; then
            echo "No previous version found (new file?) - skipping version check"
            exit 0
          fi

          CURR_VERSION=$(grep '^version' Cargo.toml | cut -d '"' -f2)
          if [ -z "$CURR_VERSION" ]; then
            echo "Error: Could not find version in current Cargo.toml"
            exit 1
          fi

           echo "Previous version: $PREV_VERSION"
           echo "Current version:  $CURR_VERSION"

           if [ "$PREV_VERSION" = "$CURR_VERSION" ]; then
             echo "Error: The version of Cargo.toml has not been changed."
             echo "       To increase the patch version, run 'cargo set-version --bump patch'."
             echo "       To bump the version, run one of:"
             echo "       - 'cargo set-version --bump major'  # For breaking changes"
             echo "       - 'cargo set-version --bump minor'  # For new features"
             echo "       - 'cargo set-version --bump patch'  # For bug fixes"
             exit 1
           fi

      - name: check
        run: cargo make check
      - name: rustfmt
        run: cargo make format -- --check
      - name: clippy
        run: cargo make clippy
      - name: taplo
        run: cargo make format-taplo --check
      - name: check generated schema
        run: cargo make check-doc-action
      - name: check generated cms workflows
        run: cargo make check-generate-examples-cms-workflow
      - name: run tests
        run: cargo make test
