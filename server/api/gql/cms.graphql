# CMS types

type CMSProject {
  id: ID!
  name: String!
  alias: String!
  description: String
  license: String
  readme: String
  workspaceId: ID!
  visibility: CMSVisibility!
  topics: [String!]!
  starCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum CMSVisibility {
  PUBLIC
  PRIVATE
}

type CMSAsset {
  id: ID!
  uuid: String!
  projectId: ID!
  filename: String!
  size: Int!
  previewType: String
  url: String!
  archiveExtractionStatus: String
  public: Boolean!
  createdAt: DateTime!
}

type CMSAssetsConnection {
  assets: [CMSAsset!]!
  totalCount: Int!
  pageInfo: CMSPageInfo!
}

type CMSPageInfo {
  page: Int!
  pageSize: Int!
}

type CMSModelsConnection {
  models: [CMSModel!]!
  totalCount: Int!
  pageInfo: CMSPageInfo!
}

type CMSModel {
  id: ID!
  projectId: ID!
  name: String!
  description: String!
  key: String!
  schema: CMSSchema!
  publicApiEp: String!
  editorUrl: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type CMSSchema {
  schemaId: ID!
  fields: [CMSSchemaField!]!
}

type CMSSchemaField {
  fieldId: ID!
  name: String!
  type: CMSSchemaFieldType!
  key: String!
  description: String
}

enum CMSSchemaFieldType {
  TEXT
  TEXTAREA
  RICHTEXT
  MARKDOWNTEXT
  ASSET
  DATE
  BOOL
  SELECT
  TAG
  INTEGER
  NUMBER
  REFERENCE
  CHECKBOX
  URL
  GROUP
  GEOMETRYOBJECT
  GEOMETRYEDITOR
}

type CMSItem {
  id: ID!
  fields: JSON!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type CMSItemsConnection {
  items: [CMSItem!]!
  totalCount: Int!
}

enum CMSExportType {
  JSON
  GEOJSON
}

# Queries

extend type Query {
  # Project-scoped queries take the workspace that owns the CMS project
  # (CMSProject.workspaceId): CMS resolves projects inside a workspace, and
  # Flow checks permission against that same workspace.

  # Get a CMS project by ID or alias
  cmsProject(workspaceId: ID!, projectIdOrAlias: ID!): CMSProject
  
  # List CMS projects for multiple workspaces
  cmsProjects(workspaceIds: [ID!]!, keyword: String, publicOnly: Boolean, page: Int, pageSize: Int): [CMSProject!]!

  # Get a CMS asset by ID
  cmsAsset(workspaceId: ID!, assetId: ID!): CMSAsset

  # List CMS assets for a project
  cmsAssets(workspaceId: ID!, projectId: ID!, page: Int, pageSize: Int): CMSAssetsConnection!

  # Get a CMS model by project and model ID/alias
  cmsModel(workspaceId: ID!, projectIdOrAlias: ID!, modelIdOrAlias: ID!): CMSModel

  # List CMS models for a project
  cmsModels(workspaceId: ID!, projectId: ID!, page: Int, pageSize: Int): CMSModelsConnection!

  # List CMS items for a model
  cmsItems(workspaceId: ID!, projectId: ID!, modelId: ID!, keyword: String, page: Int, pageSize: Int): CMSItemsConnection!

  # Get export URL for a CMS model with specified type
  cmsModelExportUrl(workspaceId: ID!, projectId: ID!, modelId: ID!, exportType: CMSExportType): String!
}
