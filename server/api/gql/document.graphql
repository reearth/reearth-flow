# Project History Snapshot
type PreviewSnapshot {
  id: ID!
  name: String
  timestamp: DateTime!
  updates: [Int!]!
  version: Int!
}

# Latest Project Document
type ProjectDocument implements Node {
  id: ID!
  timestamp: DateTime!
  updates: [Int!]!
  version: Int!
}

# Project Snapshot history vector
type ProjectSnapshot {
  timestamp: DateTime!
  updates: [Int!]!
  version: Int
  snapshotNumber: Int
}

# Project Snapshot Metadata (without updates data)
type ProjectSnapshotMetadata {
  timestamp: DateTime!
  version: Int!
}

# A labelled snapshot in a project's version history.
type NamedSnapshot {
  snapshotNumber: Int!
  label: String!
  timestamp: DateTime!
  size: FileSize!
  # Empty for snapshots saved without attribution. The list can be cut short, so
  # contributorCount can exceed it.
  contributorIds: [ID!]!
  # The contributors that still resolve to a user.
  contributors: [User!]!
  # How many contributors there are, including any missing from the lists.
  contributorCount: Int!
  lastEditorId: ID
  lastEditor: User
}

# Mutation

extend type Mutation {
  saveSnapshot(projectId: ID!): Boolean!
  previewSnapshot(projectId: ID!, version: Int!, name: String): PreviewSnapshot
  rollbackProject(projectId: ID!, version: Int!): ProjectDocument
  copyProject(projectId: ID!, source: ID!): Boolean!
  importProject(projectId: ID!, data: Bytes!): Boolean!
  saveNamedSnapshot(projectId: ID!, label: String!): NamedSnapshot!
}

# Query

extend type Query {
  latestProjectSnapshot(projectId: ID!): ProjectDocument
  projectHistory(projectId: ID!): [ProjectSnapshotMetadata!]!
  # Pass exactly one of version or snapshotNumber.
  projectSnapshot(
    projectId: ID!
    version: Int
    snapshotNumber: Int
  ): ProjectSnapshot!
  projectNamedSnapshots(projectId: ID!): [NamedSnapshot!]!
}