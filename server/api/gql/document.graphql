# Project History Snapshot
type PreviewSnapshot {
  id: ID!
  name: String
  timestamp: DateTime!
  updates: [Int!]!
  version: Int!
}

# Latest Project Document
type ProjectDocument implements Node {
  id: ID!
  timestamp: DateTime!
  updates: [Int!]!
  version: Int!
}

# Project Snapshot history vector
type ProjectSnapshot {
  timestamp: DateTime!
  updates: [Int!]!
  version: Int!
}

# Project Snapshot Metadata (without updates data)
type ProjectSnapshotMetadata {
  timestamp: DateTime!
  version: Int!
}

# A labelled snapshot in a project's version history.
type NamedSnapshot {
  snapshotNumber: Int!
  label: String!
  timestamp: DateTime!
  size: FileSize!
}

# One snapshot's stored state, keyed by snapshotNumber (not the update-log clock).
type NamedSnapshotState {
  snapshotNumber: Int!
  updates: [Int!]!
}

# Mutation

extend type Mutation {
  saveSnapshot(projectId: ID!): Boolean!
  previewSnapshot(projectId: ID!, version: Int!, name: String): PreviewSnapshot
  rollbackProject(projectId: ID!, version: Int!): ProjectDocument
  copyProject(projectId: ID!, source: ID!): Boolean!
  importProject(projectId: ID!, data: Bytes!): Boolean!
  saveNamedSnapshot(projectId: ID!, label: String!): NamedSnapshot!
}

# Query

extend type Query {
  latestProjectSnapshot(projectId: ID!): ProjectDocument
  projectHistory(projectId: ID!): [ProjectSnapshotMetadata!]!
  projectSnapshot(projectId: ID!, version: Int!): ProjectSnapshot!
  projectNamedSnapshots(projectId: ID!): [NamedSnapshot!]!
  projectNamedSnapshot(projectId: ID!, snapshotNumber: Int!): NamedSnapshotState!
}