type Trigger implements Node {
    id: ID!
    createdAt: DateTime!
    updatedAt: DateTime!
    lastTriggered: DateTime
    workspaceId: ID!
    workspace: Workspace
    deployment: Deployment!
    deploymentId: ID!
    eventSource: EventSourceType!
    description: String!
    """
    The last characters of an API-driven trigger's auth token, for telling
    tokens apart. Null for a token set by hand before tokens were generated.
    """
    authTokenHint: String
    timeInterval: TimeInterval
    enabled: Boolean!
    variables: [Variable!]!
}

# Enums

enum EventSourceType {
    TIME_DRIVEN
    API_DRIVEN
}

enum TimeInterval {
    EVERY_DAY
    EVERY_HOUR
    EVERY_MONTH
    EVERY_WEEK
}

enum TriggerSortField {
    DESCRIPTION
    CREATED_AT
    UPDATED_AT
    LAST_TRIGGERED
}

# InputType

input TimeDriverInput {
    interval: TimeInterval!
}

input CreateTriggerInput {
    workspaceId: ID!
    deploymentId: ID!
    description: String!
    eventSource: EventSourceType!
    # Required for a time-driven trigger.
    timeDriverInput: TimeDriverInput
    enabled: Boolean!
    variables: [VariableInput!]
}

input UpdateTriggerInput {
    triggerId: ID!
    description: String
    deploymentId: ID
    eventSource: EventSourceType
    # Required to make a trigger time-driven, and enough on its own to change
    # its interval.
    timeDriverInput: TimeDriverInput
    enabled: Boolean
    variables: [VariableInput!]
}

# Payload

type TriggerPayload {
    trigger: Trigger!
    """
    The trigger's new auth token, only when this mutation issued one. It is
    never returned again.
    """
    authToken: String
}

# Connection

type TriggerConnection {
  nodes: [Trigger]!
  pageInfo: PageInfo!
  totalCount: Int!
}

# Query and Mutation

extend type Query {
    triggers(
      workspaceId: ID!
      keyword: String
      pagination: PageBasedPagination!
    ): TriggerConnection!
}

extend type Mutation {
    createTrigger(input: CreateTriggerInput!): TriggerPayload!
    updateTrigger(input: UpdateTriggerInput!): TriggerPayload!
    # Replaces an API-driven trigger's auth token; the old one stops working.
    regenerateTriggerToken(triggerId: ID!): TriggerPayload!
    deleteTrigger(triggerId: ID!): Boolean!
}
