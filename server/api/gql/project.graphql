type Project implements Node {
  alias: String!
  basicAuthPassword: String!
  basicAuthUsername: String!
  createdAt: DateTime!
  createdById: ID
  description: String!
  deployment: Deployment
  id: ID!
  isArchived: Boolean!
  isBasicAuthActive: Boolean!
  isLocked: Boolean!
  license: String!
  name: String!
  parameters: [Parameter!]!
  readme: String!
  starCount: Int!
  "Whether the current user has starred the project."
  starred: Boolean!
  topics: [String!]!
  updatedAt: DateTime!
  updatedById: ID
  sharedToken: String
  version: Int!
  visibility: ProjectVisibility!
  workspace: Workspace
  workspaceId: ID!
}

enum ProjectVisibility {
  PUBLIC
  PRIVATE
}

type ProjectAliasAvailability {
  alias: String!
  available: Boolean!
}

enum ProjectSortField {
  NAME
  CREATED_AT
  UPDATED_AT
  IS_LOCKED
}

# InputType

input CreateProjectInput {
  workspaceId: ID!
  name: String
  description: String
  archived: Boolean
  """
  5-32 letters, digits, '-' or '_', unique in the workspace. The 'p-' prefix is
  reserved for the default, p-<project ID>.
  """
  alias: String
  """
  Defaults to PUBLIC. PRIVATE is rejected unless the workspace's plan allows it;
  see workspacePolicy.
  """
  visibility: ProjectVisibility
  readme: String
  license: String
  topics: [String!]
}

input UpdateProjectInput {
  projectId: ID!
  name: String
  description: String
  archived: Boolean
  isBasicAuthActive: Boolean
  isLocked: Boolean
  basicAuthUsername: String
  basicAuthPassword: String
  alias: String
  "Changing to PRIVATE is rejected unless the workspace's plan allows it; see workspacePolicy."
  visibility: ProjectVisibility
  readme: String
  license: String
  "Replaces the topics; an empty list clears them."
  topics: [String!]
}

input DeleteProjectInput {
  projectId: ID!
}

input SetProjectStarInput {
  projectId: ID!
  starred: Boolean!
}

input RunProjectInput {
  projectId: ID!
  workspaceId: ID!
  file: Upload!
  previousJobId: ID
  startNodeId: ID
  parameters: [RunParameterInput!]
}

input PreviewSchemaInput {
  projectId: ID!
  workspaceId: ID!
  file: Upload!
  parameters: [RunParameterInput!]
  sampleSize: Int
}

# Payload

type ProjectPayload {
  project: Project!
}

type DeleteProjectPayload {
  projectId: ID!
}

type RunProjectPayload {
  job: Job!
}

type PreviewSchemaPayload {
  job: Job!
}

# Connection

type ProjectConnection {
  nodes: [Project]!
  pageInfo: PageInfo!
  totalCount: Int!
}

# Query and Mutation

extend type Query {
  projects(
    workspaceId: ID!
    includeArchived: Boolean
    keyword: String
    "Keep only the projects these users created. Null or empty lists every project."
    createdBy: [ID!]
    pagination: PageBasedPagination!
  ): ProjectConnection!
  """
  Whether alias is free in the workspace. Pass projectId when editing that
  project, so its own alias counts as available. An alias that breaks the alias
  rules returns an error rather than available: false.
  """
  checkProjectAlias(
    workspaceId: ID!
    alias: String!
    projectId: ID
  ): ProjectAliasAvailability!
}

extend type Mutation {
  createProject(input: CreateProjectInput!): ProjectPayload
  updateProject(input: UpdateProjectInput!): ProjectPayload
  deleteProject(input: DeleteProjectInput!): DeleteProjectPayload
  setProjectStar(input: SetProjectStarInput!): ProjectPayload
  runProject(input: RunProjectInput!): RunProjectPayload
  previewSchema(input: PreviewSchemaInput!): PreviewSchemaPayload!
}
