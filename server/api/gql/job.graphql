type Job implements Node {
  completedAt: DateTime
  deployment: Deployment
  deploymentId: ID
  debug: Boolean
  id: ID!
  logsURL: String
  workerLogsURL: String
  userFacingLogsURL: String
  outputURLs: [String!]
  startedAt: DateTime!
  status: JobStatus!
  workspace: Workspace
  workspaceId: ID!
  logs(since: DateTime!): [Log]
  variables: [Variable!]!
  failedNodes: [Diagnostic!]
  droppedEventCount: Int
  "Diagnostics for one node. Pass an empty nodeId for the job-level bucket."
  nodeDiagnostics(nodeId: String!): [Diagnostic!]
  "The trigger that started the job."
  triggerId: ID
  trigger: Trigger
  "Where outside Flow the job was started from."
  origin: JobOrigin
}

"Where outside Flow a job was started from."
type JobOrigin {
  cmsItem: CMSItemJobOrigin
}

"The CMS item a run was started for. Names are a display snapshot."
type CMSItemJobOrigin {
  projectId: ID!
  modelId: ID!
  itemId: ID!
  "The CMS Flow connection that started the run."
  connectionId: ID!
  projectName: String!
  modelName: String!
  itemTitle: String!
}

enum JobStatus {
  CANCELLED
  COMPLETED
  FAILED
  "Never emitted by the runtime; retained for API compatibility."
  PENDING
  RUNNING
}

enum JobSortField {
  STARTED_AT
  COMPLETED_AT
  STATUS
}

# InputType
input CancelJobInput {
  jobId: ID!
}

# Payloads
type CancelJobPayload {
  job: Job
}

# Connection

type JobConnection {
  nodes: [Job]!
  pageInfo: PageInfo!
  totalCount: Int!
}

# Subscripton Types

extend type Subscription {
  jobStatus(jobId: ID!): JobStatus!
}

# Query and Mutation

extend type Query {
  jobs(
    workspaceId: ID!
    keyword: String
    pagination: PageBasedPagination!
  ): JobConnection!
  job(id: ID!): Job
}

extend type Mutation {
  cancelJob(input: CancelJobInput!): CancelJobPayload!
}
