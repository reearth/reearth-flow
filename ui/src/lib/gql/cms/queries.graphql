query GetCmsProjectByIdOrAlias($workspaceId: ID!, $projectIdOrAlias: ID!) {
  cmsProject(workspaceId: $workspaceId, projectIdOrAlias: $projectIdOrAlias) {
    ...CmsProject
  }
}

query GetCmsProjects(
  $workspaceIds: [ID!]!
  $keyword: String
  $publicOnly: Boolean
  $page: Int
  $pageSize: Int
) {
  cmsProjects(
    workspaceIds: $workspaceIds
    keyword: $keyword
    publicOnly: $publicOnly
    page: $page
    pageSize: $pageSize
  ) {
    ...CmsProject
  }
}

query GetCmsModels(
  $workspaceId: ID!
  $projectId: ID!
  $page: Int
  $pageSize: Int
) {
  cmsModels(
    workspaceId: $workspaceId
    projectId: $projectId
    page: $page
    pageSize: $pageSize
  ) {
    models {
      ...CmsModel
    }
    totalCount
  }
}

query GetCmsItems(
  $workspaceId: ID!
  $projectId: ID!
  $modelId: ID!
  $keyword: String
  $page: Int
  $pageSize: Int
) {
  cmsItems(
    workspaceId: $workspaceId
    projectId: $projectId
    modelId: $modelId
    keyword: $keyword
    page: $page
    pageSize: $pageSize
  ) {
    items {
      ...CmsItem
    }
    totalCount
  }
}

query GetCmsAsset($workspaceId: ID!, $assetId: ID!) {
  cmsAsset(workspaceId: $workspaceId, assetId: $assetId) {
    ...CmsAsset
  }
}

query GetCmsModelExportUrl(
  $workspaceId: ID!
  $projectId: ID!
  $modelId: ID!
  $exportType: CMSExportType!
) {
  cmsModelExportUrl(
    workspaceId: $workspaceId
    projectId: $projectId
    modelId: $modelId
    exportType: $exportType
  )
}
