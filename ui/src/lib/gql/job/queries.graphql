query GetJobs(
  $workspaceId: ID!
  $keyword: String
  $pagination: PageBasedPagination!
) {
  jobs(workspaceId: $workspaceId, keyword: $keyword, pagination: $pagination) {
    totalCount
    nodes {
      ...Job
    }
    pageInfo {
      totalCount
      currentPage
      totalPages
    }
  }
}

# The values the run used come only with the single job, so the jobs list does
# not load them for every row.
query GetJob($id: ID!) {
  job(id: $id) {
    ...Job
    variables {
      key
      type
      value
    }
  }
}

mutation CancelJob($input: CancelJobInput!) {
  cancelJob(input: $input) {
    job {
      ...Job
    }
  }
}
