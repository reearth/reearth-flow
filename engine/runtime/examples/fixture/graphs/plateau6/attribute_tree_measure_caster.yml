id: d9f0c1d7-3bd4-49d8-a8ba-f56994776d22
name: AttributeTreeMeasureCaster
# Stopgap for schema-driven typing: `{name}` with a `{name}_uom` sibling is a measure and becomes a float.
# Multi-token lists and non-numeric strings are left alone, since float() fails on them.
nodes:
  - id: 8829e033-7b04-4226-a93a-a77966d30bab
    name: InputRouter
    type: action
    action: Input Router
    with:
      routingPort: features

  - id: 261b0bed-2b1f-47e3-86d2-cc3916c3b3bc
    name: AttributeManagerCastMeasures
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: __city_gml_attributes
          method: convert
          value:
            type: flowExpr
            value: |
              to_number = fn(v) {
                if type(v) != str { return v; }
                s = v.strip();
                if len(s) > 0 and len(s.split(" ")) == 1 { float(s) } else { v }
              };
              tree = attributes.get("__city_gml_attributes");
              stack = [];
              if type(tree) == dict or type(tree) == list { stack.append(tree); }
              while len(stack) > 0 {
                node = stack.pop();
                if type(node) == dict {
                  for k in node.keys() {
                    if k.ends_with("_uom") {
                      base = k.remove_suffix("_uom");
                      v = node.get(base);
                      if type(v) == list { node[base] = itertools.map(v, to_number); } else if v != null { node[base] = to_number(v); }
                    }
                  }
                  for v in node.values() {
                    if type(v) == dict or type(v) == list { stack.append(v); }
                  }
                } else {
                  for v in node {
                    if type(v) == dict or type(v) == list { stack.append(v); }
                  }
                }
              }
              tree

  - id: bee00d91-7195-46e6-8d27-d7942c92a774
    name: OutputRouter
    type: action
    action: Output Router
    with:
      routingPort: features

edges:
  - id: 0cd4a8bf-6166-4a3f-885f-a01ee0333a51
    from: 8829e033-7b04-4226-a93a-a77966d30bab
    to: 261b0bed-2b1f-47e3-86d2-cc3916c3b3bc
    fromPort: features
    toPort: features
  - id: 7d1ffb53-1e52-4ab8-9985-bbdce4350ca1
    from: 261b0bed-2b1f-47e3-86d2-cc3916c3b3bc
    to: bee00d91-7195-46e6-8d27-d7942c92a774
    fromPort: features
    toPort: features
