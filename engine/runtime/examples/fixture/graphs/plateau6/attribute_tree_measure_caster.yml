id: d9f0c1d7-3bd4-49d8-a8ba-f56994776d22
name: AttributeTreeMeasureCaster
# Stopgap for schema-driven typing: `{name}` with a `{name}@uom` sibling is a measure and becomes a float,
# and the sibling is renamed `{name}_uom`, the key the plateau outputs use.
# Each dict is rebuilt in key order so `{name}_uom` lands right after `{name}` (an in-place rename would append it last).
# Multi-token lists are left alone. A float() failure means the PLATEAU dataset is invalid, and is reported.
nodes:
  - id: 8829e033-7b04-4226-a93a-a77966d30bab
    name: InputRouter
    type: action
    action: Input Router
    with:
      routingPort: features

  - id: 261b0bed-2b1f-47e3-86d2-cc3916c3b3bc
    name: AttributeManagerCastMeasures
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: __city_gml_attributes
          method: convert
          value:
            type: flowExpr
            value: |
              to_number = fn(v) {
                if type(v) != str { return v; }
                s = v.strip();
                if len(s) > 0 and len(s.split(" ")) == 1 { float(s) } else { v }
              };
              tree = attributes.get("__city_gml_attributes");
              stack = [];
              if type(tree) == dict or type(tree) == list { stack.append(tree); }
              while len(stack) > 0 {
                node = stack.pop();
                if type(node) == dict {
                  rebuilt = {};
                  for k in node.keys() {
                    v = node[k];
                    if k.ends_with("@uom") {
                      base = k.remove_suffix("@uom");
                      if node.get(base) == null { rebuilt[base + "_uom"] = v; }
                    } else {
                      uom = node.get(k + "@uom");
                      if uom == null {
                        rebuilt[k] = v;
                      } else {
                        if type(v) == list { rebuilt[k] = itertools.map(v, to_number); } else if v != null { rebuilt[k] = to_number(v); } else { rebuilt[k] = v; }
                        rebuilt[k + "_uom"] = uom;
                      }
                    }
                  }
                  for k in node.keys() { node.pop(k); }
                  for k in rebuilt.keys() { node[k] = rebuilt[k]; }
                  for v in node.values() {
                    if type(v) == dict or type(v) == list { stack.append(v); }
                  }
                } else {
                  for v in node {
                    if type(v) == dict or type(v) == list { stack.append(v); }
                  }
                }
              }
              tree

  - id: bee00d91-7195-46e6-8d27-d7942c92a774
    name: OutputRouter
    type: action
    action: Output Router
    with:
      routingPort: features

