id: 833b0700-a741-4411-bfae-c310f7e3dc0c
name: AttributeTreePruner
# Cleans __city_gml_attributes after the reader removed geometry and extracted children.
# Under any key in the workflow variable attributeTreePruneScope (that key and everything
# below it), values left empty ("", {} or []) are removed bottom-up; a non-empty value keeps
# its ancestors. Outside the scope nothing is removed. A feature holding nothing but geometry
# reads as "", so the root is forced to a dict.
nodes:
  - id: 2456c81b-0f8e-401e-b49e-224e627600fa
    name: InputRouter
    type: action
    action: Input Router
    with:
      routingPort: features

  - id: eee07dac-2be4-4ce3-9355-6d0d2bba757d
    name: AttributeManagerPruneScope
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: __city_gml_attributes
          method: convert
          value:
            type: flowExpr
            value: |
              scope = variables.get("attributeTreePruneScope", []);
              is_empty = fn(v) {
                if type(v) == dict or type(v) == list { len(v) == 0 } else { v == "" }
              };
              tree = attributes.get("__city_gml_attributes");
              if type(tree) != dict { tree = {}; }
              # preorder walk with a manual stack: [container, whether it is in scope]
              order = [];
              stack = [[tree, false]];
              while len(stack) > 0 {
                let [node, in_scope] = stack.pop();
                order.append([node, in_scope]);
                if type(node) == dict {
                  for pair in node.items() {
                    if type(pair[1]) == dict or type(pair[1]) == list {
                      stack.append([pair[1], in_scope or pair[0] in scope]);
                    }
                  }
                } else {
                  for v in node {
                    if type(v) == dict or type(v) == list { stack.append([v, in_scope]); }
                  }
                }
              }
              # reverse preorder visits children before parents, so emptiness cascades up
              i = len(order) - 1;
              while i >= 0 {
                let [node, in_scope] = order[i];
                if type(node) == dict {
                  gone = [];
                  for pair in node.items() {
                    if (in_scope or pair[0] in scope) and is_empty(pair[1]) { gone.append(pair[0]); }
                  }
                  for k in gone { node.pop(k); }
                } else if in_scope {
                  j = len(node) - 1;
                  while j >= 0 {
                    if is_empty(node[j]) { node.pop(j); }
                    j = j - 1;
                  }
                }
                i = i - 1;
              }
              tree

  - id: 71ed38d6-cd25-42cb-a76a-9c1fe0de3dd8
    name: OutputRouter
    type: action
    action: Output Router
    with:
      routingPort: features

edges:
  - id: 5e61dbb0-809b-42c7-833a-c9354dae9423
    from: 2456c81b-0f8e-401e-b49e-224e627600fa
    to: eee07dac-2be4-4ce3-9355-6d0d2bba757d
    fromPort: features
    toPort: features
  - id: be2d56b8-dd5a-45f8-9126-6a71b1e5fa5d
    from: eee07dac-2be4-4ce3-9355-6d0d2bba757d
    to: 71ed38d6-cd25-42cb-a76a-9c1fe0de3dd8
