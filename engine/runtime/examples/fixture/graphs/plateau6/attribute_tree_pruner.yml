id: 833b0700-a741-4411-bfae-c310f7e3dc0c
name: AttributeTreePruner
nodes:
  - id: 2456c81b-0f8e-401e-b49e-224e627600fa
    name: InputRouter
    type: action
    action: Input Router
    with:
      routingPort: features

  - id: eee07dac-2be4-4ce3-9355-6d0d2bba757d
    name: AttributeManagerPruneTree
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: __city_gml_attributes
          method: convert
          value:
            type: flowExpr
            value: |
              drop_keys = variables.get("attributeTreeDropKeys", []);
              tree = attributes.get("__city_gml_attributes");
              # a feature holding only geometry reads as an empty string
              if type(tree) != dict { tree = {}; }
              stack = [tree];
              while len(stack) > 0 {
                node = stack.pop();
                for key in drop_keys { node.pop(key); }
                regrouped = {};
                for key in node.keys() {
                  values = node[key];
                  if type(values) != list { values = [values]; }
                  for value in values {
                    name = key;
                    content = value;
                    if type(value) == dict and len(value) == 1 and type(value.values()[0]) != list {
                      name = value.keys()[0];
                      content = value.values()[0];
                    }
                    if regrouped.get(name) == null { regrouped[name] = []; }
                    regrouped[name].append(content);
                  }
                }
                for key in node.keys() { node.pop(key); }
                for name in regrouped.keys() {
                  contents = regrouped[name];
                  if len(contents) == 1 and type(contents[0]) != dict { node[name] = contents[0]; } else { node[name] = contents; }
                  for content in contents { if type(content) == dict { stack.append(content); } }
                }
              }
              tree

  - id: 71ed38d6-cd25-42cb-a76a-9c1fe0de3dd8
    name: OutputRouter
    type: action
    action: Output Router
    with:
      routingPort: features

edges:
  - id: 5e61dbb0-809b-42c7-833a-c9354dae9423
    from: 2456c81b-0f8e-401e-b49e-224e627600fa
    to: eee07dac-2be4-4ce3-9355-6d0d2bba757d
    fromPort: features
    toPort: features
  - id: be2d56b8-dd5a-45f8-9126-6a71b1e5fa5d
    from: eee07dac-2be4-4ce3-9355-6d0d2bba757d
    to: 71ed38d6-cd25-42cb-a76a-9c1fe0de3dd8
    fromPort: features
    toPort: features
