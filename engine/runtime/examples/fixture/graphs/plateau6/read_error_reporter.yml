id: e0000000-0000-4000-8000-000000000000
name: PLATEAU6.ReadErrorReporter
# Reports what the Feature CityGML 3 Reader rejected: XML the schema accepts
# but the reader cannot read, such as a posList whose ordinate count is not a
# multiple of three. Every rejected site is reported whatever feature type it
# was found in, one row each in read_errors.csv.
#
# Expects the reader's `rejected` port with `includeRejectedDetails` set, and
# the file's `fileIndex`, `package` and `name` attributes. `summaryOutput`
# carries one feature per package with the row count in `totalErrorCount`.
nodes:
  - id: e0000000-0000-4000-8000-000000000001
    name: InputRouter
    type: action
    action: Input Router
    with:
      routingPort: features

  - id: e0000000-0000-4000-8000-000000000002
    name: ReadErrorAttributeMapper
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: Index
          valueAttribute: fileIndex
        - attribute: Folder
          valueAttribute: package
        - attribute: Filename
          valueAttribute: name
        - attribute: FeatureType
          expr:
            type: flowExpr
            value: attributes["rejectedResult"]["cityObjectType"].split(":")[-1]
        - attribute: GmlId
          expr:
            type: flowExpr
            value: attributes["rejectedResult"]["cityObjectId"]
        - attribute: Location
          expr:
            type: flowExpr
            value: attributes["rejectedResult"]["location"]
        - attribute: "エラー内容"
          expr:
            type: flowExpr
            value: attributes["rejectedResult"]["kind"]

  - id: e0000000-0000-4000-8000-000000000003
    name: ReadErrorCsvWriter
    type: action
    action: Feature Writer
    with:
      format:
        type: csv
      output:
        type: string
        value: read_errors.csv

  - id: e0000000-0000-4000-8000-000000000004
    name: ReadErrorCounter
    type: action
    action: Statistics Calculator
    with:
      groupBy:
        - Folder
      calculations:
        - newAttribute: totalErrorCount
          expr:
            type: flowExpr
            value: "1"

  - id: e0000000-0000-4000-8000-000000000005
    name: OutputRouter
    type: action
    action: Output Router
    with:
      routingPort: features

  - id: e0000000-0000-4000-8000-000000000006
    name: OutputRouterSummary
    type: action
    action: Output Router
    with:
      routingPort: summaryOutput

edges:
  - id: e0000000-0000-4000-8000-000100000001
    from: e0000000-0000-4000-8000-000000000001
    to: e0000000-0000-4000-8000-000000000002
    fromPort: features
    toPort: features
  - id: e0000000-0000-4000-8000-000100000002
    from: e0000000-0000-4000-8000-000000000002
    to: e0000000-0000-4000-8000-000000000003
    fromPort: features
    toPort: features
  - id: e0000000-0000-4000-8000-000100000003
    from: e0000000-0000-4000-8000-000000000002
    to: e0000000-0000-4000-8000-000000000004
    fromPort: features
    toPort: features
  - id: e0000000-0000-4000-8000-000100000004
    from: e0000000-0000-4000-8000-000000000003
    to: e0000000-0000-4000-8000-000000000005
    fromPort: features
    toPort: features
  - id: e0000000-0000-4000-8000-000100000005
    from: e0000000-0000-4000-8000-000000000004
    to: e0000000-0000-4000-8000-000000000006
    fromPort: features
    toPort: features
