    to: c4000000-0000-4000-8000-000000000005
    fromPort: features
    toPort: features
  - id: c4000000-0000-4000-8000-000000000105
    from: c4000000-0000-4000-8000-000000000005
    to: c4000000-0000-4000-8000-000000000006
    fromPort: failed
    toPort: features
  - id: c4000000-0000-4000-8000-000000000106
    from: c4000000-0000-4000-8000-000000000006
    to: c4000000-0000-4000-8000-000000000007
    fromPort: features
    toPort: features
  - id: c4000000-0000-4000-8000-000000000107
    from: c4000000-0000-4000-8000-000000000007
    to: c4000000-0000-4000-8000-000000000008
    fromPort: features
    toPort: features

  ## Issue locations
  - id: c4000000-0000-4000-8000-000000000110
    from: c4000000-0000-4000-8000-000000000005
    to: c4000000-0000-4000-8000-000000000010
    fromPort: issue-locations
    toPort: features
  - id: c4000000-0000-4000-8000-000000000111
    from: c4000000-0000-4000-8000-000000000010
    to: c4000000-0000-4000-8000-000000000014
    fromPort: features
    toPort: features
  - id: c4000000-0000-4000-8000-000000000118
    from: c4000000-0000-4000-8000-000000000014
    to: c4000000-0000-4000-8000-000000000013
    fromPort: unfiltered
    toPort: features
  - id: c4000000-0000-4000-8000-000000000119
    from: c4000000-0000-4000-8000-000000000014
    to: c4000000-0000-4000-8000-000000000011
    fromPort: closePair
    toPort: features
  - id: c4000000-0000-4000-8000-000000000117
    from: c4000000-0000-4000-8000-000000000013
    to: c4000000-0000-4000-8000-000000000011
    fromPort: features
    toPort: features

  ## Self-intersections, one per ring
  - id: c4000000-0000-4000-8000-00000000011b
    from: c4000000-0000-4000-8000-000000000010
    to: c4000000-0000-4000-8000-000000000016
    fromPort: features
    toPort: features
  - id: c4000000-0000-4000-8000-00000000011c
    from: c4000000-0000-4000-8000-000000000016
    to: c4000000-0000-4000-8000-000000000017
    fromPort: selfIntersection
    toPort: features
  - id: c4000000-0000-4000-8000-00000000011d
    from: c4000000-0000-4000-8000-000000000017
    to: c4000000-0000-4000-8000-000000000018
    fromPort: features
    toPort: features
  - id: c4000000-0000-4000-8000-00000000011e
    from: c4000000-0000-4000-8000-000000000018
    to: c4000000-0000-4000-8000-000000000019
    fromPort: features
    toPort: features
  - id: c4000000-0000-4000-8000-00000000011f
    from: c4000000-0000-4000-8000-000000000019
    to: c4000000-0000-4000-8000-000000000008
    fromPort: features
    toPort: features
  # A face whose stored geometry will not decode is still reported, at the
  # flagged position.
  - id: c4000000-0000-4000-8000-000000000120
    from: c4000000-0000-4000-8000-000000000019
