id: c4000000-0000-4000-8000-000000000000
name: PLATEAU6.SurfaceChecks
# Validates every face of the incoming geometry. Emits one feature per failed
# check per face on `invalidSurface` with the check name in `issue` and the
# number of flagged spots in `issueCount`, except that a self-intersection is
# one feature per ring and a crossing of two rings one feature per ring pair,
# each counted once. Also emits every
# face whose 2D exterior ring is wound against the coordinate frame on
# `incorrectOrientation`. `issueLocation` repeats the same failures as a point
# at the first vertex of the spot each check flagged, or for L07 as the two
# vertices of the close pair, for error detail output.
# Geometry no step could handle also leaves via `invalidSurface`, so nothing is
# dropped silently.
# Both face ports emit the face as modelled: the orientation branch restores the
# 3D face that its flattened check consumed.
nodes:
  - id: c4000000-0000-4000-8000-000000000001
    name: InputRouter
    type: action
    action: Input Router
    with:
      routingPort: features

  - id: c4000000-0000-4000-8000-000000000002
    name: GeometryCoercerFaces
    type: action
    action: Geometry Coercer
    with:
      targetType: polygon

  - id: c4000000-0000-4000-8000-000000000003
    name: GeometrySplitterMembers
    type: action
    action: Geometry Splitter

  # A welded CompositeSurface coerces into a collection nested inside its
  # MultiSurface, so reaching the faces takes a second split. A face that is
  # already alone passes through unchanged.
  - id: c4000000-0000-4000-8000-000000000004
    name: GeometrySplitterFaces
    type: action
    action: Geometry Splitter

  # The per-ring findings are counted against this id.
  - id: c4000000-0000-4000-8000-000000000015
    name: FeatureCounterSurfaceId
    type: action
    action: Feature Counter
    with:
      countStart: 1
      outputAttribute: _surface_id

  # Every face port reports the face as modelled, so it is kept aside before any
  # step replaces or flattens it.
  - id: c4000000-0000-4000-8000-00000000000e
    name: GeometryExtractorFace
    type: action
    action: Geometry Extractor
    with:
      outputAttribute: original_face_geometry

  # L07 (ClosePairs mode): every pair of vertices closer than `duplicateTolerance`,
  # adjacent or not, is one error. The tolerance is needed because a reprojected
  # surface does not preserve exact coordinate equality. The planarity tolerance
  # differs by caller, so `planarityThreshold` is passed in through the sub-graph
  # call's `with`.
  # TODO: L07 (hasError exclusion): drop the `DuplicatePoints` results of city
  # objects whose `urc:hasError` is 1, 2 or 3.
  - id: c4000000-0000-4000-8000-000000000005
    name: GeometryValidatorFace
    type: action
    action: Geometry Validator
    with:
      duplicateTolerance: 0.01
      duplicateCounting: closePairs

  # Self-intersections are counted per ring from the issue locations instead.
  - id: c4000000-0000-4000-8000-000000000006
    name: AttributeManagerIssues
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: _issues
          method: create
          value:
            type: flowExpr
            value: |
              names = {
                "DuplicatePoints": "DuplicateConsecutivePoints",
                "InteriorRingContainment": "InteriorRingNotContainedInExteriorRing",
                "Planarity": "NonPlanarSurface",
                "Orientation": "IncorrectInteriorOrientation",
                "UnclosedRing": "RingNotClosed",
                "Degenerate": "DegenerateSurface",
                "Finite": "NonFiniteCoordinate",
              };
              checks = attributes["validationResult"]["checks"];
              keys = itertools.filter(itertools.sorted(checks.keys()), fn(k) { k != "SelfIntersection" });
              itertools.map(keys, fn(k) { {"issue": names.get(k, k), "issueCount": checks[k]} })

  - id: c4000000-0000-4000-8000-000000000007
    name: ListExploderIssues
    type: action
    action: List Exploder
    with:
      sourceAttribute: _issues

  - id: c4000000-0000-4000-8000-000000000008
    name: InvalidSurfaceRouter
    type: action
    action: Output Router
    with:
      routingPort: invalidSurface

  # Only the exterior ring's winding is reported here. A hole wound the same way
  # as its exterior is already a failed `Orientation` check on the 3D pass, so
  # letting the holes through would report the same face twice.
  - id: c4000000-0000-4000-8000-000000000012
    name: HoleExtractorFace
    type: action
    action: Hole Extractor

  # The absolute winding of a ring is a 2D property, so the exterior ring is
  # flattened before the orientation check reads it.
  - id: c4000000-0000-4000-8000-000000000009
    name: TwoDimensionForcer
    type: action
    action: Two Dimension Forcer

  # Only its `Orientation` result is read; the 3D pass above owns every other
  # check, so this one needs no thresholds of its own.
  - id: c4000000-0000-4000-8000-00000000000a
    name: GeometryValidatorOutline
    type: action
    action: Geometry Validator

  - id: c4000000-0000-4000-8000-00000000000b
    name: FeatureFilterByOrientation
    type: action
    action: Feature Filter
    with:
      conditions:
        - expr:
            type: flowExpr
            value: attributes["validationResult"]["checks"].get("Orientation", 0) > 0
          outputPort: incorrectOrientation

  - id: c4000000-0000-4000-8000-00000000000f
    name: GeometryReplacerFace
    type: action
    action: Geometry Replacer
    with:
      sourceAttribute: original_face_geometry

  - id: c4000000-0000-4000-8000-00000000000c
    name: IncorrectOrientationRouter
    type: action
    action: Output Router
    with:
      routingPort: incorrectOrientation

  # One feature per position the 3D pass flagged, carrying the position as its
  # geometry. Same name table as `AttributeManagerIssues`, applied to the
  # single check that produced this position. Where two rings cross is not a
  # self-intersection of either, but a hole outside the exterior or two holes
  # intersecting (L13).
  - id: c4000000-0000-4000-8000-000000000010
    name: AttributeManagerIssueLocation
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: issue
          method: create
          value:
            type: flowExpr
            value: |
              names = {
                "DuplicatePoints": "DuplicateConsecutivePoints",
                "InteriorRingContainment": "InteriorRingNotContainedInExteriorRing",
                "Planarity": "NonPlanarSurface",
                "Orientation": "IncorrectInteriorOrientation",
                "UnclosedRing": "RingNotClosed",
                "Degenerate": "DegenerateSurface",
                "Finite": "NonFiniteCoordinate",
              };
              check = attributes["validationCheck"];
              issue = names.get(check, check);
              if check == "SelfIntersection" and "validationRingPair" in attributes {
                if attributes["validationRingPair"][0] == 0 {
                  issue = "InteriorRingNotContainedInExteriorRing";
                } else {
                  issue = "InteriorRingsIntersect";
                }
              }
              issue

  # L08 (per-ring counting): a ring that intersects or touches itself, or
  # overlaps its own edges, is one error however many spots it has. A crossing
  # of two rings is likewise one error per ring pair.
  - id: c4000000-0000-4000-8000-000000000016
    name: FeatureFilterSelfIntersectionLocation
    type: action
    action: Feature Filter
    with:
      conditions:
        - expr:
            type: flowExpr
            value: attributes["validationCheck"] == "SelfIntersection"
          outputPort: selfIntersection

  - id: c4000000-0000-4000-8000-000000000017
    name: AttributeManagerRingPart
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: _issue_part
          method: create
          value:
            type: flowExpr
            value: |
              part = "";
              if "validationRingPair" in attributes {
                part = str(attributes["validationRingPair"]);
              } else if "validationRing" in attributes {
                part = str(attributes["validationRing"]);
              }
              part
        - attribute: issueCount
          method: create
          value:
            type: flowExpr
            value: "1"

  - id: c4000000-0000-4000-8000-000000000018
    name: AttributeDuplicateFilterRing
    type: action
    action: Attribute Duplicate Filter
    with:
      filterBy:
        - _surface_id
        - issue
        - _issue_part

  - id: c4000000-0000-4000-8000-000000000019
    name: GeometryReplacerRingFace
    type: action
    action: Geometry Replacer
    with:
      sourceAttribute: original_face_geometry

  # An L07 position holds both vertices of the close pair, so it skips the
  # first-vertex replacement.
  - id: c4000000-0000-4000-8000-000000000014
    name: FeatureFilterClosePairLocation
    type: action
    action: Feature Filter
    with:
      conditions:
        - expr:
            type: flowExpr
            value: attributes["validationCheck"] == "DuplicatePoints"
          outputPort: closePair

  # A flagged ring or line is reported at its first vertex, as the original
  # does.
  - id: c4000000-0000-4000-8000-000000000013
    name: GeometryReplacerIssuePoint
    type: action
    action: Geometry Replacer
    with:
      sourceAttribute: validationPoint

  - id: c4000000-0000-4000-8000-000000000011
    name: IssueLocationRouter
    type: action
    action: Output Router
    with:
      routingPort: issueLocation

  - id: c4000000-0000-4000-8000-00000000000d
    name: AttributeManagerRejected
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: issue
          method: create
          value:
            type: string
            value: GeometryRejected
        - attribute: issueCount
          method: create
          value:
            type: flowExpr
            value: "1"

edges:
  - id: c4000000-0000-4000-8000-000000000101
    from: c4000000-0000-4000-8000-000000000001
    to: c4000000-0000-4000-8000-000000000002
    fromPort: features
    toPort: features
  - id: c4000000-0000-4000-8000-000000000102
    from: c4000000-0000-4000-8000-000000000002
    to: c4000000-0000-4000-8000-000000000003
    fromPort: features
    toPort: features
  - id: c4000000-0000-4000-8000-000000000103
    from: c4000000-0000-4000-8000-000000000003
    to: c4000000-0000-4000-8000-000000000004
    fromPort: features
    toPort: features

  - id: c4000000-0000-4000-8000-000000000104
    from: c4000000-0000-4000-8000-000000000004
    to: c4000000-0000-4000-8000-000000000015
    fromPort: features
    toPort: features
  - id: c4000000-0000-4000-8000-00000000011a
    from: c4000000-0000-4000-8000-000000000015
    to: c4000000-0000-4000-8000-00000000000e
    fromPort: features
    toPort: features

  ## Surface errors
  - id: c4000000-0000-4000-8000-000000000108
