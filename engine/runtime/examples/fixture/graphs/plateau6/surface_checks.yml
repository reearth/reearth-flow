    toPort: features
  # `hole` is deliberately unwired: interior rings are the 3D pass's business.
  - id: c4000000-0000-4000-8000-000000000115
    from: c4000000-0000-4000-8000-000000000012
    to: c4000000-0000-4000-8000-000000000009
    fromPort: exterior
    toPort: features
  - id: c4000000-0000-4000-8000-000000000109
    from: c4000000-0000-4000-8000-000000000009
