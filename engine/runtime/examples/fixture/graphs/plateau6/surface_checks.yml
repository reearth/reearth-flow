id: c4000000-0000-4000-8000-000000000000
name: PLATEAU6.SurfaceChecks
# Validates every face of the incoming geometry. Emits one feature per failed
# check per face on `invalidSurface` with the check name in `issue` and the
# number of flagged spots in `issueCount`, except that a self-intersection is
# one feature per ring, a crossing of two rings one feature per hole involved,
# and an interior wound the same way as its exterior one feature per interior
# (L10), each counted once. `issueLocation` repeats the same failures as a point
# at the first vertex of the spot each check flagged, or for L07 as the two
# vertices of the close pair, for error detail output.
# Geometry no step could handle also leaves via `invalidSurface`, so nothing is
# dropped silently.
#
# L10 (per-boundary orientation): a misoriented boundary of a face is one
# feature, carrying the boundary as a line string and `issue` naming the
# exterior or an interior boundary, on `incorrectOrientationUpward`. It judges
# the face seen from above (exterior counter-clockwise, interiors clockwise), for
# faces that represent an area on the ground. A caller that reads it drops the
# `IncorrectInteriorOrientation` rows of `invalidSurface` and `issueLocation`
# for the same faces, so an interior is not counted twice.
#
# A face with a degenerate boundary gets no orientation result at all, from
# either judgement and for its other boundaries too. The degeneracy is reported
# first and the orientation is judged once the face is fixed, as a
# self-intersection holds back the hole checks (L13).
nodes:
  - id: c4000000-0000-4000-8000-000000000001
    name: InputRouter
    type: action
    action: Input Router
    with:
      routingPort: features

  - id: c4000000-0000-4000-8000-000000000002
    name: GeometryCoercerFaces
    type: action
    action: Geometry Coercer
    with:
      targetType: polygon

  - id: c4000000-0000-4000-8000-000000000003
    name: GeometrySplitterMembers
    type: action
    action: Geometry Splitter

  # A welded CompositeSurface coerces into a collection nested inside its
  # MultiSurface, so reaching the faces takes a second split. A face that is
  # already alone passes through unchanged.
  - id: c4000000-0000-4000-8000-000000000004
    name: GeometrySplitterFaces
    type: action
    action: Geometry Splitter

  # The per-ring findings are counted against this id.
  - id: c4000000-0000-4000-8000-000000000015
    name: FeatureCounterSurfaceId
    type: action
    action: Feature Counter
    with:
      countStart: 1
      outputAttribute: _surface_id

  # Every face port reports the face as modelled, so it is kept aside before any
  # step replaces or flattens it.
  - id: c4000000-0000-4000-8000-00000000000e
    name: GeometryExtractorFace
    type: action
    action: Geometry Extractor
    with:
      outputAttribute: original_face_geometry

  # L07 (ClosePairs mode): every pair of vertices closer than `duplicateTolerance`,
  # adjacent or not, is one error. The tolerance is needed because a reprojected
  # surface does not preserve exact coordinate equality. The planarity tolerance
  # differs by caller, so `planarityThreshold` is passed in through the sub-graph
  # call's `with`.
  # TODO: L07 (hasError exclusion): drop the `DuplicatePoints` results of city
  # objects whose `urc:hasError` is 1, 2 or 3.
  # TODO: L09 (hasError exclusion): drop the `UnclosedRing` results of the same
  # city objects. Their `SelfIntersection` (L08) results are kept.
  - id: c4000000-0000-4000-8000-000000000005
    name: GeometryValidatorFace
    type: action
    action: Geometry Validator
    with:
      duplicateTolerance: 0.01
      duplicateCounting: closePairs

  # Self-intersections and the hole checks are counted per ring or ring pair from
  # the issue locations instead, and so is the orientation of an interior (L10).
  - id: c4000000-0000-4000-8000-000000000006
    name: AttributeManagerIssues
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: _issues
          method: create
          value:
            type: flowExpr
            value: |
              names = {
                "DuplicatePoints": "DuplicateConsecutivePoints",
                "InteriorRingContainment": "InteriorRingNotContainedInExteriorRing",
                "Planarity": "NonPlanarSurface",
                "UnclosedRing": "RingNotClosed",
                "Degenerate": "DegenerateSurface",
                "Finite": "NonFiniteCoordinate",
              };
              checks = attributes["validationResult"]["checks"];
              left_out = ["SelfIntersection", "InteriorRingContainment", "InteriorConnectivity", "Orientation"];
              keys = itertools.filter(itertools.sorted(checks.keys()), fn(k) { not (k in left_out) });
              itertools.map(keys, fn(k) { {"issue": names.get(k, k), "issueCount": checks[k]} })

  - id: c4000000-0000-4000-8000-000000000007
    name: ListExploderIssues
    type: action
    action: List Exploder
    with:
      sourceAttribute: _issues

  - id: c4000000-0000-4000-8000-000000000008
    name: InvalidSurfaceRouter
    type: action
    action: Output Router
    with:
      routingPort: invalidSurface

  # L10 (per-boundary orientation), judged from above: the absolute winding of a
  # boundary is a 2D property, so the whole face is flattened first. A face with
  # any boundary degenerate on the ground, such as a face standing upright, is
  # not judged, so none of its boundaries is reported.
  - id: c4000000-0000-4000-8000-000000000009
    name: TwoDimensionForcer
    type: action
    action: Two Dimension Forcer

  # Only its `Orientation` positions are read; the 3D pass above owns every
  # other check, so this one needs no thresholds of its own.
  - id: c4000000-0000-4000-8000-00000000000a
    name: GeometryValidatorOutline
    type: action
    action: Geometry Validator

  - id: c4000000-0000-4000-8000-00000000000b
    name: FeatureFilterByOrientation
    type: action
    action: Feature Filter
    with:
      conditions:
        - expr:
            type: flowExpr
            value: attributes["validationCheck"] == "Orientation"
          outputPort: orientation

  - id: c4000000-0000-4000-8000-00000000001b
    name: AttributeManagerBoundaryUpward
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: issue
          method: create
          value:
            type: flowExpr
            value: |
              issue = "IncorrectInteriorOrientation";
              if attributes["validationRing"] == 0 {
                issue = "IncorrectExteriorOrientation";
              }
              issue
        - attribute: issueCount
          method: create
          value:
            type: flowExpr
            value: "1"

  # The flagged boundary is taken from the face as modelled, so it keeps its
  # elevation: the face is broken into its boundaries, exterior first, and the
  # one at the flagged ring index is kept.
  - id: c4000000-0000-4000-8000-00000000000f
    name: GeometryReplacerFace
    type: action
    action: Geometry Replacer
    with:
      sourceAttribute: original_face_geometry

  - id: c4000000-0000-4000-8000-00000000001c
    name: GeometryCoercerBoundaries
    type: action
    action: Geometry Coercer
    with:
      targetType: lineString

  - id: c4000000-0000-4000-8000-00000000001d
    name: GeometrySplitterBoundaries
    type: action
    action: Geometry Splitter

  - id: c4000000-0000-4000-8000-00000000001e
    name: FeatureCounterBoundary
    type: action
    action: Feature Counter
    with:
      countStart: 0
      groupBy:
        - _surface_id
        - validationRing
      outputAttribute: _boundary_index

  - id: c4000000-0000-4000-8000-00000000001f
    name: FeatureFilterFlaggedBoundary
    type: action
    action: Feature Filter
    with:
      conditions:
        - expr:
            type: flowExpr
            value: attributes["_boundary_index"] == attributes["validationRing"]
          outputPort: flagged

  - id: c4000000-0000-4000-8000-00000000000c
    name: IncorrectOrientationUpwardRouter
    type: action
    action: Output Router
    with:
      routingPort: incorrectOrientationUpward

  # One feature per position the 3D pass flagged, carrying the position as its
  # geometry. Same name table as `AttributeManagerIssues`, applied to the
  # single check that produced this position. Where two rings cross, touch so
  # that the interior falls apart, or nest, is not a self-intersection of
  # either, but a hole outside the exterior or two holes intersecting (L13).
  - id: c4000000-0000-4000-8000-000000000010
    name: AttributeManagerIssueLocation
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: issue
          method: create
          value:
            type: flowExpr
            value: |
              names = {
                "DuplicatePoints": "DuplicateConsecutivePoints",
                "InteriorRingContainment": "InteriorRingNotContainedInExteriorRing",
                "Planarity": "NonPlanarSurface",
                "UnclosedRing": "RingNotClosed",
                "Degenerate": "DegenerateSurface",
                "Finite": "NonFiniteCoordinate",
                "Orientation": "IncorrectInteriorOrientation",
              };
              check = attributes["validationCheck"];
              issue = names.get(check, check);
              if "validationRingPair" in attributes and check in ["SelfIntersection", "InteriorRingContainment", "InteriorConnectivity"] {
                if attributes["validationRingPair"][0] == 0 {
                  issue = "InteriorRingNotContainedInExteriorRing";
                } else {
                  issue = "InteriorRingsIntersect";
                }
              }
              issue

  # L08 (per-ring counting): a ring that intersects or touches itself, or
  # overlaps its own edges, is one error however many spots it has. A hole
  # outside the exterior is one error per hole, and two rings that cross, touch
  # so that the interior falls apart, or nest are one error per hole involved
  # (L13), so two holes crossing each other are two errors. An interior wound the
  # same way as its exterior is one error per interior (L10).
  - id: c4000000-0000-4000-8000-000000000016
    name: FeatureFilterPerPartLocation
    type: action
    action: Feature Filter
    with:
      conditions:
        - expr:
            type: flowExpr
            value: attributes["validationCheck"] in ["SelfIntersection", "InteriorRingContainment", "InteriorConnectivity", "Orientation"]
          outputPort: perPart

  - id: c4000000-0000-4000-8000-000000000017
    name: AttributeManagerRingPart
    type: action
    action: Attribute Manager
    with:
      operations:
        # Ring 0 is the exterior; every other ring of a pair is a hole.
        - attribute: _issue_parts
          method: create
          value:
            type: flowExpr
            value: |
              parts = [{"_issue_part": ""}];
              if "validationRingPair" in attributes {
                pair = attributes["validationRingPair"];
                parts = [{"_issue_part": str(pair[1])}];
                if pair[0] != 0 {
                  parts = [{"_issue_part": str(pair[0])}, {"_issue_part": str(pair[1])}];
                }
              } else if "validationRing" in attributes {
                parts = [{"_issue_part": str(attributes["validationRing"])}];
              }
              parts
        - attribute: issueCount
          method: create
          value:
            type: flowExpr
            value: "1"

  - id: c4000000-0000-4000-8000-00000000001a
    name: ListExploderRingPart
    type: action
    action: List Exploder
    with:
      sourceAttribute: _issue_parts

  - id: c4000000-0000-4000-8000-000000000018
    name: AttributeDuplicateFilterRing
    type: action
    action: Attribute Duplicate Filter
    with:
      filterBy:
        - _surface_id
        - issue
        - _issue_part

  - id: c4000000-0000-4000-8000-000000000019
    name: GeometryReplacerRingFace
    type: action
    action: Geometry Replacer
    with:
      sourceAttribute: original_face_geometry

  # An L07 position holds both vertices of the close pair, so it skips the
  # first-vertex replacement.
  - id: c4000000-0000-4000-8000-000000000014
    name: FeatureFilterClosePairLocation
    type: action
    action: Feature Filter
    with:
      conditions:
        - expr:
            type: flowExpr
            value: attributes["validationCheck"] == "DuplicatePoints"
          outputPort: closePair

  # A flagged ring or line is reported at its first vertex, as the original
  # does.
  - id: c4000000-0000-4000-8000-000000000013
    name: GeometryReplacerIssuePoint
    type: action
    action: Geometry Replacer
    with:
      sourceAttribute: validationPoint

  - id: c4000000-0000-4000-8000-000000000011
    name: IssueLocationRouter
    type: action
    action: Output Router
    with:
      routingPort: issueLocation

  - id: c4000000-0000-4000-8000-00000000000d
    name: AttributeManagerRejected
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: issue
          method: create
          value:
            type: string
            value: GeometryRejected
        - attribute: issueCount
          method: create
          value:
            type: flowExpr
            value: "1"

