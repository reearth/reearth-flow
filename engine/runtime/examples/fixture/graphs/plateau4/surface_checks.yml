id: d4000000-0000-4000-8000-000000000000
name: PLATEAU4.SurfaceChecks
# Validates every face of the incoming geometry (solid shells are decomposed into
# their faces, multi-surfaces into their polygons). Emits one feature per failed
# check per face on `invalidSurface` with the check name in `issue`, and every
# face whose 2D outline is wound against the coordinate frame on
# `incorrectOrientation`. Geometry no step could handle also leaves via
# `invalidSurface`, so nothing is dropped silently.
nodes:
  - id: d4000000-0000-4000-8000-000000000001
    name: InputRouter
    type: action
    action: Input Router
    with:
      routingPort: features

  - id: d4000000-0000-4000-8000-000000000002
    name: GeometryCoercerFaces
    type: action
    action: Geometry Coercer
    with:
      targetType: polygon

  - id: d4000000-0000-4000-8000-000000000003
    name: GeometrySplitterMembers
    type: action
    action: Geometry Splitter

  # A welded CompositeSurface coerces into a collection nested inside its
  # MultiSurface, so reaching the faces takes a second split. A face that is
  # already alone passes through unchanged.
  - id: d4000000-0000-4000-8000-000000000004
    name: GeometrySplitterFaces
    type: action
    action: Geometry Splitter

  # Vertices within `duplicateTolerance` of each other count as one point: a
  # reprojected surface does not preserve exact coordinate equality.
  - id: d4000000-0000-4000-8000-000000000005
    name: GeometryValidatorFace
    type: action
    action: Geometry Validator
    with:
      duplicateTolerance: 0.01
      planarityThreshold:
        maxHeight: 0.03

  - id: d4000000-0000-4000-8000-000000000006
    name: AttributeManagerIssues
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: _issues
          method: create
          value:
            type: flowExpr
            value: |
              names = {
                "DuplicatePoints": "DuplicateConsecutivePoints",
                "InteriorRingContainment": "InteriorRingNotContainedInExteriorRing",
                "Planarity": "NonPlanarSurface",
                "Orientation": "IncorrectInteriorOrientation",
                "UnclosedRing": "RingNotClosed",
                "Degenerate": "DegenerateSurface",
                "Finite": "NonFiniteCoordinate",
              };
              checks = attributes["validationResult"]["checks"];
              itertools.map(itertools.sorted(checks.keys()), fn(k) { {"issue": names.get(k, k)} })

  - id: d4000000-0000-4000-8000-000000000007
    name: ListExploderIssues
    type: action
    action: List Exploder
    with:
      sourceAttribute: _issues

  - id: d4000000-0000-4000-8000-000000000008
    name: InvalidSurfaceRouter
    type: action
    action: Output Router
    with:
      routingPort: invalidSurface

  # Only the exterior ring's winding is this check's business: a hole wound
  # against its exterior is already reported by the 3D pass above, as
  # `IncorrectInteriorOrientation`, and would otherwise be reported a second time
  # here under a different name.
  - id: d4000000-0000-4000-8000-000000000009
    name: HoleExtractorOutline
    type: action
    action: Hole Extractor

  # The absolute winding of a face's outline is a 2D property, so the face is
  # flattened before the orientation check reads it.
  - id: d4000000-0000-4000-8000-00000000000a
    name: TwoDimensionForcer
    type: action
    action: Two Dimension Forcer

  # Only its `Orientation` result is read; the 3D pass above owns every other
  # check, so this one needs no thresholds of its own.
  - id: d4000000-0000-4000-8000-00000000000b
    name: GeometryValidatorOutline
    type: action
    action: Geometry Validator

  - id: d4000000-0000-4000-8000-00000000000c
    name: FeatureFilterByOrientation
    type: action
    action: Feature Filter
    with:
      conditions:
        - expr:
            type: flowExpr
            value: attributes["validationResult"]["checks"].get("Orientation", 0) > 0
          outputPort: incorrectOrientation

  - id: d4000000-0000-4000-8000-00000000000d
    name: IncorrectOrientationRouter
    type: action
    action: Output Router
    with:
      routingPort: incorrectOrientation

  - id: d4000000-0000-4000-8000-00000000000e
    name: AttributeManagerRejected
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: issue
          method: create
          value:
            type: string
            value: GeometryRejected

edges:
  - id: d4000000-0000-4000-8000-000000000101
    from: d4000000-0000-4000-8000-000000000001
    to: d4000000-0000-4000-8000-000000000002
    fromPort: features
    toPort: features
  - id: d4000000-0000-4000-8000-000000000102
    from: d4000000-0000-4000-8000-000000000002
    to: d4000000-0000-4000-8000-000000000003
    fromPort: features
    toPort: features
  - id: d4000000-0000-4000-8000-000000000103
    from: d4000000-0000-4000-8000-000000000003
    to: d4000000-0000-4000-8000-000000000004
    fromPort: features
    toPort: features

  ## Surface errors
  - id: d4000000-0000-4000-8000-000000000104
    from: d4000000-0000-4000-8000-000000000004
    to: d4000000-0000-4000-8000-000000000005
    fromPort: features
    toPort: features
  - id: d4000000-0000-4000-8000-000000000105
    from: d4000000-0000-4000-8000-000000000005
    to: d4000000-0000-4000-8000-000000000006
    fromPort: failed
    toPort: features
  - id: d4000000-0000-4000-8000-000000000106
    from: d4000000-0000-4000-8000-000000000006
    to: d4000000-0000-4000-8000-000000000007
    fromPort: features
    toPort: features
  - id: d4000000-0000-4000-8000-000000000107
    from: d4000000-0000-4000-8000-000000000007
    to: d4000000-0000-4000-8000-000000000008
    fromPort: features
    toPort: features

  ## Incorrect orientation
  - id: d4000000-0000-4000-8000-000000000108
    from: d4000000-0000-4000-8000-000000000004
    to: d4000000-0000-4000-8000-000000000009
    fromPort: features
    toPort: features
  - id: d4000000-0000-4000-8000-000000000109
    from: d4000000-0000-4000-8000-000000000009
    to: d4000000-0000-4000-8000-00000000000a
    fromPort: exterior
    toPort: features
  - id: d4000000-0000-4000-8000-00000000010a
    from: d4000000-0000-4000-8000-00000000000a
    to: d4000000-0000-4000-8000-00000000000b
    fromPort: features
    toPort: features
  - id: d4000000-0000-4000-8000-00000000010b
    from: d4000000-0000-4000-8000-00000000000b
    to: d4000000-0000-4000-8000-00000000000c
    fromPort: failed
    toPort: features
  - id: d4000000-0000-4000-8000-00000000010c
    from: d4000000-0000-4000-8000-00000000000c
    to: d4000000-0000-4000-8000-00000000000d
    fromPort: incorrectOrientation
    toPort: features

  ## Geometry no step could handle is reported rather than dropped
  - id: d4000000-0000-4000-8000-00000000010d
    from: d4000000-0000-4000-8000-000000000005
    to: d4000000-0000-4000-8000-00000000000e
    fromPort: rejected
    toPort: features
  - id: d4000000-0000-4000-8000-00000000010e
    from: d4000000-0000-4000-8000-000000000009
    to: d4000000-0000-4000-8000-00000000000e
    fromPort: rejected
    toPort: features
  - id: d4000000-0000-4000-8000-00000000010f
    from: d4000000-0000-4000-8000-00000000000a
    to: d4000000-0000-4000-8000-00000000000e
    fromPort: rejected
    toPort: features
  - id: d4000000-0000-4000-8000-000000000110
    from: d4000000-0000-4000-8000-00000000000b
    to: d4000000-0000-4000-8000-00000000000e
    fromPort: rejected
    toPort: features
  - id: d4000000-0000-4000-8000-000000000111
    from: d4000000-0000-4000-8000-00000000000e
    to: d4000000-0000-4000-8000-000000000008
    fromPort: features
    toPort: features

ports:
  outputs:
    - id: invalidSurface
      nodeId: d4000000-0000-4000-8000-000000000008
      port: features
    - id: incorrectOrientation
      nodeId: d4000000-0000-4000-8000-00000000000d
      port: features
