# WaterBody quality check subgraph
# LOD1 expects MultiSurface, LOD2+ expects Solid
# Uses GeometryFilter to detect non-MultiSurface geometry in LOD1 (invalid spatial attribute type)
# Uses Geometry Validator to check the shells of LOD2+ solids
id: b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7e
name: "WTR.WaterBodyValidation"
nodes:
  - id: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
    name: InputRouter
    type: action
    action: Input Router
    with:
      routingPort: features

  # LOD splitter
  - id: b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7f
    name: LodSplitter
    type: subGraph
    subGraphId: b1000000-0000-4000-8000-000000000000

  # ===== LOD1: Detect non-MultiSurface geometry using GeometryFilter =====
  # LOD1 expects MultiSurface. Any other geometry type (Solid, Curve, etc.) is invalid.
  - id: c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
    name: GeometryFilterLod1
    type: action
    action: Geometry Filter
    with:
      filterType: detailedGeometryType

  # Merge all invalid geometry types (solid, curve, point, triangle, unfiltered) for LOD1
  # Surface (MultiSurface) is valid for LOD1, so it's not processed here
  - id: d4e5f6a7-b8c9-0d1e-2f3a-4b5c6d7e8f9a
    name: AttributeManagerInvalidSpatialAttrType
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: Folder
          expr:
            type: flowExpr
            value: attributes.get("udxDirs", "")
        - attribute: Index
          expr:
            type: flowExpr
            value: attributes.get("fileIndex", 0)
        - attribute: Filename
          expr:
            type: flowExpr
            value: attributes.get("gmlFilename", "")
        - attribute: FeatureType
          expr:
            type: flowExpr
            value: |
              ft = attributes.get("featureType");
              if ft == null {
                "WaterBody"
              } else if ":" in ft {
                ft.split(":")[1]
              } else {
                ft
              }
        - attribute: LOD
          expr:
            type: flowExpr
            value: attributes.get("lod", "1")
        - attribute: "gml:id"
          expr:
            type: flowExpr
            value: attributes.get("__citygml_geometry_gml_id") or attributes.get("__citygml_gml_id", "")
        - attribute: "無効な空間属性の型"
          expr:
            type: flowExpr
            value: attributes.get("geometryName", "Unknown")

  - id: e5f6a7b8-c9d0-1e2f-3a4b-5c6d7e8f9a0b
    name: FeatureWriterInvalidSpatialAttr
    type: action
    action: Feature Writer
    with:
      format: csv
      output:
        type: string
        value: 11_水部_無効な空間属性の型.csv
  - id: f6a7b8c9-d0e1-2f3a-4b5c-6d7e8f9a0b1c
    name: StatisticsCalculatorInvalidSpatialAttr
    type: action
    action: Statistics Calculator
    with:
      groupBy:
        - Filename
      calculations:
        - newAttribute: _num_invalid_spatial_attr
          expr:
            type: flowExpr
            value: "1"

  - id: a7b8c9d0-e1f2-3a4b-5c6d-7e8f9a0b1c2d
    name: OutputRouterInvalidSpatialAttr
    type: action
    action: Output Router
    with:
      routingPort: errorCountInvalidSpatialAttr

  # ===== LOD1: surface errors =====
  - id: 10a1b1c1-d1e1-f1a1-b1c1-d1e1f1a1b1c1
    name: SurfaceChecksLod1
    type: subGraph
    subGraphId: d4000000-0000-4000-8000-000000000000

  - id: 11a2b2c2-d2e2-f2a2-b2c2-d2e2f2a2b2c2
    name: AttributeMapperLod1SurfaceErrors
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: Folder
          expr:
            type: flowExpr
            value: attributes.get("udxDirs", "wtr")
        - attribute: Index
          expr:
            type: flowExpr
            value: attributes.get("fileIndex", 1)
        - attribute: Filename
          expr:
            type: flowExpr
            value: attributes.get("gmlFilename", "")
        - attribute: FeatureType
          expr:
            type: flowExpr
            value: |
              ft = attributes.get("featureType");
              if ft == null {
                "WaterBody"
              } else if ":" in ft {
                ft.split(":")[1]
              } else {
                ft
              }
        - attribute: LOD
          expr:
            type: flowExpr
            value: attributes.get("lod", "1")
        - attribute: "gml:id"
          expr:
            type: flowExpr
            value: attributes.get("__citygml_geometry_gml_id") or attributes.get("__citygml_gml_id", "")
        - attribute: エラー数
          expr:
            type: string
            value: "1"
        - attribute: エラー内容
          expr:
            type: flowExpr
            value: attributes.get("issue", "UnknownError")

  - id: 12a3b3c3-d3e3-f3a3-b3c3-d3e3f3a3b3c3
    name: FeatureWriterLod1SurfaceErrors
    type: action
    action: Feature Writer
    with:
      format: csv
      output:
        type: string
        value: 11_水部_LOD1面のエラー.csv
  - id: 13a4b4c4-d4e4-f4a4-b4c4-d4e4f4a4b4c4
    name: StatisticsCalculatorLod1SurfaceErrors
    type: action
    action: Statistics Calculator
    with:
      groupId: gmlFilename
      groupBy:
        - Filename
      calculations:
        - newAttribute: _num_lod1_surface_errors
          expr:
            type: flowExpr
            value: "1"

  - id: 14a5b5c5-d5e5-f5a5-b5c5-d5e5f5a5b5c5
    name: OutputRouterLod1SurfaceErrors
    type: action
    action: Output Router
    with:
      routingPort: errorCountLod1SurfaceErrors

  # ===== LOD2/3: solid checks =====
  # Only a solid has shells to check; a LOD stream also carries bare surfaces,
  # which the boundary surface checks own.
  - id: 11100000-0000-4000-8000-000000000010
    name: GeometryFilterSolidLod2Plus
    type: action
    action: Geometry Filter
    with:
      filterType: geometryType

  - id: c9d0e1f2-a3b4-5c6d-7e8f-9a0b1c2d3e4f
    name: SolidValidatorLod2Plus
    type: action
    action: Geometry Validator
    with:
      duplicateTolerance: 0.01

  # Shell-level failures are classified here; face-level failures on the same
  # solid are reported by the boundary surface checks.
  - id: 11100000-0000-4000-8000-000000000011
    name: AttributeManagerSolidIssue
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: _solid_issue
          method: create
          value:
            type: flowExpr
            value: |
              checks = attributes["validationResult"]["checks"];
              if "ShellManifold" in checks {
                "NotClosed"
              } else if "ShellConnected" in checks or "Orientable" in checks or "Orientation" in checks or "ShellOrientation" in checks or "SelfIntersection" in checks {
                "Other"
              } else {
                ""
              }

  - id: d0e1f2a3-b4c5-6d7e-8f9a-0b1c2d3e4f5a
    name: FeatureFilterSolidIssues
    type: action
    action: Feature Filter
    with:
      conditions:
        - expr:
            type: flowExpr
            value: attributes["_solid_issue"] == "NotClosed"
          outputPort: notClosed
        - expr:
            type: flowExpr
            value: attributes["_solid_issue"] == "Other"
          outputPort: otherIssues

  # Non-watertight solid: a shell that is not closed.
  - id: e1f2a3b4-c5d6-7e8f-9a0b-1c2d3e4f5a6b
    name: AttributeMapperNotClosed
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: filename
          valueAttribute: gmlFilename
        - attribute: feature_type
          expr:
            type: flowExpr
            value: |
              ft = attributes.get("featureType");
              if ft == null {
                "WaterBody"
              } else if ":" in ft {
                ft.split(":")[1]
              } else {
                ft
              }
        - attribute: lod
          valueAttribute: lod
        - attribute: gml_id
          expr:
            type: flowExpr
            value: attributes.get("__citygml_geometry_gml_id") or attributes.get("__citygml_gml_id", "")
        - attribute: issue
          expr:
            type: string
            value: Surface Not Closed

  - id: f2a3b4c5-d6e7-8f9a-0b1c-2d3e4f5a6b7c
    name: FeatureWriterNotClosed
    type: action
    action: Feature Writer
    with:
      format: csv
      output:
        type: string
        value: 11_水部_LOD2-3非水密立体.csv
  - id: a3b4c5d6-e7f8-9a0b-1c2d-3e4f5a6b7c8d
    name: StatisticsCalculatorNotClosed
    type: action
    action: Statistics Calculator
    with:
      groupId: gmlFilename
      groupBy:
        - filename
      calculations:
        - newAttribute: _num_not_closed_solid
          expr:
            type: flowExpr
            value: "1"

  - id: b4c5d6e7-f8a9-0b1c-2d3e-4f5a6b7c8d9e
    name: OutputRouterNotClosed
    type: action
    action: Output Router
    with:
      routingPort: errorCountNotClosedSolid

  # Other solid errors - following building workflow pattern
  - id: c5d6e7f8-a9b0-1c2d-3e4f-5a6b7c8d9e0f
    name: AttributeMapperOtherSolidErrors
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: filename
          valueAttribute: gmlFilename
        - attribute: feature_type
          expr:
            type: flowExpr
            value: |
              ft = attributes.get("featureType");
              if ft == null {
                "WaterBody"
              } else if ":" in ft {
                ft.split(":")[1]
              } else {
                ft
              }
        - attribute: lod
          valueAttribute: lod
        - attribute: gml_id
          expr:
            type: flowExpr
            value: attributes.get("__citygml_geometry_gml_id") or attributes.get("__citygml_gml_id", "")
        - attribute: issue
          expr:
            type: string
            value: Invalid Solid Boundaries

  - id: d6e7f8a9-b0c1-2d3e-4f5a-6b7c8d9e0f1a
    name: FeatureWriterOtherSolidErrors
    type: action
    action: Feature Writer
    with:
      format: csv
      output:
        type: string
        value: 11_水部_LOD2-3立体のエラー.csv
  - id: e7f8a9b0-c1d2-3e4f-5a6b-7c8d9e0f1a2b
    name: StatisticsCalculatorOtherSolidErrors
    type: action
    action: Statistics Calculator
    with:
      groupId: gmlFilename
      groupBy:
        - filename
      calculations:
        - newAttribute: _num_other_solid_errors
          expr:
            type: flowExpr
            value: "1"

  - id: f8a9b0c1-d2e3-4f5a-6b7c-8d9e0f1a2b3c
    name: OutputRouterOtherSolidErrors
    type: action
    action: Output Router
    with:
      routingPort: errorCountOtherSolidErrors

  # ===== LOD2/3: SurfaceValidator for boundary surface errors =====
  - id: 01a1b1c1-d1e1-f1a1-b1c1-d1e1f1a1b1c1
    name: SurfaceChecksLod2Plus
    type: subGraph
    subGraphId: d4000000-0000-4000-8000-000000000000

  - id: 02a2b2c2-d2e2-f2a2-b2c2-d2e2f2a2b2c2
    name: AttributeMapperBoundarySurfaceErrors
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: Folder
          expr:
            type: flowExpr
            value: attributes.get("udxDirs", "wtr")
        - attribute: Index
          expr:
            type: flowExpr
            value: attributes.get("fileIndex", 1)
        - attribute: Filename
          expr:
            type: flowExpr
            value: attributes.get("gmlFilename", "")
        - attribute: FeatureType
          expr:
            type: flowExpr
            value: |
              ft = attributes.get("featureType");
              if ft == null {
                "WaterBody"
              } else if ":" in ft {
                ft.split(":")[1]
              } else {
                ft
              }
        - attribute: LOD
          expr:
            type: flowExpr
            value: attributes.get("lod", "2")
        - attribute: "gml:id"
          expr:
            type: flowExpr
            value: attributes.get("__citygml_geometry_gml_id") or attributes.get("__citygml_gml_id", "")
        - attribute: エラー数
          expr:
            type: string
            value: "1"
        - attribute: エラー内容
          expr:
            type: flowExpr
            value: attributes.get("issue", "UnknownError")

  - id: 03a3b3c3-d3e3-f3a3-b3c3-d3e3f3a3b3c3
    name: FeatureWriterBoundarySurfaceErrors
    type: action
    action: Feature Writer
    with:
      format: csv
      output:
        type: string
        value: 11_水部_LOD2-3境界面のエラー.csv
  - id: 04a4b4c4-d4e4-f4a4-b4c4-d4e4f4a4b4c4
    name: StatisticsCalculatorBoundarySurfaceErrors
    type: action
    action: Statistics Calculator
    with:
      groupId: gmlFilename
      groupBy:
        - Filename
      calculations:
        - newAttribute: _num_boundary_surface_errors
          expr:
            type: flowExpr
            value: "1"

  - id: 05a5b5c5-d5e5-f5a5-b5c5-d5e5f5a5b5c5
    name: OutputRouterBoundarySurfaceErrors
    type: action
    action: Output Router
    with:
      routingPort: errorCountBoundarySurfaceErrors

  # File output router
  - id: a9b0c1d2-e3f4-5a6b-7c8d-9e0f1a2b3c4d
    name: OutputRouterFileOutput
    type: action
    action: Output Router
    with:
      routingPort: fileOutput

edges:
  # Input → LodSplitter
  - id: 01a2b3c4-d5e6-f7a8-b9c0-d1e2f3a4b5c6
    from: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
    to: b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7f
    fromPort: features
    toPort: features

  # ===== LOD1 → GeometryFilter =====
  - id: 02b3c4d5-e6f7-a8b9-c0d1-e2f3a4b5c6d7
    from: b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7f
    to: c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
    fromPort: lod1
    toPort: features

  # Every exact type but a surface is an invalid spatial attribute type for
  # LOD1, reported under its own name.
  - id: 11100000-0000-4000-8000-000000000300
    from: c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
    to: d4e5f6a7-b8c9-0d1e-2f3a-4b5c6d7e8f9a
    fromPort: solid
    toPort: features
  - id: 11100000-0000-4000-8000-000000000302
    from: c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
    to: d4e5f6a7-b8c9-0d1e-2f3a-4b5c6d7e8f9a
    fromPort: multi-solid
    toPort: features
  - id: 11100000-0000-4000-8000-000000000304
    from: c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
    to: d4e5f6a7-b8c9-0d1e-2f3a-4b5c6d7e8f9a
    fromPort: csg
    toPort: features
  - id: 11100000-0000-4000-8000-000000000306
    from: c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
    to: d4e5f6a7-b8c9-0d1e-2f3a-4b5c6d7e8f9a
    fromPort: multi-curve
    toPort: features
  - id: 11100000-0000-4000-8000-000000000308
    from: c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
    to: d4e5f6a7-b8c9-0d1e-2f3a-4b5c6d7e8f9a
    fromPort: line-string
    toPort: features
  - id: 11100000-0000-4000-8000-00000000030a
    from: c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
    to: d4e5f6a7-b8c9-0d1e-2f3a-4b5c6d7e8f9a
    fromPort: point
    toPort: features
  - id: 11100000-0000-4000-8000-00000000030c
    from: c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
    to: d4e5f6a7-b8c9-0d1e-2f3a-4b5c6d7e8f9a
    fromPort: multi-point
    toPort: features
  - id: 11100000-0000-4000-8000-00000000030e
    from: c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
    to: d4e5f6a7-b8c9-0d1e-2f3a-4b5c6d7e8f9a
    fromPort: point-cloud
    toPort: features
  - id: 11100000-0000-4000-8000-000000000310
    from: c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
    to: d4e5f6a7-b8c9-0d1e-2f3a-4b5c6d7e8f9a
    fromPort: triangular-mesh
    toPort: features
  - id: 11100000-0000-4000-8000-000000000312
    from: c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
    to: d4e5f6a7-b8c9-0d1e-2f3a-4b5c6d7e8f9a
    fromPort: aggregate
    toPort: features
  - id: 11100000-0000-4000-8000-000000000314
    from: c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
    to: d4e5f6a7-b8c9-0d1e-2f3a-4b5c6d7e8f9a
    fromPort: unfiltered
    toPort: features

  # AttributeManager → FeatureWriter
  - id: 04d5e6f7-a8b9-c0d1-e2f3-a4b5c6d7e8f9
    from: d4e5f6a7-b8c9-0d1e-2f3a-4b5c6d7e8f9a
    to: e5f6a7b8-c9d0-1e2f-3a4b-5c6d7e8f9a0b
    fromPort: features
    toPort: features

  # FeatureWriter → FileOutput
  - id: 05e6f7a8-b9c0-d1e2-f3a4-b5c6d7e8f9a0
    from: e5f6a7b8-c9d0-1e2f-3a4b-5c6d7e8f9a0b
    to: a9b0c1d2-e3f4-5a6b-7c8d-9e0f1a2b3c4d
    fromPort: features
    toPort: features

  # AttributeManager → StatisticsCalculator
  - id: 06f7a8b9-c0d1-e2f3-a4b5-c6d7e8f9a0b1
    from: d4e5f6a7-b8c9-0d1e-2f3a-4b5c6d7e8f9a
    to: f6a7b8c9-d0e1-2f3a-4b5c-6d7e8f9a0b1c
    fromPort: features
    toPort: features

  # StatisticsCalculator → OutputRouter (error count)
  - id: 07a8b9c0-d1e2-f3a4-b5c6-d7e8f9a0b1c2
    from: f6a7b8c9-d0e1-2f3a-4b5c-6d7e8f9a0b1c
    to: a7b8c9d0-e1f2-3a4b-5c6d-7e8f9a0b1c2d
    fromPort: features
    toPort: features

  # ===== LOD1 surface (MultiSurface) → SurfaceChecksLod1 =====
  - id: 30a1b2c3-d4e5-f6a7-b8c9-d0e1f2a3b4c5
    from: c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
    to: 10a1b1c1-d1e1-f1a1-b1c1-d1e1f1a1b1c1
    fromPort: multi-surface
    toPort: features
  - id: 11100000-0000-4000-8000-000000000341
    from: c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
    to: 10a1b1c1-d1e1-f1a1-b1c1-d1e1f1a1b1c1
    fromPort: polygon-mesh
    toPort: features
  - id: 11100000-0000-4000-8000-000000000342
    from: c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
    to: 10a1b1c1-d1e1-f1a1-b1c1-d1e1f1a1b1c1
    fromPort: face
    toPort: features
  - id: 11100000-0000-4000-8000-000000000343
    from: c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
    to: 10a1b1c1-d1e1-f1a1-b1c1-d1e1f1a1b1c1
    fromPort: polygon
    toPort: features
  - id: 11100000-0000-4000-8000-000000000344
    from: c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
    to: 10a1b1c1-d1e1-f1a1-b1c1-d1e1f1a1b1c1
    fromPort: multi-area
    toPort: features

  # SurfaceValidator (invalidSurface) → AttributeMapper
  - id: 31b2c3d4-e5f6-a7b8-c9d0-e1f2a3b4c5d6
    from: 10a1b1c1-d1e1-f1a1-b1c1-d1e1f1a1b1c1
    to: 11a2b2c2-d2e2-f2a2-b2c2-d2e2f2a2b2c2
    fromPort: invalidSurface
    toPort: features

  # AttributeMapper → FeatureWriter
  - id: 32c3d4e5-f6a7-b8c9-d0e1-f2a3b4c5d6e7
    from: 11a2b2c2-d2e2-f2a2-b2c2-d2e2f2a2b2c2
    to: 12a3b3c3-d3e3-f3a3-b3c3-d3e3f3a3b3c3
    fromPort: features
    toPort: features

  # FeatureWriter → FileOutput
  - id: 33d4e5f6-a7b8-c9d0-e1f2-a3b4c5d6e7f8
    from: 12a3b3c3-d3e3-f3a3-b3c3-d3e3f3a3b3c3
    to: a9b0c1d2-e3f4-5a6b-7c8d-9e0f1a2b3c4d
    fromPort: features
    toPort: features

  # AttributeMapper → StatisticsCalculator
  - id: 34e5f6a7-b8c9-d0e1-f2a3-b4c5d6e7f8a9
    from: 11a2b2c2-d2e2-f2a2-b2c2-d2e2f2a2b2c2
