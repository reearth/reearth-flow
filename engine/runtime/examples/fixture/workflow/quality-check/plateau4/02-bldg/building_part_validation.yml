id: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
name: buildingPartValidation
nodes:
  - id: c223c809-eba3-4d73-8f1b-34d27515bb17
    name: InputRouter
    type: action
    action: Input Router
    with:
      routingPort: features

  - id: a5aefda5-b66f-4d20-b8b8-5b1aa322ec8e
    name: LodSplitter
    type: subGraph
    subGraphId: b1000000-0000-4000-8000-000000000000

  # ========== LOD0/LOD1 BuildingPart detection (Z-bldg-04) ==========
  - id: 77c7d8e9-0f1a-2b3c-4d5e-6f7a8b9c0d1e
    name: Lod0Or1BuildingPartCounter
    type: action
    action: Statistics Calculator
    with:
      groupBy:
        - gmlFilename
      calculations:
        - newAttribute: _num_lod0_1_buildingpart
          expr:
            type: flowExpr
            value: "1"

  - id: 7b9c8d4e-6f5a-4c8b-9d3e-2a5f7b8c9d4e
    name: AttributeMapperBuildingPartLod0Or1
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: Index
          valueAttribute: fileIndex
        - attribute: Filename
          valueAttribute: gmlFilename
        - attribute: Building.gml_id
          valueAttribute: gmlId
        - attribute: BuildingPart.gml_id
          valueAttribute: featureId
        - attribute: lod
          valueAttribute: lod

  - id: 9e8f7a6b-5c4d-3e2f-1a0b-9c8d7e6f5a4b
    name: CsvWriterBuildingPartLod0Or1
    type: action
    action: Feature Writer
    with:
      format: csv
      output:
        type: string
        value: 02_建築物_LOD0-1のBuildingPart.csv

  - id: 88d8e9f0-1a2b-3c4d-5e6f-7a8b9c0d1e2f
    name: ErrorCount-Lod0Or1BuildingPart
    type: action
    action: Output Router
    with:
      routingPort: errorCountLod01BuildingPart

  # ========== L-bldg-02: LOD2-4 BuildingPart connectivity ==========
  # Two BuildingParts of one Building are connected when they share a boundary
  # surface. The chain below takes each part apart into its surfaces, pairs the
  # surfaces that occupy the same space, and hands the resulting part-to-part
  # links to the resolver, which decides whether the Building's parts hang
  # together.

  - id: 1d2c3b4a-5f6e-7a8b-9c0d-1e2f3a4b5c6d
    name: BuildingPartSurfaceCoercer
    type: action
    action: Geometry Coercer
    with:
      targetType: polygon

  - id: 2e3d4c5b-6a7f-8b9c-0d1e-2f3a4b5c6d7e
    name: BuildingPartSurfaceSplitter
    type: action
    action: Geometry Splitter

  # Surfaces occupying the same space name each other's BuildingPart. The
  # tolerance is one millimetre in the plane rectangular CS the geometry has been
  # reprojected into, which absorbs rounding without joining distinct surfaces.
  - id: 3f4a5b6c-7d8e-9f0a-1b2c-3d4e5f6a7b8c
    name: BuildingPartSurfaceIdentifier
    type: action
    action: Geometry Identifier
    with:
      tolerance: 0.001
      groupBy:
        - fileIndex
        - gmlFilename
        - gmlId
        - lod
      idAttribute: featureId
      matchedIdsAttribute: _shared_part_ids

  - id: d3c4e5f6-7a8b-9c0d-1e2f-3a4b5c6d7e8f
    name: PLATEAU4.TransitiveLinkResolver
    type: action
    action: PLATEAU4.TransitiveLinkResolver
    with:
      idAttribute: featureId
      linkedIdsAttribute: _shared_part_ids
      groupBy:
        - fileIndex
        - gmlFilename
        - gmlId
        - lod

  # Every surface of a BuildingPart carries the same verdict; keep one per part.
  - id: a6f7b8c9-0d1e-2f3a-4b5c-6d7e8f9a0b1c
    name: DeduplicateBuildingParts
    type: action
    action: Feature Duplicate Filter
    with:
      filterBy:
        - fileIndex
        - gmlFilename
        - gmlId
        - lod
        - featureId

  # A part whose Building's parts do not all hang together is the error.
  - id: f5e6a7b8-9c0d-1e2f-3a4b-5c6d7e8f9a0b
    name: FilterNonFullStatus
    type: action
    action: Feature Filter
    with:
      conditions:
        - expr:
            type: flowExpr
            value: attributes["_status"] != "full"
          outputPort: filtered

  - id: b7a8c9d0-1e2f-3a4b-5c6d-7e8f9a0b1c2d
    name: CountLbldg02Errors
    type: action
    action: Statistics Calculator
    with:
      groupBy:
        - gmlFilename
      calculations:
        - newAttribute: _num_lbldg02_error
          expr:
            type: flowExpr
            value: "1"

  - id: c8b9d0e1-2f3a-4b5c-6d7e-8f9a0b1c2d3e
    name: AttributeMapperLbldg02Output
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: Index
          valueAttribute: fileIndex
        - attribute: Filename
          valueAttribute: gmlFilename
        - attribute: Building.gml_id
          valueAttribute: gmlId
        - attribute: BuildingPart.gml_id
          valueAttribute: featureId
        - attribute: lod
          valueAttribute: lod
        - attribute: status
          valueAttribute: _status
        - attribute: connected_id
          valueAttribute: _connected_id
        - attribute: connected_parts
          valueAttribute: _connected_parts

  - id: d9c0e1f2-3a4b-5c6d-7e8f-9a0b1c2d3e4f
    name: CsvWriterLbldg02Errors
    type: action
    action: Feature Writer
    with:
      format: csv
      output:
        type: string
        value: 02_建築物_L-bldg-02エラー.csv

  - id: e2f3a4b5-6c7d-8e9f-0a1b-2c3d4e5f6a7b
    name: ErrorCount-Lbldg02
    type: action
    action: Output Router
    with:
      routingPort: errorCountLbldg02

  - id: 3f4e5d6c-7b8a-9c0d-1e2f-3a4b5c6d7e8f
    name: OutputRouter
    type: action
    action: Output Router
    with:
      routingPort: fileOutput

