    name: FeatureFilterLod0IncorrectOrientation
    type: action
    action: Feature Filter
    with:
      conditions:
        - expr:
            type: flowExpr
            value: '"Orientation" in attributes["validationResult"]["checks"]'
          outputPort: inCorrectOrientation

