  - id: 11d1e2f3-4a5b-6c7d-8e9f-0a1b2c3d4e5f
    name: SolidIntersectionCounter
    type: action
    action: Statistics Calculator
    with:
      groupId: gmlFilename
      groupBy:
      - gmlFilenameA
      calculations:
        - newAttribute: _num_lod1_solid_intersection
          expr:
            type: flowExpr
            value: if attributes["lodA"] == 1 { 1 } else { 0 }
