    type: action
    action: Geometry Replacer
    with:
      sourceAttribute: _solid_geometry

  - id: f6f7a8b9-c0d1-4e2f-3a4b-5c6d7e8f9a0b
    name: GeometryReplacerSolidIntersectionB
    type: action
    action: Geometry Replacer
    with:
      sourceAttribute: _solid_geometry

  - id: dfd0a1f5-b49e-4eb0-b1f0-6375fac58a54
    name: CSGBuilder
    type: action
    action: CSG Builder
    with:
      pairIdAttribute:
        type: flowExpr
        value: attributes["pair_id"]
      createList: true
      listAttributeName: attrList

  - id: 155cb125-9e89-4825-b505-4b2f2b6dbe0d
    name: CSGEvaluator
    type: action
    action: CSG Evaluator
    with:
      tolerance:
        type: flowExpr
        value: "0.01"

  - id: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
    name: AttributeMapperSolidIntersection
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: intersection_id
          expr:
            type: flowExpr
            value: |
              item = attributes["attrList"][0];
              "lod" + str(item["lod"]) + "_" + str(item["pair_id"])
        - attribute: gmlFilenameA
          expr:
            type: flowExpr
            value: attributes["attrList"][0]["gmlFilename"]
        - attribute: gmlFilenameB
          expr:
            type: flowExpr
            value: attributes["attrList"][1]["gmlFilename"]
        - attribute: featureTypeA
          expr:
            type: flowExpr
            value: attributes["attrList"][0]["featureType"]
        - attribute: featureTypeB
          expr:
            type: flowExpr
            value: attributes["attrList"][1]["featureType"]
        - attribute: lodA
          expr:
            type: flowExpr
            value: attributes["attrList"][0]["lod"]
        - attribute: lodB
          expr:
            type: flowExpr
            value: attributes["attrList"][1]["lod"]
        - attribute: gmlIdA
          expr:
            type: flowExpr
            value: attributes["attrList"][0]["gmlId"]
        - attribute: gmlIdB
          expr:
            type: flowExpr
            value: attributes["attrList"][1]["gmlId"]
        - attribute: issue
          expr:
            type: string
            value: Solid Intersection

  - id: 99cbea75-f9dc-429c-9d42-0213a893090d
