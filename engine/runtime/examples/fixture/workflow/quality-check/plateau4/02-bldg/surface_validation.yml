  # ===== Solid intersection (LOD1-4) =====
  - id: f1a2b3c4-d5e6-4f7a-8b9c-0d1e2f3a4b5c
    name: GeometryExtractorSolidIntersection
    type: action
    action: Geometry Extractor
    with:
      outputAttribute: _solid_geometry

  - id: f2b3c4d5-e6f7-4a8b-9c0d-1e2f3a4b5c6d
    name: FootprintReplacerSolidIntersection
    type: action
    action: Footprint Replacer

  # Shrinks the footprint by 0.005m to match the FME-based PLATEAU workflow, which
  # ignores the mm-scale overlaps caused by coordinate precision at shared
  # building boundaries. This is not part of the PLATEAU specification.
  - id: f2c3d4e5-f7a8-4b9c-1e2f-3a4b5c6d7e8f
    name: BuffererSolidIntersection
    type: action
    action: Bufferer
    with:
      bufferType: area2d
      distance: -0.005
      interpolationAngle: 22.5

  - id: f3c4d5e6-f7a8-4b9c-0d1e-2f3a4b5c6d7e
    name: AreaOnAreaOverlayerSolidIntersection
    type: action
    action: Area On Area Overlayer
    with:
      accumulationMode: dropIncomingAttributes
      outputAttribute: overlap
      generateList: list
      groupBy:
        - lod
      tolerance: 0.01

  - id: f4d5e6f7-a8b9-4c0d-1e2f-3a4b5c6d7e8f
    name: FeatureFilterSolidIntersectionOverlap
    type: action
    action: Feature Filter
    with:
      conditions:
        - expr:
            type: flowExpr
            value: attributes["overlap"] > 1
          outputPort: overlapping

  - id: 5e6a0a7a-5dfe-483b-9a45-7da7a5ea7641
