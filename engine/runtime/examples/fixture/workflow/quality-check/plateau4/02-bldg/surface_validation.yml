  # ===== Solid checks (LOD1-4) =====
  - id: b3000000-0000-4000-8000-000000000010
    name: GeometryFilterLod1
    type: action
    action: Geometry Filter
    with:
      filterType: geometryType

  - id: ecaceb7b-ff98-4744-acf7-17e80829d6f3
    name: SolidValidator
    type: action
    action: Geometry Validator
    with:
      duplicateTolerance: 0.01

  # Shell-level failures are classified here; face-level failures on the same
  # solid are reported by the boundary surface checks.
  - id: b3000000-0000-4000-8000-000000000011
    name: AttributeManagerSolidIssue
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: _solid_issue
          method: create
          value:
            type: flowExpr
            value: |
              checks = attributes["validationResult"]["checks"];
              if "ShellManifold" in checks {
                "NotClosed"
              } else if "ShellConnected" in checks or "Orientable" in checks or "Orientation" in checks or "ShellOrientation" in checks or "SelfIntersection" in checks {
                "Other"
              } else {
                ""
              }

  - id: d0132191-a81f-4647-896d-5db49e3fb734
    name: FeatureFilterInvalidSolidBoundary
    type: action
    action: Feature Filter
    with:
      conditions:
        - expr:
            type: flowExpr
            value: attributes["_solid_issue"] == "NotClosed"
          outputPort: notClosed
        - expr:
            type: flowExpr
            value: attributes["_solid_issue"] == "Other"
          outputPort: otherIssues

  - id: 33e3f4a5-6b7c-8d9e-0f1a-2b3c4d5e6f7a
    name: Lod1-4NotClosedSolidCounter
    type: action
