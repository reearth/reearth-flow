  - id: e5f6a7b8-c9d0-1e2f-3a4b-5c6d7e8f9a0b
    name: FeatureFilePathExtractor
    type: action
    action: Feature File Path Extractor
    with:
      sourceDataset:
        type: flowExpr
        value: attributes["cityGmlPath"]
      extractArchive: true
      destPrefix: udx
  - id: f6a7b8c9-d0e1-2f3a-4b5c-6d7e8f9a0b1c
    name: FeatureFilterByGml
    type: action
    action: Feature Filter
    with:
      conditions:
      - expr:
          type: flowExpr
          value: attributes["extension"] == "gml"
        outputPort: features
  - id: a7b8c9d0-e1f2-3a4b-5c6d-7e8f9a0b1c2d
