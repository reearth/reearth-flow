  - id: d2e3f4a5-b6c7-8d9e-0f1a-2b3c4d5e6f7a
    name: StatisticsCalculator
    type: action
    action: Statistics Calculator
    with:
      calculations:
      - newAttribute: 無効な空間属性の型
        expr:
          type: flowExpr
          value: attributes.get("無効な空間属性の型", 0)
      - newAttribute: 非水密立体
        expr:
          type: flowExpr
          value: attributes.get("非水密立体", 0)
      - newAttribute: 立体のその他のエラー
        expr:
          type: flowExpr
          value: attributes.get("立体のその他のエラー", 0)
      - newAttribute: 立体の境界面のエラー
        expr:
          type: flowExpr
          value: attributes.get("立体の境界面のエラー", 0)
      - newAttribute: 面のエラー
        expr:
          type: flowExpr
          value: attributes.get("面のエラー", 0)
      - newAttribute: totalErrorCount
        expr:
          type: flowExpr
          value: |
            itertools.sum([
              attributes.get("無効な空間属性の型", 0),
              attributes.get("非水密立体", 0),
              attributes.get("立体のその他のエラー", 0),
              attributes.get("立体の境界面のエラー", 0),
              attributes.get("面のエラー", 0),
            ])
  - id: e3f4a5b6-c7d8-9e0f-1a2b-3c4d5e6f7a8b
    name: JSONSummaryWriter
    type: action
    action: Feature Writer
    with:
      format: json
      converter:
        type: flowExpr
        value: |
          if len(attributes["__features"]) == 0 {
            []
          } else {
            result = [];
            feature = attributes["__features"][0];
            keys = ["無効な空間属性の型", "非水密立体", "立体のその他のエラー", "立体の境界面のエラー", "面のエラー"];
            for key in keys {
              result.append({"name": key, "count": feature.get(key, 0)});
            }
            result
          }
      output:
        type: string
        value: summary_wtr.json
  - id: f4a5b6c7-d8e9-0f1a-2b3c-4d5e6f7a8b9d
    name: StatisticsCalculatorTotalErrors
    type: action
    action: Statistics Calculator
    with:
      calculations:
      - newAttribute: totalErrorCount
        expr:
          type: flowExpr
          value: attributes.get("totalErrorCount", 0)
  - id: a5b6c7d8-e9f0-1a2b-3c4d-5e6f7a8b9c0e
