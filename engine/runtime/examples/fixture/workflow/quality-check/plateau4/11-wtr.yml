          type: flowExpr
          value: not variables["targetPackages"] or attributes["package"] in variables["targetPackages"]
        outputPort: features
  - id: c9d0e1f2-a3b4-5c6d-7e8f-9a0b1c2d3e4f
    name: AttributeMapperGmlPathAndFilename
    type: action
    action: Attribute Mapper
    with:
      mappers:
      - attribute: gmlPath
        valueAttribute: path
      - attribute: gmlFilename
        valueAttribute: name
      - attribute: fileIndex
        valueAttribute: fileIndex
      - attribute: codelists
        valueAttribute: codelists
      - attribute: schemas
        valueAttribute: schemas
      - attribute: udxDirs
        expr:
          type: flowExpr
          value: |
            parts = attributes["path"].split("/");
            if len(parts) >= 2 { parts[-2] } else { attributes.get("udxDirs", "") }
