    type: action
    action: Geometry Splitter
  - id: f8a9b0c1-d2e3-4f5a-6b7c-8d9e0f1a2b3c
    name: InstanceCountCalculator
    type: action
    action: Statistics Calculator
    with:
      groupBy:
      - gmlFilename
      - fileIndex
      - udxDirs
      - lod
      calculations:
      - newAttribute: WaterBody
        expr:
          type: flowExpr
          value: if attributes["__citygml_feature_type"] == "wtr:WaterBody" { 1 } else { 0 }
  - id: b0c1d2e3-f4a5-6b7c-8d9e-0f1a2b3c4d5e
    name: SummaryAttributeMapper
    type: action
    action: Attribute Mapper
    with:
      mappers:
      - attribute: Index
        expr:
          type: flowExpr
          value: attributes.get("fileIndex", attributes.get("index"))
      - attribute: Folder
        valueAttribute: udxDirs
      - attribute: Filename
        expr:
          type: flowExpr
          value: attributes.get("gmlFilename", attributes.get("filename"))
      - attribute: フィーチャータイプ
        expr:
          type: string
          value: WaterBody
      - attribute: LOD
        expr:
          type: flowExpr
          value: attributes.get("lod", "1")
      - attribute: インスタンス数
        expr:
          type: flowExpr
          value: attributes.get("WaterBody", 0)
      - attribute: 無効な空間属性の型
        expr:
          type: flowExpr
          value: attributes.get("_num_invalid_spatial_attr", 0)
      - attribute: 非水密立体
        expr:
          type: flowExpr
          value: attributes.get("_num_not_closed_solid", 0)
      - attribute: 立体のその他のエラー
        expr:
