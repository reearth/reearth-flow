    with:
      mappers:
      - attribute: index
        valueAttribute: fileIndex
      - attribute: filename
        valueAttribute: gmlFilename
      - attribute: udxDirs
        valueAttribute: udxDirs
      - attribute: gmlFilename
        valueAttribute: gmlFilename
      - attribute: WaterBody
        valueAttribute: WaterBody
      - attribute: lod
