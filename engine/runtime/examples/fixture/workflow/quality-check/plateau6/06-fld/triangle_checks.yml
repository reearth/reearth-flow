id: d8100000-0000-4000-8000-000000000000
name: PLATEAU6.FloodingAreaTriangleChecks
# Checks every triangle of a flood-zone surface the way the flood-zone quality
# requirement defines it, and emits one feature per finding.
#
# A well-formed triangle is written as four coordinates (three corners plus the
# repeated first one), winds counter-clockwise on the ground, and encloses a real
# area. Each of those is reported on its own port, and a triangle can fail
# several at once: the checks are independent, and the result sheet counts a
# triangle once per column it offends.
#
# `triangles` carries every face that reached the checks, whether or not it
# failed any, because matching edges between triangles is scoped differently per
# feature type and so belongs to the workflow that reads this graph rather than
# to this graph.
#
# A triangle is linear or point-like when two of its corners lie within 0.01 of
# each other, or one corner lies within 0.01 of the opposite edge. That distance
# is in the coordinate unit, so the incoming geometry must already be in a
# projected frame.
nodes:
  - id: d8100000-0000-4000-8000-000000000001
    name: InputRouter
    type: action
    action: Input Router
    with:
      routingPort: features

  - id: d8100000-0000-4000-8000-000000000002
    name: GeometryCoercerFaces
    type: action
    action: Geometry Coercer
    with:
      targetType: polygon

  - id: d8100000-0000-4000-8000-000000000003
    name: GeometrySplitterMembers
    type: action
    action: Geometry Splitter

  # A welded surface coerces into a collection nested inside its MultiSurface, so
  # reaching the faces takes a second split. A face that is already alone passes
  # through unchanged.
  - id: d8100000-0000-4000-8000-000000000004
    name: GeometrySplitterFaces
    type: action
    action: Geometry Splitter

  - id: d8100000-0000-4000-8000-000000000005
    name: TrianglesRouter
    type: action
    action: Output Router
    with:
      routingPort: triangles

  # --- Closure and vertex count ---
  - id: d8100000-0000-4000-8000-000000000006
    name: TriangleRingChecks
    type: subGraph
    subGraphId: c5000000-0000-4000-8000-000000000000

  # --- Collapse ---
  # Read on the 3D face: two corners that share their horizontal position but not
  # their height are two corners, and flattening first would merge them.
  # Two corners within `duplicateTolerance` count as one, and a triangle no
  # higher than `minHeight` over its longest edge has its corners on one line.
  - id: d8100000-0000-4000-8000-000000000007
    name: GeometryValidatorCollapse
    type: action
    action: Geometry Validator
    with:
      duplicateTolerance: 0.01
      degenerateThresholds:
        minHeight: 0.01

  # Either way the triangle collapses to a line or a point, which is what the
  # requirement calls a linear or point-like triangle.
  - id: d8100000-0000-4000-8000-000000000008
    name: FeatureFilterDegenerate
    type: action
    action: Feature Filter
    with:
      conditions:
        - expr:
            type: flowExpr
            value: |
              checks = attributes["validationResult"]["checks"];
              checks.get("DuplicatePoints", 0) > 0 or checks.get("Degenerate", 0) > 0
          outputPort: degenerate

  - id: d8100000-0000-4000-8000-000000000009
    name: NotClosedRouter
    type: action
    action: Output Router
    with:
      routingPort: notClosed

  - id: d8100000-0000-4000-8000-00000000000a
    name: DegenerateRouter
    type: action
    action: Output Router
    with:
      routingPort: degenerate

  - id: d8100000-0000-4000-8000-00000000000d
    name: IncorrectVertexCountRouter
    type: action
    action: Output Router
    with:
      routingPort: incorrectVertexCount

  # --- Winding ---
  # Keep the 3D face aside before it is flattened: the port is contracted to emit
  # the triangle as modelled, not the outline the check reads.
  - id: d8100000-0000-4000-8000-00000000000e
    name: GeometryExtractorFace
    type: action
    action: Geometry Extractor
    with:
      outputAttribute: _originalTriangle

  # A 3D face has no absolute winding, so the triangle is flattened before the
  # winding is read.
  - id: d8100000-0000-4000-8000-00000000000f
    name: TwoDimensionForcer
    type: action
    action: Two Dimension Forcer

  - id: d8100000-0000-4000-8000-000000000010
    name: GeometryValidatorFlattened
    type: action
    action: Geometry Validator

  # Counter-clockwise on the ground is the only correct winding. A triangle that
  # encloses nothing has no winding at all, and the requirement counts that as
  # incorrect too rather than passing it over.
  - id: d8100000-0000-4000-8000-000000000011
    name: FeatureFilterOrientation
    type: action
    action: Feature Filter
    with:
      conditions:
        - expr:
            type: flowExpr
            value: attributes["validationResult"]["checks"].get("Orientation", 0) > 0 or attributes["validationResult"]["checks"].get("Degenerate", 0) > 0
          outputPort: incorrectOrientation

  - id: d8100000-0000-4000-8000-000000000012
    name: GeometryReplacerFace
    type: action
    action: Geometry Replacer
    with:
      sourceAttribute: _originalTriangle

  - id: d8100000-0000-4000-8000-000000000013
    name: IncorrectOrientationRouter
    type: action
    action: Output Router
    with:
      routingPort: incorrectOrientation

  # Geometry no step could handle is reported rather than dropped. The workflow
  # reading this graph decides what to call it; what matters here is that it
  # leaves by a port.
  - id: d8100000-0000-4000-8000-000000000014
    name: RejectedRouter
    type: action
    action: Output Router
    with:
      routingPort: rejected

edges:
  - id: d8100000-0000-4000-8000-000000000101
    from: d8100000-0000-4000-8000-000000000001
    to: d8100000-0000-4000-8000-000000000002
    fromPort: features
    toPort: features
  - id: d8100000-0000-4000-8000-000000000102
    from: d8100000-0000-4000-8000-000000000002
    to: d8100000-0000-4000-8000-000000000003
    fromPort: features
    toPort: features
  - id: d8100000-0000-4000-8000-000000000103
    from: d8100000-0000-4000-8000-000000000003
    to: d8100000-0000-4000-8000-000000000004
    fromPort: features
    toPort: features

  ## Every face, for the edge matching the reading workflow scopes itself
  - id: d8100000-0000-4000-8000-000000000104
    from: d8100000-0000-4000-8000-000000000004
    to: d8100000-0000-4000-8000-000000000005
    fromPort: features
    toPort: features

  ## Closure and vertex count
  - id: d8100000-0000-4000-8000-000000000105
    from: d8100000-0000-4000-8000-000000000004
    to: d8100000-0000-4000-8000-000000000006
    fromPort: features
    toPort: features
  - id: d8100000-0000-4000-8000-000000000108
    from: d8100000-0000-4000-8000-000000000006
    to: d8100000-0000-4000-8000-000000000009
    fromPort: notClosed
    toPort: features
  - id: d8100000-0000-4000-8000-00000000010c
    from: d8100000-0000-4000-8000-000000000006
    to: d8100000-0000-4000-8000-00000000000d
    fromPort: incorrectVertexCount
    toPort: features

  ## Collapse
  # `rejected` is not wired: the ring checks reject the same face and report it.
  - id: d8100000-0000-4000-8000-000000000106
    from: d8100000-0000-4000-8000-000000000004
    to: d8100000-0000-4000-8000-000000000007
    fromPort: features
    toPort: features
  - id: d8100000-0000-4000-8000-000000000107
    from: d8100000-0000-4000-8000-000000000007
    to: d8100000-0000-4000-8000-000000000008
    fromPort: failed
    toPort: features
  - id: d8100000-0000-4000-8000-000000000109
    from: d8100000-0000-4000-8000-000000000008
    to: d8100000-0000-4000-8000-00000000000a
    fromPort: degenerate
    toPort: features

  ## Winding
  - id: d8100000-0000-4000-8000-00000000010d
    from: d8100000-0000-4000-8000-000000000004
    to: d8100000-0000-4000-8000-00000000000e
    fromPort: features
    toPort: features
  - id: d8100000-0000-4000-8000-00000000010e
    from: d8100000-0000-4000-8000-00000000000e
    to: d8100000-0000-4000-8000-00000000000f
    fromPort: features
    toPort: features
  - id: d8100000-0000-4000-8000-00000000010f
    from: d8100000-0000-4000-8000-00000000000f
    to: d8100000-0000-4000-8000-000000000010
    fromPort: features
    toPort: features
  - id: d8100000-0000-4000-8000-000000000110
    from: d8100000-0000-4000-8000-000000000010
    to: d8100000-0000-4000-8000-000000000011
    fromPort: failed
    toPort: features
  - id: d8100000-0000-4000-8000-000000000111
    from: d8100000-0000-4000-8000-000000000011
    to: d8100000-0000-4000-8000-000000000012
    fromPort: incorrectOrientation
    toPort: features
  - id: d8100000-0000-4000-8000-000000000112
    from: d8100000-0000-4000-8000-000000000012
    to: d8100000-0000-4000-8000-000000000013
    fromPort: features
    toPort: features
  # A triangle whose stored 3D geometry will not decode is still wound the wrong
  # way, so it is reported with its flattened outline rather than dropped.
  - id: d8100000-0000-4000-8000-000000000113
    from: d8100000-0000-4000-8000-000000000012
    to: d8100000-0000-4000-8000-000000000013
    fromPort: rejected
    toPort: features

  ## Geometry no step could handle
  - id: d8100000-0000-4000-8000-000000000114
    from: d8100000-0000-4000-8000-000000000006
    to: d8100000-0000-4000-8000-000000000014
    fromPort: rejected
    toPort: features
  - id: d8100000-0000-4000-8000-000000000115
    from: d8100000-0000-4000-8000-00000000000f
    to: d8100000-0000-4000-8000-000000000014
    fromPort: rejected
    toPort: features
  - id: d8100000-0000-4000-8000-000000000116
    from: d8100000-0000-4000-8000-000000000010
    to: d8100000-0000-4000-8000-000000000014
    fromPort: rejected
    toPort: features

ports:
  outputs:
    - id: triangles
      nodeId: d8100000-0000-4000-8000-000000000005
      port: features
    - id: notClosed
      nodeId: d8100000-0000-4000-8000-000000000009
      port: features
    - id: degenerate
      nodeId: d8100000-0000-4000-8000-00000000000a
      port: features
    - id: incorrectVertexCount
      nodeId: d8100000-0000-4000-8000-00000000000d
      port: features
    - id: incorrectOrientation
      nodeId: d8100000-0000-4000-8000-000000000013
      port: features
    - id: rejected
      nodeId: d8100000-0000-4000-8000-000000000014
      port: features
