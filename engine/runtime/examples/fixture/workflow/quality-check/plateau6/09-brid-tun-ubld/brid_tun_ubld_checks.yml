            type: flowExpr
            value: attributes.get("LOD2 立体のエラー", 0)
        - newAttribute: "LOD3 境界面のエラー"
          expr:
            type: flowExpr
            value: attributes.get("LOD3 境界面のエラー", 0)
        - newAttribute: "LOD3 非水密立体"
          expr:
            type: flowExpr
            value: attributes.get("LOD3 非水密立体", 0)
        - newAttribute: "LOD3 立体のエラー"
          expr:
            type: flowExpr
            value: attributes.get("LOD3 立体のエラー", 0)
        # totalErrorCount drives qc_result_ok suppression at the entry graph.
        - newAttribute: totalErrorCount
          expr:
            type: flowExpr
            value: |
              itertools.sum([
                attributes.get("LOD0 面のエラー", 0),
                attributes.get("LOD0 面の向きエラー", 0),
                attributes.get("LOD0 面の交差", 0),
                attributes.get("LOD1 境界面のエラー", 0),
                attributes.get("LOD1 非水密立体", 0),
                attributes.get("LOD1 立体のエラー", 0),
                attributes.get("LOD2 境界面のエラー", 0),
                attributes.get("LOD2 非水密立体", 0),
                attributes.get("LOD2 立体のエラー", 0),
                attributes.get("LOD3 境界面のエラー", 0),
                attributes.get("LOD3 非水密立体", 0),
                attributes.get("LOD3 立体のエラー", 0),
              ])

  # `Folder` only selects the output file and `totalErrorCount` only drives
  # qc_result_ok; neither is one of the summary's counts.
  - id: da000000-0000-4000-8000-00000000005f
    name: JSONSummaryWriter
    type: action
    action: Feature Writer
    with:
      format:
        type: json
        converter:
          type: flowExpr
          value: |
            if len(attributes["__features"]) == 0 {
              []
            } else {
              feature = attributes["__features"][0];
              keys = itertools.filter(feature.keys(), fn(key) {
                key != "Folder" and key != "totalErrorCount"
              });
              itertools.map(keys, fn(key) {
                {"name": key, "count": feature[key]}
              })
            }
      output:
        type: flowExpr
        value: '"summary_" + attributes["Folder"] + ".json"'

  - id: da000000-0000-4000-8000-000000000060
    name: OutputRouter
    type: action
    action: Output Router
    with:
      routingPort: features

  - id: da000000-0000-4000-8000-000000000061
    name: OutputRouterSummary
    type: action
    action: Output Router
    with:
      routingPort: summaryOutput

