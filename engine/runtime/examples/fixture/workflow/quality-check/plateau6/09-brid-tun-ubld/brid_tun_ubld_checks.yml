  # --- Per file result row and summary ---
  # One row per GML file, the way the original workspace builds its 検査結果一覧
  # sheet. Every error count is joined onto that same key. The package is part of
  # the key: each one writes its own result file, so their counts never share a row.
  #
  # The face checks of LOD0 and LOD1 add up the spots each row flagged; the
  # other counts are rows.
  - id: da000000-0000-4000-8000-000000000053
    name: Lod0SurfaceErrorCounter
    type: action
    action: Statistics Calculator
    with:
      groupBy:
        - Folder
        - Filename
      calculations:
        - newAttribute: _num_lod0_surface
          expr:
            type: flowExpr
            value: attributes["エラー数"]

  - id: da000000-0000-4000-8000-000000000054
    name: Lod0OrientationErrorCounter
    type: action
    action: Statistics Calculator
    with:
      groupBy:
        - Folder
        - Filename
      calculations:
        - newAttribute: _num_lod0_orientation
          expr:
            type: flowExpr
            value: "1"

  - id: da000000-0000-4000-8000-000000000055
