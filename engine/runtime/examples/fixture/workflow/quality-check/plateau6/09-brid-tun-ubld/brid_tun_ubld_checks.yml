# PLATEAU6 (CityGML 3.0 + i-UR 4.0) quality-check 09-brid-tun-ubld sub-graph.
# Runs the bridge / tunnel / underground building checks over every GML in the
# archive: the LOD0 face checks (validity, orientation, overlaps between faces),
# the per-face validity checks of LOD1 and of LOD2 and above, and the
# shell-level solid checks, plus the per feature-type instance count the result
# sheet reports alongside them.
#
# Every count takes part in totalErrorCount, so any finding suppresses qc_result_ok.
id: da000000-0000-4000-8000-000000000000
name: PLATEAU6.BridgeTunnelUndergroundBuildingQualityCheck-09-brid-tun-ubld
nodes:
  - id: da000000-0000-4000-8000-000000000001
    name: InputRouter
    type: action
    action: Input Router
    with:
      routingPort: features

  - id: da000000-0000-4000-8000-000000000002
    name: FeatureFilePathExtractor
    type: action
    action: Feature File Path Extractor
    with:
      sourceDataset:
        type: flowExpr
        value: attributes["cityGmlPath"]
      extractArchive: true
      destPrefix: udx

  - id: da000000-0000-4000-8000-000000000003
    name: FeatureFilterByGml
    type: action
    action: Feature Filter
    with:
      conditions:
        - expr:
            type: flowExpr
            value: attributes["extension"] == "gml"
          outputPort: features

  - id: da000000-0000-4000-8000-000000000004
    name: FeatureCounterFileIndex
    type: action
    action: Feature Counter
    with:
      countStart: 1
      outputAttribute: fileIndex

  # Places `codelists` and `schemas` next to `udx` so the reader can resolve
  # every codeSpace and schemaLocation the GML points at.
  - id: da000000-0000-4000-8000-000000000005
    name: PLATEAU6.UDXFolderExtractor
    type: action
    action: PLATEAU6.UDXFolderExtractor
    with:
      cityGmlPath:
        type: flowExpr
        value: attributes["path"]
      codelistsPath: codelists
      schemasPath: schemas

  - id: da000000-0000-4000-8000-000000000006
    name: FeatureFilterByPackage
    type: action
    action: Feature Filter
    with:
      conditions:
        - expr:
            type: flowExpr
            value: not variables["targetPackages"] or attributes["package"] in variables["targetPackages"]
          outputPort: features

  # --- Reading ---
  # Every nested city object and boundary surface becomes a feature of its own,
  # so a finding is reported against the object that owns the face, as the
  # original reader does.
  - id: da000000-0000-4000-8000-000000000007
    name: FeatureCityGml3Reader
    type: action
    action: Feature CityGML 3 Reader
    with:
      dataset:
        type: flowExpr
        value: attributes["path"]
      extractTags:
        - brid:Bridge
        - brid:BridgePart
        - brid:BridgeRoom
        - brid:BridgeFurniture
        - brid:BridgeInstallation
        - brid:BridgeConstructiveElement
        - tun:Tunnel
        - tun:TunnelPart
        - tun:HollowSpace
        - tun:TunnelFurniture
        - tun:TunnelInstallation
        - tun:TunnelConstructiveElement
        - uro:UndergroundBuilding
        - bldg:BuildingPart
        - bldg:BuildingRoom
        - bldg:BuildingFurniture
        - bldg:BuildingInstallation
        - bldg:BuildingConstructiveElement
        - con:GroundSurface
        - con:WallSurface
        - con:RoofSurface
        - con:OuterCeilingSurface
        - con:OuterFloorSurface
        - con:InteriorWallSurface
        - con:CeilingSurface
        - con:FloorSurface
        - con:DoorSurface
        - con:WindowSurface
        - con:Door
        - con:Window
        - core:ClosureSurface

  # Reprojected before any check: planarity, the absolute winding of a face and
  # the shell checks are only defined in a linear-unit frame.
  - id: da000000-0000-4000-8000-000000000008
    name: CoordinateFrameReprojector
    type: action
    action: Coordinate Frame Reprojector
    with:
      destinationFrame:
        crs:
          type: flowExpr
          value: variables["prcs"]

  - id: da000000-0000-4000-8000-000000000009
    name: LodSplitter
    type: subGraph
    subGraphId: b1000000-0000-4000-8000-000000000000

  # A city object the reprojection could not convert takes part in no check at
  # all, so it is reported as a LOD1 boundary surface error rather than dropped.
  - id: da000000-0000-4000-8000-00000000000a
    name: AttributeManagerReprojectionRejected
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: issue
          method: create
          value:
            type: string
            value: GeometryRejected
        - attribute: issueCount
          method: create
          value:
            type: flowExpr
            value: "1"

  # --- LOD0 face checks ---
  # LOD0 also carries centre lines, which are not faces and take no face check.
  - id: da000000-0000-4000-8000-00000000000b
    name: GeometryFilterLod0
    type: action
    action: Geometry Filter
    with:
      filterType: geometryType

  - id: da000000-0000-4000-8000-00000000000c
    name: SurfaceChecksLod0
    type: subGraph
    subGraphId: c4100000-0000-4000-8000-000000000000

  - id: da000000-0000-4000-8000-00000000000d
    name: Lod0SurfaceAttributeMapper
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: Index
          valueAttribute: fileIndex
        - attribute: Folder
          valueAttribute: package
        - attribute: Filename
          valueAttribute: name
        # A face belongs to the innermost city object that encloses it, which
        # is not the feature the reader emitted it on.
        - attribute: FeatureType
          expr:
            type: flowExpr
            value: (attributes.get("__citygml_geometry_feature_type") or attributes.get("__citygml_feature_type", "")).split(":")[-1]
        - attribute: LOD
          valueAttribute: lod
        - attribute: GmlId
          expr:
            type: flowExpr
            value: attributes.get("__citygml_geometry_gml_id") or attributes.get("__citygml_gml_id", "")
        - attribute: "エラー数"
          valueAttribute: issueCount
        - attribute: "エラー内容"
          expr:
            type: flowExpr
            value: attributes.get("issue", "UnknownError")

  - id: da000000-0000-4000-8000-00000000000e
    name: Lod0SurfaceCsvWriter
    type: action
    action: Feature Writer
    with:
      format:
        type: csv
      output:
        type: flowExpr
        value: |
          variables["packagePrefixes"][attributes["Folder"]] + "_LOD0面のエラー.csv"

  # The GeoJSON layers repeat the CSV rows with the geometry attached, so the
  # keys mirror the CSV columns in camelCase.
  - id: da000000-0000-4000-8000-00000000000f
    name: Lod0SurfaceAttributeMapperGeoJson
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: index
          valueAttribute: fileIndex
        - attribute: folder
          valueAttribute: package
        - attribute: filename
          valueAttribute: name
        - attribute: featureType
          expr:
            type: flowExpr
            value: (attributes.get("__citygml_geometry_feature_type") or attributes.get("__citygml_feature_type", "")).split(":")[-1]
        - attribute: gmlId
          expr:
            type: flowExpr
            value: attributes.get("__citygml_geometry_gml_id") or attributes.get("__citygml_gml_id", "")
        - attribute: lod
          valueAttribute: lod
        - attribute: issue
          expr:
            type: flowExpr
            value: attributes.get("issue", "UnknownError")
        - attribute: issueCount
          valueAttribute: issueCount

  - id: da000000-0000-4000-8000-000000000010
    name: Lod0SurfaceGeoJsonWriter
    type: action
    action: Feature GeoJSON Writer
    with:
      output:
        type: flowExpr
        value: |
          "error_geometry/" + variables["packagePrefixes"][attributes["folder"]] + "_LOD0面のエラー.geojson"
      writeCrs: true

  # One feature per flagged position rather than per face, so `issue` names the
  # single check that flagged this spot and no count attribute is needed.
  - id: da000000-0000-4000-8000-000000000011
    name: Lod0IssueLocationAttributeMapperGeoJson
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: index
          valueAttribute: fileIndex
        - attribute: folder
          valueAttribute: package
        - attribute: filename
          valueAttribute: name
        - attribute: featureType
          expr:
            type: flowExpr
            value: (attributes.get("__citygml_geometry_feature_type") or attributes.get("__citygml_feature_type", "")).split(":")[-1]
        - attribute: gmlId
          expr:
            type: flowExpr
            value: attributes.get("__citygml_geometry_gml_id") or attributes.get("__citygml_gml_id", "")
        - attribute: lod
          valueAttribute: lod
        - attribute: issue
          expr:
            type: flowExpr
            value: attributes.get("issue", "UnknownError")

  - id: da000000-0000-4000-8000-000000000012
    name: Lod0IssueLocationGeoJsonWriter
    type: action
    action: Feature GeoJSON Writer
    with:
      output:
        type: flowExpr
        value: |
          "error_geometry/" + variables["packagePrefixes"][attributes["folder"]] + "_LOD0面のエラー位置.geojson"
      writeCrs: true

  - id: da000000-0000-4000-8000-000000000013
    name: Lod0OrientationAttributeMapper
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: Index
          valueAttribute: fileIndex
        - attribute: Folder
          valueAttribute: package
        - attribute: Filename
          valueAttribute: name
        - attribute: FeatureType
          expr:
            type: flowExpr
            value: (attributes.get("__citygml_geometry_feature_type") or attributes.get("__citygml_feature_type", "")).split(":")[-1]
        - attribute: LOD
          valueAttribute: lod
        - attribute: GmlId
          expr:
            type: flowExpr
            value: attributes.get("__citygml_geometry_gml_id") or attributes.get("__citygml_gml_id", "")
        # Reaching this mapper already means the face is wound the wrong way, so
        # the count and the two labels are fixed.
        - attribute: "エラー数"
          expr:
            type: flowExpr
            value: "1"
        - attribute: "エラー内容"
          expr:
            type: string
            value: Incorrect Orientation
        - attribute: "面の向き"
          expr:
            type: string
            value: right_hand_rule

  - id: da000000-0000-4000-8000-000000000014
    name: Lod0OrientationCsvWriter
    type: action
    action: Feature Writer
    with:
      format:
        type: csv
      output:
        type: flowExpr
        value: |
          variables["packagePrefixes"][attributes["Folder"]] + "_LOD0面の向きエラー.csv"

  - id: da000000-0000-4000-8000-000000000015
    name: Lod0OrientationAttributeMapperGeoJson
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: index
          valueAttribute: fileIndex
        - attribute: folder
          valueAttribute: package
        - attribute: filename
          valueAttribute: name
        - attribute: featureType
          expr:
            type: flowExpr
            value: (attributes.get("__citygml_geometry_feature_type") or attributes.get("__citygml_feature_type", "")).split(":")[-1]
        - attribute: gmlId
          expr:
            type: flowExpr
            value: attributes.get("__citygml_geometry_gml_id") or attributes.get("__citygml_gml_id", "")
        - attribute: lod
          valueAttribute: lod
        - attribute: issue
          expr:
            type: string
            value: Incorrect Orientation
        - attribute: issueCount
          expr:
            type: flowExpr
            value: "1"
        - attribute: orientation
          expr:
            type: string
            value: right_hand_rule

  - id: da000000-0000-4000-8000-000000000016
    name: Lod0OrientationGeoJsonWriter
    type: action
    action: Feature GeoJSON Writer
    with:
      output:
        type: flowExpr
        value: |
          "error_geometry/" + variables["packagePrefixes"][attributes["folder"]] + "_LOD0面の向きエラー.geojson"
      writeCrs: true

  # --- LOD0 face overlaps ---
  # Every LOD0 face takes part, whatever the face checks found. Faces of every
  # file in the run are overlaid together, as the original does.
  - id: da000000-0000-4000-8000-000000000017
    name: GeometryCoercerLod0Faces
    type: action
    action: Geometry Coercer
    with:
      targetType: polygon

  - id: da000000-0000-4000-8000-000000000018
    name: GeometrySplitterLod0Members
    type: action
    action: Geometry Splitter

  # A welded CompositeSurface coerces into a collection nested inside its
  # MultiSurface, so reaching the faces takes a second split.
  - id: da000000-0000-4000-8000-000000000019
    name: GeometrySplitterLod0Faces
    type: action
    action: Geometry Splitter

  # The overlayer keeps only the overlap region, and the error detail output
  # also reports the faces that produced it.
  - id: da000000-0000-4000-8000-00000000001a
    name: GeometryExtractorLod0Face
    type: action
    action: Geometry Extractor
    with:
      outputAttribute: _lod0_geometry

  # Orders the faces of an overlap by file, then by owning object, then by
  # position within that object. Objects of one file can arrive in any order, so
  # the counter alone would not give the same pairs on every run.
  - id: da000000-0000-4000-8000-00000000001b
    name: FeatureCounterLod0Face
    type: action
    action: Feature Counter
    with:
      countStart: 0
      outputAttribute: _lod0_face_seq

  - id: da000000-0000-4000-8000-00000000001c
    name: AttributeManagerLod0FaceKey
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: _lod0_face_key
          method: create
          value:
            type: flowExpr
            value: |
              gml_id = attributes.get("__citygml_geometry_gml_id") or attributes.get("__citygml_gml_id", "");
              attributes["name"] + "|" + gml_id + "|" + "{:010}".format(attributes["_lod0_face_seq"])

  - id: da000000-0000-4000-8000-00000000001d
    name: TwoDimensionForcerLod0
    type: action
    action: Two Dimension Forcer

  - id: da000000-0000-4000-8000-00000000001e
    name: AreaOnAreaOverlayerLod0
    type: action
    action: Area On Area Overlayer
    with:
      attributeAccumulation: dropAttributes
      outputAttribute: overlap
      listAttribute: list
      tolerance: 0.01

  # Overlaps are numbered by how many faces cover them, then in the reading
  # order of those faces, so the numbering does not depend on the order the
  # overlayer emits them in.
  - id: da000000-0000-4000-8000-00000000001f
    name: AttributeManagerLod0OverlapOrder
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: list
          method: convert
          value:
            type: flowExpr
            value: itertools.sorted(attributes["list"], fn(item) { item["_lod0_face_key"] })
        - attribute: _lod0_overlap_key
          method: create
          value:
            type: flowExpr
            value: |
              items = itertools.sorted(attributes["list"], fn(item) { item["_lod0_face_key"] });
              keys = itertools.map(items, fn(item) { item["_lod0_face_key"] });
              "{:04}".format(len(items)) + "|" + "|".join(keys)

  - id: da000000-0000-4000-8000-000000000020
    name: FeatureSorterLod0Overlap
    type: action
    action: Feature Sorter
    with:
      attributes:
        - _lod0_overlap_key
      order: ascending

  - id: da000000-0000-4000-8000-000000000021
    name: FeatureCounterLod0Intersection
    type: action
    action: Feature Counter
    with:
      countStart: 0
      outputAttribute: _intersection_id

  # An area covered by three or more faces is still reported as one pair: the
  # first two faces of the region.
  - id: da000000-0000-4000-8000-000000000022
    name: Lod0IntersectionAttributeMapper
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: Folder
          expr:
            type: flowExpr
            value: attributes["list"][0]["package"]
        - attribute: IntersectionId
          expr:
            type: flowExpr
            value: '"lod0-{:04}".format(attributes["_intersection_id"])'
        - attribute: IndexA
          expr:
            type: flowExpr
            value: attributes["list"][0]["fileIndex"]
        - attribute: FilenameA
          expr:
            type: flowExpr
            value: attributes["list"][0]["name"]
        - attribute: FeatureTypeA
          expr:
            type: flowExpr
            value: |
              item = attributes["list"][0];
              (item.get("__citygml_geometry_feature_type") or item.get("__citygml_feature_type", "")).split(":")[-1]
        - attribute: LODA
          expr:
            type: flowExpr
            value: attributes["list"][0]["lod"]
        - attribute: GmlIdA
          expr:
            type: flowExpr
            value: |
              item = attributes["list"][0];
              item.get("__citygml_geometry_gml_id") or item.get("__citygml_gml_id", "")
        - attribute: IndexB
          expr:
            type: flowExpr
            value: attributes["list"][1]["fileIndex"]
        - attribute: FilenameB
          expr:
            type: flowExpr
            value: attributes["list"][1]["name"]
        - attribute: FeatureTypeB
          expr:
            type: flowExpr
            value: |
              item = attributes["list"][1];
              (item.get("__citygml_geometry_feature_type") or item.get("__citygml_feature_type", "")).split(":")[-1]
        - attribute: LODB
          expr:
            type: flowExpr
            value: attributes["list"][1]["lod"]
        - attribute: GmlIdB
          expr:
            type: flowExpr
            value: |
              item = attributes["list"][1];
              item.get("__citygml_geometry_gml_id") or item.get("__citygml_gml_id", "")
        - attribute: "エラー内容"
          expr:
            type: string
            value: Surface Intersection

  - id: da000000-0000-4000-8000-000000000023
    name: Lod0IntersectionCsvWriter
    type: action
    action: Feature Writer
    with:
      format:
        type: csv
      output:
        type: flowExpr
        value: |
          variables["packagePrefixes"][attributes["Folder"]] + "_LOD0面の交差.csv"

  # The overlap region itself, with the pair that produced it.
  - id: da000000-0000-4000-8000-000000000024
    name: Lod0IntersectionAttributeMapperGeoJson
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: folder
          valueAttribute: Folder
        - attribute: issue
          valueAttribute: "エラー内容"
        - attribute: intersectionId
          valueAttribute: IntersectionId
        - attribute: indexA
          valueAttribute: IndexA
        - attribute: filenameA
          valueAttribute: FilenameA
        - attribute: featureTypeA
          valueAttribute: FeatureTypeA
        - attribute: lodA
          valueAttribute: LODA
        - attribute: gmlIdA
          valueAttribute: GmlIdA
        - attribute: indexB
          valueAttribute: IndexB
        - attribute: filenameB
          valueAttribute: FilenameB
        - attribute: featureTypeB
          valueAttribute: FeatureTypeB
        - attribute: lodB
          valueAttribute: LODB
        - attribute: gmlIdB
          valueAttribute: GmlIdB

  - id: da000000-0000-4000-8000-000000000025
    name: Lod0IntersectionGeoJsonWriter
    type: action
    action: Feature GeoJSON Writer
    with:
      output:
        type: flowExpr
        value: |
          "error_geometry/" + variables["packagePrefixes"][attributes["folder"]] + "_LOD0面の交差.geojson"
      writeCrs: true

  # Every face that makes up a region, one feature per face, with the face
  # restored from the geometry put aside before the overlay.
  - id: da000000-0000-4000-8000-000000000026
    name: ListExploderLod0Intersected
    type: action
    action: List Exploder
    with:
      sourceAttribute: list

  - id: da000000-0000-4000-8000-000000000027
    name: GeometryReplacerLod0Intersected
    type: action
    action: Geometry Replacer
    with:
      sourceAttribute: _lod0_geometry

  - id: da000000-0000-4000-8000-000000000028
    name: Lod0IntersectedAttributeMapperGeoJson
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: index
          valueAttribute: fileIndex
        - attribute: folder
          valueAttribute: package
        - attribute: filename
          valueAttribute: name
        - attribute: featureType
          expr:
            type: flowExpr
            value: (attributes.get("__citygml_geometry_feature_type") or attributes.get("__citygml_feature_type", "")).split(":")[-1]
        - attribute: gmlId
          expr:
            type: flowExpr
            value: attributes.get("__citygml_geometry_gml_id") or attributes.get("__citygml_gml_id", "")
        - attribute: lod
          valueAttribute: lod
        - attribute: issue
          expr:
            type: string
            value: Surface Intersection
        - attribute: intersectionId
          valueAttribute: _intersection_id

  - id: da000000-0000-4000-8000-000000000029
    name: Lod0IntersectedGeoJsonWriter
    type: action
    action: Feature GeoJSON Writer
    with:
      output:
        type: flowExpr
        value: |
          "error_geometry/" + variables["packagePrefixes"][attributes["folder"]] + "_LOD0面の交差地物.geojson"
      writeCrs: true

  # The result sheet counts a region once per face that makes it up.
  - id: da000000-0000-4000-8000-00000000002a
    name: Lod0IntersectedRowMapper
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: Folder
          valueAttribute: package
        - attribute: Filename
          valueAttribute: name

  # --- LOD1 face checks ---
  # The original checks LOD1 planarity against a tighter thickness than the
  # higher LODs.
  - id: da000000-0000-4000-8000-00000000002b
    name: SurfaceChecksLod1
    type: subGraph
    subGraphId: c4000000-0000-4000-8000-000000000000
    with:
      planarityThreshold:
        maxHeight: 0.001

  - id: da000000-0000-4000-8000-00000000002c
    name: Lod1SurfaceAttributeMapper
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: Index
          valueAttribute: fileIndex
        - attribute: Folder
          valueAttribute: package
        - attribute: Filename
          valueAttribute: name
        - attribute: FeatureType
          expr:
            type: flowExpr
            value: (attributes.get("__citygml_geometry_feature_type") or attributes.get("__citygml_feature_type", "")).split(":")[-1]
        - attribute: LOD
          valueAttribute: lod
        - attribute: GmlId
          expr:
            type: flowExpr
            value: attributes.get("__citygml_geometry_gml_id") or attributes.get("__citygml_gml_id", "")
        - attribute: "エラー数"
          valueAttribute: issueCount
        - attribute: "エラー内容"
          expr:
            type: flowExpr
            value: attributes.get("issue", "UnknownError")

  - id: da000000-0000-4000-8000-00000000002d
    name: Lod1SurfaceCsvWriter
    type: action
    action: Feature Writer
    with:
      format:
        type: csv
      output:
        type: flowExpr
        value: |
          variables["packagePrefixes"][attributes["Folder"]] + "_LOD1境界面のエラー.csv"

  # City objects the reprojection could not convert are deliberately left out of
  # the GeoJSON layers: they are still in the input CRS, and mixing frames in
  # one file forces the `crs` member to null.
  - id: da000000-0000-4000-8000-00000000002e
    name: Lod1SurfaceAttributeMapperGeoJson
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: index
          valueAttribute: fileIndex
        - attribute: folder
          valueAttribute: package
        - attribute: filename
          valueAttribute: name
        - attribute: featureType
          expr:
            type: flowExpr
            value: (attributes.get("__citygml_geometry_feature_type") or attributes.get("__citygml_feature_type", "")).split(":")[-1]
        - attribute: gmlId
          expr:
            type: flowExpr
            value: attributes.get("__citygml_geometry_gml_id") or attributes.get("__citygml_gml_id", "")
        - attribute: lod
          valueAttribute: lod
        - attribute: issue
          expr:
            type: flowExpr
            value: attributes.get("issue", "UnknownError")
        - attribute: issueCount
          valueAttribute: issueCount

  - id: da000000-0000-4000-8000-00000000002f
    name: Lod1SurfaceGeoJsonWriter
    type: action
    action: Feature GeoJSON Writer
    with:
      output:
        type: flowExpr
        value: |
          "error_geometry/" + variables["packagePrefixes"][attributes["folder"]] + "_LOD1境界面のエラー.geojson"
      writeCrs: true

  - id: da000000-0000-4000-8000-000000000030
    name: Lod1IssueLocationAttributeMapperGeoJson
    type: action
    action: Attribute Mapper
    with:
      mappers:
        - attribute: index
          valueAttribute: fileIndex
        - attribute: folder
          valueAttribute: package
        - attribute: filename
          valueAttribute: name
        - attribute: featureType
          expr:
            type: flowExpr
            value: (attributes.get("__citygml_geometry_feature_type") or attributes.get("__citygml_feature_type", "")).split(":")[-1]
        - attribute: gmlId
          expr:
            type: flowExpr
            value: attributes.get("__citygml_geometry_gml_id") or attributes.get("__citygml_gml_id", "")
        - attribute: lod
          valueAttribute: lod
        - attribute: issue
          expr:
            type: flowExpr
            value: attributes.get("issue", "UnknownError")

  - id: da000000-0000-4000-8000-000000000031
    name: Lod1IssueLocationGeoJsonWriter
    type: action
    action: Feature GeoJSON Writer
    with:
      output:
        type: flowExpr
        value: |
