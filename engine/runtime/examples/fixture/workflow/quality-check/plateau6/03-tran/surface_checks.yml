id: c4000000-0000-4000-8000-000000000000
name: TranSurfaceChecks
# Validates every face of the incoming geometry. Emits one feature per failed
# check per face on `invalidSurface` with the check name in `issue`, and every
# face whose 2D outline is wound against the coordinate frame on
# `inCorrectOrientation`. `issueLocation` repeats the same failures positioned
# at the spot each check flagged, for error detail output. Geometry no step
# could handle also leaves via `invalidSurface`, so nothing is dropped silently.
# Both face ports emit the face as modelled: the orientation branch restores the
# 3D face that its flattened check consumed.
nodes:
  - id: c4000000-0000-4000-8000-000000000001
    name: InputRouter
    type: action
    action: Input Router
    with:
      routingPort: features

  - id: c4000000-0000-4000-8000-000000000002
    name: GeometryCoercerFaces
    type: action
    action: Geometry Coercer
    with:
      targetType: polygon

  - id: c4000000-0000-4000-8000-000000000003
    name: GeometrySplitterMembers
    type: action
    action: Geometry Splitter

  # A welded CompositeSurface coerces into a collection nested inside its
  # MultiSurface, so reaching the faces takes a second split. A face that is
  # already alone passes through unchanged.
  - id: c4000000-0000-4000-8000-000000000004
    name: GeometrySplitterFaces
    type: action
    action: Geometry Splitter

  # Vertices within `duplicateTolerance` of each other count as one point: a
  # reprojected surface does not preserve exact coordinate equality.
  - id: c4000000-0000-4000-8000-000000000005
    name: GeometryValidatorFace
    type: action
    action: Geometry Validator
    with:
      duplicateTolerance: 0.01
      planarityThreshold:
        maxHeight: 0.03

  - id: c4000000-0000-4000-8000-000000000006
    name: AttributeManagerIssues
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: _issues
          method: create
          value:
            type: flowExpr
            value: |
              names = {
                "DuplicatePoints": "DuplicateConsecutivePoints",
                "InteriorRingContainment": "InteriorRingNotContainedInExteriorRing",
                "Planarity": "NonPlanarSurface",
                "Orientation": "IncorrectInteriorOrientation",
                "UnclosedRing": "RingNotClosed",
                "Degenerate": "DegenerateSurface",
                "Finite": "NonFiniteCoordinate",
              };
              checks = attributes["validationResult"]["checks"];
              itertools.map(itertools.sorted(checks.keys()), fn(k) { {"issue": names.get(k, k)} })

  - id: c4000000-0000-4000-8000-000000000007
    name: ListExploderIssues
    type: action
    action: List Exploder
    with:
      sourceAttribute: _issues

  - id: c4000000-0000-4000-8000-000000000008
    name: InvalidSurfaceRouter
    type: action
    action: Output Router
    with:
      routingPort: invalidSurface

  # Keep the 3D face aside before it is flattened: `inCorrectOrientation` is
  # contracted to emit the face as modelled, not the 2D outline the check reads.
  - id: c4000000-0000-4000-8000-00000000000e
    name: GeometryExtractorFace
    type: action
    action: Geometry Extractor
    with:
      outputAttribute: original_face_geometry

  # The absolute winding of a face's outline is a 2D property, so the face is
  # flattened before the orientation check reads it.
  - id: c4000000-0000-4000-8000-000000000009
    name: TwoDimensionForcer
    type: action
    action: Two Dimension Forcer

  # Only its `Orientation` result is read; the 3D pass above owns every other
  # check, so this one needs no thresholds of its own.
  - id: c4000000-0000-4000-8000-00000000000a
    name: GeometryValidatorOutline
    type: action
    action: Geometry Validator

  - id: c4000000-0000-4000-8000-00000000000b
    name: FeatureFilterByOrientation
    type: action
    action: Feature Filter
    with:
      conditions:
        - expr:
            type: flowExpr
            value: attributes["validationResult"]["checks"].get("Orientation", 0) > 0
          outputPort: inCorrectOrientation

  - id: c4000000-0000-4000-8000-00000000000f
    name: GeometryReplacerFace
    type: action
    action: Geometry Replacer
    with:
      sourceAttribute: original_face_geometry

  - id: c4000000-0000-4000-8000-00000000000c
    name: InCorrectOrientationRouter
    type: action
    action: Output Router
    with:
      routingPort: inCorrectOrientation

  # One feature per position the 3D pass flagged, carrying the position itself
  # as its geometry. Same name table as `AttributeManagerIssues`, applied to the
  # single check that produced this position.
  - id: c4000000-0000-4000-8000-000000000010
    name: AttributeManagerIssueLocation
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: issue
          method: create
          value:
            type: flowExpr
            value: |
              names = {
                "DuplicatePoints": "DuplicateConsecutivePoints",
                "InteriorRingContainment": "InteriorRingNotContainedInExteriorRing",
                "Planarity": "NonPlanarSurface",
                "Orientation": "IncorrectInteriorOrientation",
                "UnclosedRing": "RingNotClosed",
                "Degenerate": "DegenerateSurface",
                "Finite": "NonFiniteCoordinate",
              };
              check = attributes["validationCheck"];
              names.get(check, check)

  - id: c4000000-0000-4000-8000-000000000011
    name: IssueLocationRouter
    type: action
    action: Output Router
    with:
      routingPort: issueLocation

  - id: c4000000-0000-4000-8000-00000000000d
    name: AttributeManagerRejected
    type: action
    action: Attribute Manager
    with:
      operations:
        - attribute: issue
          method: create
          value:
            type: string
            value: GeometryRejected

edges:
  - id: c4000000-0000-4000-8000-000000000101
    from: c4000000-0000-4000-8000-000000000001
    to: c4000000-0000-4000-8000-000000000002
    fromPort: features
    toPort: features
  - id: c4000000-0000-4000-8000-000000000102
    from: c4000000-0000-4000-8000-000000000002
    to: c4000000-0000-4000-8000-000000000003
    fromPort: features
    toPort: features
  - id: c4000000-0000-4000-8000-000000000103
