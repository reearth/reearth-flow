    toPort: features
  - id: c4000000-0000-4000-8000-000000000105
    from: c4000000-0000-4000-8000-000000000005
    to: c4000000-0000-4000-8000-000000000006
    fromPort: failed
    toPort: features
  - id: c4000000-0000-4000-8000-000000000106
    from: c4000000-0000-4000-8000-000000000006
    to: c4000000-0000-4000-8000-000000000007
    fromPort: features
    toPort: features
  - id: c4000000-0000-4000-8000-000000000107
    from: c4000000-0000-4000-8000-000000000007
    to: c4000000-0000-4000-8000-000000000008
    fromPort: features
    toPort: features

  ## Issue locations
  - id: c4000000-0000-4000-8000-000000000110
    from: c4000000-0000-4000-8000-000000000005
    to: c4000000-0000-4000-8000-000000000010
    fromPort: issue-locations
    toPort: features
  - id: c4000000-0000-4000-8000-000000000111
    from: c4000000-0000-4000-8000-000000000010
    to: c4000000-0000-4000-8000-000000000011
    fromPort: features
    toPort: features

  ## Incorrect orientation
  - id: c4000000-0000-4000-8000-000000000108
    from: c4000000-0000-4000-8000-000000000004
    to: c4000000-0000-4000-8000-00000000000e
    fromPort: features
    toPort: features
  - id: c4000000-0000-4000-8000-000000000112
    from: c4000000-0000-4000-8000-00000000000e
    to: c4000000-0000-4000-8000-000000000009
    fromPort: features
    toPort: features
  - id: c4000000-0000-4000-8000-000000000109
    from: c4000000-0000-4000-8000-000000000009
    to: c4000000-0000-4000-8000-00000000000a
    fromPort: features
    toPort: features
  - id: c4000000-0000-4000-8000-00000000010a
    from: c4000000-0000-4000-8000-00000000000a
    to: c4000000-0000-4000-8000-00000000000b
    fromPort: failed
    toPort: features
  - id: c4000000-0000-4000-8000-00000000010b
    from: c4000000-0000-4000-8000-00000000000b
    to: c4000000-0000-4000-8000-00000000000f
    fromPort: inCorrectOrientation
    toPort: features
  - id: c4000000-0000-4000-8000-000000000113
    from: c4000000-0000-4000-8000-00000000000f
    to: c4000000-0000-4000-8000-00000000000c
    fromPort: features
    toPort: features
  # A face whose stored 3D geometry will not decode is still wound the wrong
  # way, so it is reported with the 2D outline rather than dropped.
  - id: c4000000-0000-4000-8000-000000000114
    from: c4000000-0000-4000-8000-00000000000f
    to: c4000000-0000-4000-8000-00000000000c
    fromPort: rejected
    toPort: features

  ## Geometry no step could handle is reported rather than dropped
  - id: c4000000-0000-4000-8000-00000000010c
    from: c4000000-0000-4000-8000-000000000005
    to: c4000000-0000-4000-8000-00000000000d
    fromPort: rejected
    toPort: features
  - id: c4000000-0000-4000-8000-00000000010d
    from: c4000000-0000-4000-8000-000000000009
    to: c4000000-0000-4000-8000-00000000000d
    fromPort: rejected
    toPort: features
  - id: c4000000-0000-4000-8000-00000000010e
    from: c4000000-0000-4000-8000-00000000000a
    to: c4000000-0000-4000-8000-00000000000d
    fromPort: rejected
    toPort: features
  - id: c4000000-0000-4000-8000-00000000010f
    from: c4000000-0000-4000-8000-00000000000d
    to: c4000000-0000-4000-8000-000000000008
    fromPort: features
    toPort: features

ports:
  outputs:
    - id: invalidSurface
      nodeId: c4000000-0000-4000-8000-000000000008
      port: features
    - id: inCorrectOrientation
      nodeId: c4000000-0000-4000-8000-00000000000c
      port: features
    - id: issueLocation
      nodeId: c4000000-0000-4000-8000-000000000011
      port: features
