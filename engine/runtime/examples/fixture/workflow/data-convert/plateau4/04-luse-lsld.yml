- id: 7c0e4a91-2d6b-4f83-9a15-e8b3d5f10c72
  name: AttributeTreeUnwrapper
  nodes:
  - id: a41d8e07-3b92-4c65-8f1a-06d7e92b4c38
    name: InputRouter
    type: action
    action: Input Router
    with:
      routingPort: features
  - id: 5f2b90c6-e1a4-4d73-b8e5-2c9a07d41f86
    name: AttributeManagerUnwrapTree
    type: action
    action: Attribute Manager
    with:
      operations:
      - attribute: cityGmlAttributes
        method: convert
        value:
          type: flowExpr
          value: |
            tree = attributes.get("cityGmlAttributes");
            stack = [];
            if type(tree) == dict { stack.append(tree); }
            while len(stack) > 0 {
              node = stack.pop();
              regrouped = {};
              for key in node.keys() {
                values = node[key];
                if type(values) != list { values = [values]; }
                for value in values {
                  name = key;
                  content = value;
                  if type(value) == dict and len(value) == 1 and type(value.values()[0]) != list {
                    name = value.keys()[0];
                    content = value.values()[0];
                  }
                  if regrouped.get(name) == null { regrouped[name] = []; }
                  regrouped[name].append(content);
                }
              }
              for key in node.keys() { node.pop(key); }
              for name in regrouped.keys() {
                contents = regrouped[name];
                if len(contents) == 1 and type(contents[0]) != dict { node[name] = contents[0]; } else { node[name] = contents; }
                for content in contents { if type(content) == dict { stack.append(content); } }
              }
            }
            tree
