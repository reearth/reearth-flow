      wrapTolerance: 0.1
      skipUnexposedAttributes: true
      output: |
        let gml_name_code = env.get("__value").__gml_name_code;
        file::join_path(env.get("workerArtifactPath"), "gen_" + gml_name_code + "_lod" + env.get("__value").__lod + "_3dtiles_full_attributes")
      compressOutput: |
