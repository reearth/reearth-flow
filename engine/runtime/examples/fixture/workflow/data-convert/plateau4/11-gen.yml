- id: 33692bd1-f0e8-4764-a443-51b5167cfe86
  name: entry_point
  nodes:
  - id: 7b1af940-900f-4195-b2cc-ae37bfcf62fe
    name: FeatureCreator
    type: action
    action: FeatureCreator
    with:
      creator: |
        [
          #{
            cityGmlPath: env.get("cityGmlPath"),
            cityCode: env.get("cityCode") ?? file::extract_filename(env.get("cityGmlPath"))[0..5],
            codelists: env.get("codelistsPath") ?? env.get("codelists"),
            schemas: env.get("schemasPath") ?? env.get("schemas"),
          },
        ]
  - id: a1bbd1f8-aa6e-44d7-b307-65b491def483
    name: FolderAndFilePathReader
    type: subGraph
    subGraphId: c6863b71-953b-4d15-af56-396fc93fc617
  - id: 6a3a3bba-14c5-438b-86bc-0bbb10d8b94d
    name: FeatureReaderByCityGml
    type: action
    action: FeatureCityGmlReader
    with:
      codelistsPath: env.get("__value").codelists
      flatten: true
      dataset: |
        env.get("__value")["path"]
  - id: 04b83179-6c76-446c-851d-ef0f91f62406
    name: TargetPackagesFilter
    type: action
    action: FeatureFilter
    with:
      conditions:
      - expr: |
          (env.get("targetPackages") ?? []).is_empty() || env.get("__value")["package"] in env.get("targetPackages")
        outputPort: default
  - id: 7bd12def-bc00-4340-adf5-1a2d68995dd7
    name: AttributeManagerPreFlattener
    type: action
    action: AttributeManager
    with:
      operations:
      - attribute: meshcode
        method: create
        value: |
          let file = file::extract_filename(env.get("__value")["path"]);
          file.split("_")[0]
      - attribute: gml_id
        method: create
        value: |
          env.get("__feature_id") ?? env.get("__value")["gmlId"]
      - attribute: feature_type
        method: create
        value: env.get("__value")["featureType"] ?? env.get("__value")["gmlName"]
      - attribute: codelists
        method: remove
      - attribute: schemas
        method: remove
  - id: f26fe812-ad3b-4cab-9ea3-397b521c6dfd
    name: AttributeFlattener
    type: action
    action: PLATEAU4.AttributeFlattener
  - id: 8f254c7d-fa35-416c-8093-dbaafd72d95a
    name: AttributeManagerDict
    type: action
    action: AttributeManager
    with:
      operations:
      - attribute: code
        method: create
        value: |
          env.get("__value")["gml:name_code"]
      - attribute: description
        method: create
        value: |
          env.get("__value")["gml:name"]
  - id: abc6a99c-5730-423c-a449-38911ab4a4e7
    name: AttributeDuplicateFilterDict
    type: action
    action: AttributeDuplicateFilter
    with:
      filterBy:
      - code
  - id: ea88ce7b-1525-419e-a869-d193d8318b71
    name: JsonWriterDict
    type: action
    action: JsonWriter
    with:
      output: |
        file::join_path(env.get("workerArtifactPath"), "dictionary.json")
      converter: |
        #{
          gen: env.get("__features").map(|f| #{
            code: f.code,
            description: f.description
          })
        }
  - id: 75faa932-e0a9-482c-a3f9-267817ed311c
    name: LodSplitter
    type: subGraph
    subGraphId: 7e98d856-1438-4148-bdcb-91747ef2e405
  - id: f63b1460-11eb-4000-a976-38f37a4e919b
    name: AttributeManager
    type: action
    action: AttributeManager
    with:
      operations:
      - attribute: cityCode
        method: rename
        value: city_code
      - attribute: cityName
        method: rename
        value: city_name
      - attribute: lod
        method: rename
        value: __lod
      - attribute: package
        method: rename
        value: __package
      - attribute: gml:name_code
        method: rename
        value: __gml_name_code
      - attribute: __z_group
        method: create
        value: |
          let v = env.get("__value");
          v["gml:name_code"] + "_lod" + v.lod
  - id: 0bc6c431-db8f-4823-ae2a-c389e171c454
    name: BoundsExtractor
    type: action
    action: BoundsExtractor
    with:
      xmin: __xmin
      ymin: __ymin
      xmax: __xmax
      ymax: __ymax
      zmin: __zmin
      zmax: __zmax
  - id: bef5a8e2-4f72-459e-9366-43d6cb2258bc
    name: StatisticsCalculatorZRange
    type: action
    action: StatisticsCalculator
    with:
      groupBy:
      - __z_group
      calculations:
      - newAttribute: __zmin_group
        method: min
        expr: env.get("__value").__zmin
      - newAttribute: __zmax_group
        method: max
        expr: env.get("__value").__zmax
  - id: d057ed59-e956-405a-8f67-6a94e60c42f5
    name: FeatureMergerZRange
    type: action
    action: FeatureMerger
    with:
      requestorAttribute:
      - __z_group
      supplierAttribute:
      - __z_group
  - id: 941b5d49-f92b-4a42-a4fe-6e24c4e78398
    name: FlatGroupFilter
    type: action
    action: FeatureFilter
    with:
      conditions:
      - expr: |
          let v = env.get("__value");
          type_of(v.__zmin_group) == "()" || type_of(v.__zmax_group) == "()" || v.__zmax_group.to_float() - v.__zmin_group.to_float() < 1e-8
        outputPort: flat
  - id: 2469c61e-dbda-488e-af80-e3b4105197b7
    name: TwoDimensionForcer
    type: action
    action: TwoDimensionForcer
  - id: 6d0c2b4e-5f8a-4c71-9e3d-2a7b1f04c9e8
    name: FeatureSorter
    type: action
    action: FeatureSorter
    with:
      attributes:
      - __gml_name_code
      - __lod
      order: ascending
  - id: 9bfcb0a4-0f66-494a-aa93-d26831f6221f
    name: MVTWriter
    type: action
    action: MVTWriter
    with:
      layerName: |
        let gml_name_code = env.get("__value").__gml_name_code;
        "gen_" + gml_name_code
      minZoom: 8
      maxZoom: 16
      extent: 4096
      extentAtMaxZoom: 65536
      keepAllAtMaxZoom: true
      output: |
        let gml_name_code = env.get("__value").__gml_name_code;
        file::join_path(env.get("workerArtifactPath"), "gen_" + gml_name_code + "_lod" + env.get("__value").__lod)
      compressOutput: |
        let artifact = env.get("workerArtifactPath");
        let city_gml = file::extract_filename_without_ext(env.get("cityGmlPath"));
        let lod = env.get("__value").__lod;
        let gml_name_code = env.get("__value").__gml_name_code;
        let suffix = "_gen";
        if city_gml.ends_with(suffix) {
          city_gml = city_gml.sub_string(0, city_gml.len() - suffix.len());
        }
        file::join_path(artifact, city_gml + "_gen_" + gml_name_code + "_mvt_lod" + lod + ".zip")
      skipUnexposedAttributes: true
      colonToUnderscore: true
  - id: 279d9bf0-6a00-448b-a9c4-4611e83366b3
    name: MVTWriterFullAttributes
    type: action
    action: MVTWriter
    with:
      layerName: |
        let gml_name_code = env.get("__value").__gml_name_code;
        "gen_" + gml_name_code
      minZoom: 8
      maxZoom: 16
      extent: 4096
      extentAtMaxZoom: 65536
      keepAllAtMaxZoom: true
      output: |
        let gml_name_code = env.get("__value").__gml_name_code;
        file::join_path(env.get("workerArtifactPath"), "gen_" + gml_name_code + "_lod" + env.get("__value").__lod + "_full_attributes")
      compressOutput: |
        let artifact = env.get("workerArtifactPath");
        let city_gml = file::extract_filename_without_ext(env.get("cityGmlPath"));
        let lod = env.get("__value").__lod;
        let gml_name_code = env.get("__value").__gml_name_code;
        let suffix = "_gen";
        if city_gml.ends_with(suffix) {
          city_gml = city_gml.sub_string(0, city_gml.len() - suffix.len());
        }
        file::join_path(artifact, city_gml + "_gen_" + gml_name_code + "_mvt_lod" + lod + "_full_attributes.zip")
      skipUnexposedAttributes: true
      colonToUnderscore: true
  - id: 9b751be1-8355-4bcd-8b71-22c6e8d5a817
    name: VerticalReprojector
    type: action
    action: VerticalReprojector
    with:
      reprojectorType: jgd2024ToWgs84
  - id: 12e642f3-d42a-4bd5-b298-4f33ac1c281c
    name: FeatureSorter3D
    type: action
    action: FeatureSorter
    with:
      attributes:
      - __gml_name_code
      - __lod
      order: ascending
  - id: a3870479-0ad9-4497-99bd-42438ccc0ffa
    name: Cesium3DTilesWriter
    type: action
    action: Cesium3DTilesWriter
    with:
      dracoCompression:
        enabled:
          quantizationError: 0.01
      wrapTolerance: 0.1
      skipUnexposedAttributes: true
      output: |
        let gml_name_code = env.get("__value").__gml_name_code;
        file::join_path(env.get("workerArtifactPath"), "gen_" + gml_name_code + "_lod" + env.get("__value").__lod + "_3dtiles")
      compressOutput: |
        let artifact = env.get("workerArtifactPath");
        let city_gml = file::extract_filename_without_ext(env.get("cityGmlPath"));
        let lod = env.get("__value").__lod;
        let gml_name_code = env.get("__value").__gml_name_code;
        let suffix = "_gen";
        if city_gml.ends_with(suffix) {
          city_gml = city_gml.sub_string(0, city_gml.len() - suffix.len());
        }
        file::join_path(artifact, city_gml + "_gen_" + gml_name_code + "_3dtiles_lod" + lod + ".zip")
  - id: a3618a0f-7ec9-4e7c-b67b-7ca7959c598c
    name: Cesium3DTilesWriterFullAttributes
    type: action
    action: Cesium3DTilesWriter
    with:
