# yaml-language-server: $schema=https://raw.githubusercontent.com/reearth/reearth-flow/main/engine/schema/workflow.json
id: 83307700-04b9-490c-b6a1-11b93e7f7a8a
name: "PLATEAU4-DataConvert-01-bldg-workflow"
entryGraphId: 34bf873b-3364-46b0-8153-efeb9568bb3c
with:
  cityGmlPath:
  codelistsPath:
  schemasPath:
  codelists:
  schemas:
  targetPackages:
    - bldg
  workerArtifactPath:
  inputVerticalDatum: jgd2011
graphs:
  - !include ../../../../graphs/plateau4/folder_and_file_path_reader.yml
  - id: 34bf873b-3364-46b0-8153-efeb9568bb3c
    name: entry_point
    nodes:
      - id: 90f40a3e-61d3-48e2-a328-e7226c2ad1ae
        name: FeatureCreator
        type: action
        action: FeatureCreator
        with:
          creator: |
            [
              #{
                cityGmlPath: env.get("cityGmlPath"),
                cityCode: env.get("cityCode") ?? file::extract_filename(env.get("cityGmlPath"))[0..5],
                baseCityCode: env.get("cityCode") ?? file::extract_filename(env.get("cityGmlPath"))[0..5],
                codelists: env.get("codelistsPath") ?? env.get("codelists"),
                schemas: env.get("schemasPath") ?? env.get("schemas"),
              },
            ]

      - id: d376f32b-7ce8-4721-8b9e-bfa39d71b860
        name: FolderAndFilePathReader
        type: subGraph
        subGraphId: c6863b71-953b-4d15-af56-396fc93fc617

      - id: ded2e272-e05c-4918-86b3-aa9f763da6e6
        name: FeatureReaderByCityGml
        type: action
        action: FeatureCityGmlReader
        with:
          codelistsPath: env.get("__value").codelists
          dataset: |
            env.get("__value")["path"]

      - id: a9b8c7d6-e5f4-3a2b-1c0d-9e8f7a6b5c4d
        name: TargetPackagesFilter
        type: action
        action: FeatureFilter
        with:
          conditions:
            - expr: |
                (env.get("targetPackages") ?? []).is_empty() || env.get("__value")["package"] in env.get("targetPackages")
              outputPort: default

      - id: 33e32a91-5ade-4265-8665-b061f552839c
        name: AttributeManagerForCityCodeAndCityName
        type: action
        action: AttributeManager
        with:
          operations:
            - attribute: cityCode
              method: convert
              value: |
                let attributes = env.get("__value").cityGmlAttributes;
                let building_id_attributes = attributes["uro:BuildingIDAttribute"][0] ?? {};
                let gml_city_code = building_id_attributes["uro:city_code"];
                if gml_city_code != () && gml_city_code != "" {
                  gml_city_code
                } else {
                  let feature_city_code = env.get("__value").cityCode;
                  if feature_city_code != () && feature_city_code != "" {
                    feature_city_code
                  } else {
                    env.get("cityCode")
                  }
                }

            - attribute: cityName
              method: create
              value: |
                let attributes = env.get("__value").cityGmlAttributes;
                let building_id_attributes = attributes["uro:BuildingIDAttribute"][0] ?? {};
                building_id_attributes["uro:city"] ?? env.get("__value").cityName

      - id: ae9c558d-ce05-4b40-ae04-a4477d96db5a
        name: AttributeConversionTable
        type: action
        action: AttributeConversionTable
        with:
          format: csv
          inline: !include ../../../../config/admin_ward_list.csv.txt
          rules:
            - featureFroms: ["cityCode"]
              featureTo: "cityNameEn"
              conversionTableKeys: ["ward_code"]
              conversionTableTo: "ward_name_en"
            - featureFroms: ["cityCode"]
              featureTo: "__wardParentCode"
              conversionTableKeys: ["ward_code"]
              conversionTableTo: "city_code"

      - id: f1a2b3c4-d5e6-4f7a-8b9c-0d1e2f3a4b5c
        name: CityCodeBoundaryFilter
        type: action
        action: FeatureFilter
        with:
          conditions:
            - expr: |
                let code = env.get("__value").cityCode;
                let base = env.get("__value").baseCityCode;
                code == base || env.get("__value").__wardParentCode == base
              outputPort: default

      - id: 4ffbb8a3-371e-4938-aa73-c142f11bb04b
        name: FeatureSorter
        type: action
        action: FeatureSorter
        with:
          attributes:
            - path
          order: ascending


      - id: 5daabfc0-2bda-4f8d-b206-d7a388469f7a
        name: AttributeFlattener
        type: action
        action: PLATEAU4.AttributeFlattener
        with:
          existingFlattenAttributes: true

      - id: 3e637368-48dc-48c2-aade-253d5b0cfeeb
        name: AttributeManagerRemoveUnnecessaryAttributes
        type: action
        action: AttributeManager
        with:
          operations:
            - attribute: meshcode
              method: create
              value: |
                file::extract_filename_without_ext(env.get("__value")["path"]).split("_")[0]
            - attribute: _lod_type
              method: create
              value: |
                env.get("__lod_type")
            - attribute: feature_type
              method: create
              value: |
                env.get("__feature_type")
            - attribute: path
              method: rename
              value: "_path"
            - attribute: cityCode
              method: rename
              value: "city_code"
            - attribute: cityName
              method: rename
              value: "city_name"
            - attribute: gmlId
              method: rename
              value: "gml_id"
            - attribute: package
              method: remove
            - attribute: fileIndex
              method: remove
            - attribute: extension
              method: remove
            - attribute: root
              method: remove
            - attribute: gmlRootId
              method: remove
            - attribute: udxDirs
              method: remove
            - attribute: cityGmlPath
              method: remove
            - attribute: schemas
              method: remove
            - attribute: dirCodelists
              method: remove
            - attribute: dirSchemas
              method: remove
            - attribute: gmlName
              method: remove
            - attribute: codelists
              method: remove
            - attribute: maxLod
              method: remove
            - attribute: dirRoot
              method: remove

