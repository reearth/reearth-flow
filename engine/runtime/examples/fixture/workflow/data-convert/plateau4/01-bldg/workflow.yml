      - id: 41d69f1f-2a4d-4bc1-a5d0-175698273571
        name: cesium3DTilesWriterByLod1
        type: action
        action: Cesium3DTilesWriter
        with:
          minZoom: 15
          maxZoom: 18
          attachTexture: false
          output: |
            let city_code = env.get("__value").city_code;
            let artifact = env.get("workerArtifactPath");

            if env.get("__value").baseCityCode == city_code {
              file::join_path(artifact, "bldg_lod1")
            } else {
              file::join_path(artifact, "bldg_lod1_" + city_code)
            }
          compressOutput: |
            let city_code = env.get("__value").city_code;
            let artifact = env.get("workerArtifactPath");
            let city_gml = file::extract_filename_without_ext(env.get("cityGmlPath"));
            if city_gml.ends_with("_bldg") {
              city_gml = city_gml.sub_string(0, city_gml.len() - 5);
            }

            if env.get("__value").baseCityCode == city_code {
              file::join_path(artifact, city_gml + "_bldg_3dtiles_lod1.zip")
            } else {
              file::join_path(artifact, city_gml + "_bldg_3dtiles_" + city_code + "_" + env.get("__value").cityNameEn + "_lod1.zip")
            }

