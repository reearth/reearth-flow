# yaml-language-server: $schema=https://raw.githubusercontent.com/reearth/reearth-flow/main/engine/schema/workflow.json
id: 3f6d9c2a-1b7e-4a05-9c31-2d8e6f4a7b10
name: "PLATEAU6-DataConvert-01-bldg-workflow"
entryGraphId: 8f3a94c6-bb3e-4561-a405-09b65353986c
with:
  cityGmlPath:
graphs:
  - id: 8f3a94c6-bb3e-4561-a405-09b65353986c
    name: entry_point
    nodes:
      - id: d733672a-56d5-4a85-ac1d-a61e1ba174f5
        name: FeatureCreator
        type: action
        action: Feature Creator
        with:
          creator:
            type: flowExpr
            value: |
              [
                {
                  "city_gml_path": variables["cityGmlPath"],
                },
              ]

      - id: 6cc457fd-3d92-4e24-92b4-bcd5f4e0bbe0
        name: FilePathExtractor
        type: action
        action: Feature File Path Extractor
        with:
          sourceDataset:
            type: flowExpr
            value: attributes["city_gml_path"]
          extractArchive: true

      - id: 8269fcb7-645d-4cc2-bb7e-215357fc960d
        name: GmlFileFilter
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: attributes["extension"] == "gml"
              outputPort: features

      - id: 25d2c806-4c6f-47dc-bfe9-e99c2f951f0a
        name: FeatureReaderByCityGml
        type: action
        action: Feature CityGML 3 Reader
        with:
          dataset:
            type: flowExpr
            value: attributes["path"]

      - id: 3d0e8b1f-6a2c-4e0b-9f5d-7c1a8b4e2f60
        name: AttributeManager
        type: action
        action: Attribute Manager
        with:
          operations:
            - attribute: city_code
              method: create
              value:
                type: flowExpr
                value: |
                  ade_of_building = attributes.get("bldg:adeOfAbstractBuilding");
                  entries = [];
                  if type(ade_of_building) == list {
                    entries = ade_of_building;
                  } else if type(ade_of_building) == dict {
                    entries = [ade_of_building];
                  }
                  id_map = null;
                  for entry in entries {
                    if entry.get("uro:BuildingIDAttribute") {
                      id_map = entry.get("uro:BuildingIDAttribute");
                    }
                  }
                  gml_city_code = null;
                  if id_map {
                    gml_city_code = id_map.get("uro:city_code") or id_map.get("uro:city");
                  }
                  gml_city_code or variables.get("cityCode") or variables["cityGmlPath"].rsplit("/", 1)[-1][:5]

      - id: 9f2a7c4e-3b5d-4c8f-a1e0-6d9b2f5a8c31
        name: AttributeConversionTableForWardName
        type: action
        action: Attribute Conversion Table
        with:
          format: csv
          inline: !include ../../../../config/admin_ward_list.csv.txt
          rules:
            - featureFroms: ["city_code"]
              featureTo: "cityNameEn"
              conversionTableKeys: ["ward_code"]
              conversionTableTo: "ward_name_en"

      - id: 16247597-565a-40df-a8d4-7445468978fd
        name: GeometrySplitterByLod
        type: action
        action: Geometry Splitter
        with:
          groupBy: "lod"

      # Collapse to one row per (gmlId, lod) pair first: a building can have
      # multiple geometry members at the same LOD, and the lodMask sum below
      # is only valid (sum of distinct powers of two == OR) if each distinct
      # lod contributes exactly once.
      - id: 6b1f2a3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c
        name: LodDistinctAggregator
        type: action
        action: Attribute Aggregator
        with:
          method: count
          aggregateAttributes:
            - newAttribute: __citygml_gml_id
              attribute: __citygml_gml_id
            - newAttribute: lod
              attribute: lod
          calculationAttribute: _dupCount
          calculationValue: 1

      - id: d12d66b8-834d-4d8b-95cd-b978069add10
        name: LodMaskAggregator
        type: action
        action: Attribute Aggregator
        with:
          method: count
          aggregateAttributes:
            - newAttribute: __citygml_gml_id
              attribute: __citygml_gml_id
          calculationAttribute: lodMask
          calculation:
            type: flowExpr
            value: 1 << attributes["lod"]

      - id: 5af9f07c-ec06-48b5-84bd-2ee0eb700e9c
        name: LodMaskJoiner
        type: action
        action: Feature Joiner
        with:
          joinType: left
          requestorAttribute:
            - __citygml_gml_id
          supplierAttribute:
            - __citygml_gml_id
          conflictResolution: requestorWins

      # City-wide highest LOD actually present, keyed by city_code. Caps which
      # LOD branches emit at all: a branch only writes once some building in
      # the city truly reaches that LOD, mirroring PLATEAU4's FeatureLodFilter
      # (which groups by filterKey and only opens LOD-i once max_lod >= i),
      # instead of always falling back and duplicating lower-LOD content into
      # every higher-LOD tile set.
      - id: 7c2e9a4d-5f1b-4e3a-9d6c-8a0f2b4c6e81
        name: CityMaxLodAggregator
        type: action
        action: Attribute Aggregator
        with:
          method: max
          aggregateAttributes:
            - newAttribute: city_code
              attribute: city_code
          calculationAttribute: city_max_lod
          calculation:
            type: flowExpr
            value: attributes["lod"]

      - id: 9d1e5f3a-7b2c-4d8e-a1f6-3c5d7e9a0b12
        name: CityMaxLodJoiner
        type: action
        action: Feature Joiner
        with:
          joinType: left
          requestorAttribute:
            - city_code
          supplierAttribute:
            - city_code
          conflictResolution: requestorWins

      - id: 96cc26d1-57f8-49fa-aa47-f8d92ec78189
        name: AttributeManager
        type: action
        action: Attribute Manager
        with:
          operations:
            - attribute: gml_id
              method: create
              value:
                type: flowExpr
                value: attributes["__citygml_gml_id"]
            - attribute: _output_base
              method: create
              value:
                type: flowExpr
                value: |
                  city_gml = variables["cityGmlPath"].split("/")[-1].remove_suffix(".zip").remove_suffix("_bldg");
                  base_city_code = variables.get("cityCode") or variables["cityGmlPath"].rsplit("/", 1)[-1][:5];
                  suffix = "";
                  if attributes["city_code"] != base_city_code {
                    suffix = "_" + attributes["city_code"] + "_" + attributes["cityNameEn"];
                  }
                  city_gml + suffix
            - attribute: _lod
              method: create
              value:
                type: flowExpr
                value: attributes["lod"]

      # --- LOD1 branch ---
      - id: 04339391-dcfe-485a-9593-e12b0eddf864
        name: FeatureFilterLod1
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: attributes["lod"] == 1
              outputPort: features

      - id: 39f7c2d0-4f5a-4ce6-992d-17ae7b73eb50
        name: BoundsExtractorByLod1
        type: action
        action: Bounds Extractor
        with:
          xmin: _xmin
          ymin: _ymin
          xmax: _xmax
          ymax: _ymax
          zmin: _zmin
          zmax: _zmax

      - id: d22ce8c5-4e85-416c-9fe9-84396ecb7399
        name: AttributeManagerXYByLod1
        type: action
        action: Attribute Manager
        with:
          operations:
            - attribute: _x
              method: create
              value:
                type: flowExpr
                value: '(attributes["_xmin"] + attributes["_xmax"]) * 0.5'
            - attribute: _y
              method: create
              value:
                type: flowExpr
                value: '(attributes["_ymin"] + attributes["_ymax"]) * 0.5'

      - id: a4f07c6f-3972-4c4f-9e70-f93af486c78d
        name: Cesium3DTilesWriterLod1
        type: action
        action: Cesium 3D Tiles Writer
        with:
          schemaKey: __citygml_feature_type
          targetTileSize: 1048576
          attachTexture: false
          output:
            type: flowExpr
            value: attributes["_output_base"] + "_bldg_3dtiles_lod1.zip"

      # --- LOD2 branch ---
      - id: acf7b926-7c8b-4448-9a3d-af4a1d1aa2cd
        name: FeatureFilterLod2
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: |
                  mask = attributes["lodMask"];
                  best = 0;
                  i = 1;
                  while i <= 2 {
                    if (mask & (1 << i)) != 0 { best = i; }
                    i += 1;
                  }
                  attributes["city_max_lod"] >= 2 and attributes["lod"] == best
              outputPort: features

      - id: 81393f88-cdbc-44e3-b55d-49bc838dc127
        name: BoundsExtractorByLod2
        type: action
        action: Bounds Extractor
        with:
          xmin: _xmin
          ymin: _ymin
          xmax: _xmax
          ymax: _ymax
          zmin: _zmin
          zmax: _zmax

      - id: e78b5d2f-a9d5-4991-aa7c-ba67dc64cadc
        name: AttributeManagerXYByLod2
        type: action
        action: Attribute Manager
        with:
          operations:
            - attribute: _x
              method: create
              value:
                type: flowExpr
                value: '(attributes["_xmin"] + attributes["_xmax"]) * 0.5'
            - attribute: _y
              method: create
              value:
                type: flowExpr
                value: '(attributes["_ymin"] + attributes["_ymax"]) * 0.5'

      - id: e44e7208-c0a6-4bca-829c-5d2769dd49f3
        name: Cesium3DTilesWriterLod2
        type: action
        action: Cesium 3D Tiles Writer
        with:
          schemaKey: __citygml_feature_type
          targetTileSize: 1048576
          attachTexture: true
          output:
            type: flowExpr
            value: attributes["_output_base"] + "_bldg_3dtiles_lod2.zip"

      - id: 0beef7bf-acac-4661-b325-fb8adea8739a
        name: Cesium3DTilesWriterLod2NoTexture
        type: action
        action: Cesium 3D Tiles Writer
        with:
          schemaKey: __citygml_feature_type
          targetTileSize: 1048576
          textureCodec: Untextured
          output:
            type: flowExpr
            value: attributes["_output_base"] + "_bldg_3dtiles_lod2_no_texture.zip"

      # --- LOD3 branch ---
      - id: acd88b8a-708a-4adf-ad6e-b471d934191d
        name: FeatureFilterLod3
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: |
                  mask = attributes["lodMask"];
                  best = 0;
                  i = 1;
                  while i <= 3 {
                    if (mask & (1 << i)) != 0 { best = i; }
                    i += 1;
                  }
                  attributes["city_max_lod"] >= 3 and attributes["lod"] == best
              outputPort: features

      - id: db01f1d9-e4b0-4ac1-ba89-ddd7a3103570
        name: BoundsExtractorByLod3
        type: action
        action: Bounds Extractor
        with:
          xmin: _xmin
          ymin: _ymin
          xmax: _xmax
          ymax: _ymax
          zmin: _zmin
          zmax: _zmax

      - id: cd167799-4d08-4256-8203-584c66f49d9b
        name: AttributeManagerXYByLod3
        type: action
        action: Attribute Manager
        with:
          operations:
            - attribute: _x
              method: create
              value:
                type: flowExpr
                value: '(attributes["_xmin"] + attributes["_xmax"]) * 0.5'
            - attribute: _y
              method: create
              value:
                type: flowExpr
                value: '(attributes["_ymin"] + attributes["_ymax"]) * 0.5'

      - id: a7b575b0-8a0b-44d6-a80e-1fef936058df
        name: Cesium3DTilesWriterLod3
        type: action
        action: Cesium 3D Tiles Writer
        with:
          schemaKey: __citygml_feature_type
          targetTileSize: 1048576
          attachTexture: true
          output:
            type: flowExpr
            value: attributes["_output_base"] + "_bldg_3dtiles_lod3.zip"

      - id: cfca323d-02e2-49a2-a327-d928746657a1
        name: Cesium3DTilesWriterLod3NoTexture
        type: action
        action: Cesium 3D Tiles Writer
        with:
          schemaKey: __citygml_feature_type
          targetTileSize: 1048576
          textureCodec: Untextured
          output:
            type: flowExpr
            value: attributes["_output_base"] + "_bldg_3dtiles_lod3_no_texture.zip"

    edges:
