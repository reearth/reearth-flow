# yaml-language-server: $schema=https://raw.githubusercontent.com/reearth/reearth-flow/main/engine/schema/workflow.json
id: 3f6d9c2a-1b7e-4a05-9c31-2d8e6f4a7b10
name: "PLATEAU6-DataConvert-01-bldg-workflow"
entryGraphId: 8f3a94c6-bb3e-4561-a405-09b65353986c
with:
  cityGmlPath:
graphs:
  - id: 8f3a94c6-bb3e-4561-a405-09b65353986c
    name: entry_point
    nodes:
      - id: d733672a-56d5-4a85-ac1d-a61e1ba174f5
        name: FeatureCreator
        type: action
        action: Feature Creator
        with:
          creator:
            type: flowExpr
            value: |
              [
                {
                  "city_gml_path": env["cityGmlPath"],
                },
              ]

      - id: 6cc457fd-3d92-4e24-92b4-bcd5f4e0bbe0
        name: FilePathExtractor
        type: action
        action: Feature File Path Extractor
        with:
          sourceDataset:
            type: flowExpr
            value: attributes["city_gml_path"]
          extractArchive: true

      - id: 8269fcb7-645d-4cc2-bb7e-215357fc960d
        name: GmlFileFilter
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: attributes["extension"] == "gml"
              outputPort: features

      - id: 25d2c806-4c6f-47dc-bfe9-e99c2f951f0a
        name: FeatureReaderByCityGml
        type: action
        action: Feature CityGML 3 Reader
        with:
          dataset:
            type: flowExpr
            value: attributes["path"]

      - id: 3d0e8b1f-6a2c-4e0b-9f5d-7c1a8b4e2f60
        name: AttributeManagerForCityCode
        type: action
        action: Attribute Manager
        with:
          operations:
            - attribute: city_code
              method: create
              value:
                type: flowExpr
                value: |
                  id_wrapper = attributes.get("uro:buildingIDAttribute");
                  id_map = null;
                  if type(id_wrapper) == list {
                    id_map = id_wrapper[0].get("uro:BuildingIDAttribute");
                  } else if type(id_wrapper) == dict {
                    id_map = id_wrapper.get("uro:BuildingIDAttribute");
                  }
                  gml_city_code = null;
                  if id_map {
                    gml_city_code = id_map.get("uro:city_code") or id_map.get("uro:city");
                  }
                  gml_city_code or env.get("cityCode") or env["cityGmlPath"].rsplit("/", 1)[-1][:5]

      - id: 9f2a7c4e-3b5d-4c8f-a1e0-6d9b2f5a8c31
        name: AttributeConversionTableForWardName
        type: action
        action: Attribute Conversion Table
        with:
          format: csv
          inline: !include ../../../../config/admin_ward_list.csv.txt
          rules:
            - featureFroms: ["city_code"]
              featureTo: "cityNameEn"
              conversionTableKeys: ["ward_code"]
              conversionTableTo: "ward_name_en"

      - id: 16247597-565a-40df-a8d4-7445468978fd
        name: GeometrySplitterByLod
        type: action
        action: Geometry Splitter

      # Collapse to one row per (gmlId, lod) pair first: a building can have
      # multiple geometry members at the same LOD, and the lodMask sum below
      # is only valid (sum of distinct powers of two == OR) if each distinct
      # lod contributes exactly once.
      - id: 6b1f2a3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c
        name: LodDistinctAggregator
        type: action
        action: Attribute Aggregator
        with:
          method: count
          aggregateAttributes:
            - newAttribute: __citygml_gml_id
              attribute: __citygml_gml_id
            - newAttribute: lod
              attribute: lod
          calculationAttribute: _dupCount
          calculationValue: 1

      - id: d12d66b8-834d-4d8b-95cd-b978069add10
        name: LodMaskAggregator
        type: action
        action: Attribute Aggregator
        with:
          method: count
          aggregateAttributes:
            - newAttribute: __citygml_gml_id
              attribute: __citygml_gml_id
          calculationAttribute: lodMask
          calculation:
            type: flowExpr
            value: 1 << attributes["lod"]

      - id: 5af9f07c-ec06-48b5-84bd-2ee0eb700e9c
        name: LodMaskJoiner
        type: action
        action: Feature Joiner
        with:
          joinType: left
          requestorAttribute:
            - __citygml_gml_id
          supplierAttribute:
            - __citygml_gml_id
          conflictResolution: requestorWins

      # City-wide highest LOD actually present, keyed by city_code. Caps which
      # LOD branches emit at all: a branch only writes once some building in
      # the city truly reaches that LOD, mirroring PLATEAU4's FeatureLodFilter
      # (which groups by filterKey and only opens LOD-i once max_lod >= i),
      # instead of always falling back and duplicating lower-LOD content into
      # every higher-LOD tile set.
      - id: 7c2e9a4d-5f1b-4e3a-9d6c-8a0f2b4c6e81
        name: CityMaxLodAggregator
        type: action
        action: Attribute Aggregator
        with:
          method: max
          aggregateAttributes:
            - newAttribute: city_code
              attribute: city_code
          calculationAttribute: city_max_lod
          calculation:
            type: flowExpr
            value: attributes["lod"]

      - id: 9d1e5f3a-7b2c-4d8e-a1f6-3c5d7e9a0b12
        name: CityMaxLodJoiner
        type: action
        action: Feature Joiner
        with:
          joinType: left
          requestorAttribute:
            - city_code
          supplierAttribute:
            - city_code
          conflictResolution: requestorWins

      # --- LOD1 branch ---
      - id: 04339391-dcfe-485a-9593-e12b0eddf864
        name: FeatureFilterLod1
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: attributes["lod"] == 1
              outputPort: features

      - id: a4f07c6f-3972-4c4f-9e70-f93af486c78d
        name: Cesium3DTilesWriterLod1
        type: action
        action: Cesium 3D Tiles Writer
        with:
          schemaKey: __citygml_feature_type
          minZoom: 15
          maxZoom: 18
          attachTexture: false
          output:
            type: flowExpr
            value: |
              city_gml = env["cityGmlPath"].split("/")[-1].remove_suffix(".zip").remove_suffix("_bldg");
              base_city_code = env.get("cityCode") or env["cityGmlPath"].rsplit("/", 1)[-1][:5];
              city_code = attributes["city_code"];
              suffix = "";
              if city_code != base_city_code {
                suffix = "_" + city_code + "_" + attributes["cityNameEn"];
              }
              city_gml + suffix + "_bldg_3dtiles_lod1.zip"

      # --- LOD2 branch ---
      - id: acf7b926-7c8b-4448-9a3d-af4a1d1aa2cd
        name: FeatureFilterLod2
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: |
                  mask = attributes["lodMask"];
                  best = 0;
                  i = 1;
                  while i <= 2 {
                    if (mask & (1 << i)) != 0 { best = i; }
                    i += 1;
                  }
                  attributes["city_max_lod"] >= 2 and attributes["lod"] == best
              outputPort: features

      - id: e44e7208-c0a6-4bca-829c-5d2769dd49f3
        name: Cesium3DTilesWriterLod2
        type: action
        action: Cesium 3D Tiles Writer
        with:
          schemaKey: __citygml_feature_type
          minZoom: 15
          maxZoom: 18
          attachTexture: true
          output:
            type: flowExpr
            value: |
              city_gml = env["cityGmlPath"].split("/")[-1].remove_suffix(".zip").remove_suffix("_bldg");
              base_city_code = env.get("cityCode") or env["cityGmlPath"].rsplit("/", 1)[-1][:5];
              city_code = attributes["city_code"];
              suffix = "";
              if city_code != base_city_code {
                suffix = "_" + city_code + "_" + attributes["cityNameEn"];
              }
              city_gml + suffix + "_bldg_3dtiles_lod2.zip"

      # --- LOD3 branch ---
      - id: acd88b8a-708a-4adf-ad6e-b471d934191d
        name: FeatureFilterLod3
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: |
                  mask = attributes["lodMask"];
                  best = 0;
                  i = 1;
                  while i <= 3 {
                    if (mask & (1 << i)) != 0 { best = i; }
                    i += 1;
                  }
                  attributes["city_max_lod"] >= 3 and attributes["lod"] == best
              outputPort: features

      - id: a7b575b0-8a0b-44d6-a80e-1fef936058df
        name: Cesium3DTilesWriterLod3
        type: action
        action: Cesium 3D Tiles Writer
        with:
          schemaKey: __citygml_feature_type
          minZoom: 15
          maxZoom: 18
          attachTexture: true
          output:
            type: flowExpr
            value: |
              city_gml = env["cityGmlPath"].split("/")[-1].remove_suffix(".zip").remove_suffix("_bldg");
              base_city_code = env.get("cityCode") or env["cityGmlPath"].rsplit("/", 1)[-1][:5];
              city_code = attributes["city_code"];
              suffix = "";
              if city_code != base_city_code {
                suffix = "_" + city_code + "_" + attributes["cityNameEn"];
              }
              city_gml + suffix + "_bldg_3dtiles_lod3.zip"

    edges:
      - id: b312699e-9e9f-48e9-9624-512c788bdbe1
        from: d733672a-56d5-4a85-ac1d-a61e1ba174f5
        to: 6cc457fd-3d92-4e24-92b4-bcd5f4e0bbe0
        fromPort: features
        toPort: features
      - id: 4cb2b94f-ad10-496a-b870-4cf1470be53f
        from: 6cc457fd-3d92-4e24-92b4-bcd5f4e0bbe0
        to: 8269fcb7-645d-4cc2-bb7e-215357fc960d
        fromPort: features
        toPort: features
      - id: 499a3897-53db-4825-be5b-73414dbadfcf
        from: 8269fcb7-645d-4cc2-bb7e-215357fc960d
        to: 25d2c806-4c6f-47dc-bfe9-e99c2f951f0a
        fromPort: features
        toPort: features
      - id: a2631c5e-f7e9-40c1-bec2-ddddee56257c
        from: 25d2c806-4c6f-47dc-bfe9-e99c2f951f0a
        to: 3d0e8b1f-6a2c-4e0b-9f5d-7c1a8b4e2f60
        fromPort: features
        toPort: features
      - id: 8b3e5c1a-2f4d-4a6b-9c8e-1d0f3a5b7c9e
        from: 3d0e8b1f-6a2c-4e0b-9f5d-7c1a8b4e2f60
        to: 9f2a7c4e-3b5d-4c8f-a1e0-6d9b2f5a8c31
        fromPort: features
        toPort: features
      - id: 5c7d9e1f-4a6b-4c8d-9e0f-2a3b5c7d9e1a
        from: 9f2a7c4e-3b5d-4c8f-a1e0-6d9b2f5a8c31
        to: 16247597-565a-40df-a8d4-7445468978fd
        fromPort: features
        toPort: features
      # split -> per-gmlId LOD mask (for cascade fallback) -> joined back onto each split feature
      - id: 83373a03-9e03-4f12-b5c2-b72200d249bf
        from: 16247597-565a-40df-a8d4-7445468978fd
        to: 6b1f2a3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c
        fromPort: features
        toPort: features
      - id: 2b4c6d8e-0a1b-4c2d-8e3f-4a5b6c7d8e9f
        from: 6b1f2a3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c
        to: d12d66b8-834d-4d8b-95cd-b978069add10
        fromPort: features
        toPort: features
      - id: c9b71d8c-8e82-4a9a-81ea-8aa3dc9bd776
        from: 16247597-565a-40df-a8d4-7445468978fd
        to: 5af9f07c-ec06-48b5-84bd-2ee0eb700e9c
        fromPort: features
        toPort: requestor
      - id: 1cf95ad1-9f49-47d8-88f6-411eb6655c8b
        from: d12d66b8-834d-4d8b-95cd-b978069add10
        to: 5af9f07c-ec06-48b5-84bd-2ee0eb700e9c
        fromPort: features
        toPort: supplier
      # split -> per-city_code max LOD -> joined back onto each split feature
      - id: 4e6a8c0d-2b3f-4e5a-8c1d-6f9b0a2c4e83
        from: 16247597-565a-40df-a8d4-7445468978fd
        to: 7c2e9a4d-5f1b-4e3a-9d6c-8a0f2b4c6e81
        fromPort: features
        toPort: features
      - id: 1a3c5e7f-9b0d-4a2c-8e4f-6a8c0e2b4d95
        from: 5af9f07c-ec06-48b5-84bd-2ee0eb700e9c
        to: 9d1e5f3a-7b2c-4d8e-a1f6-3c5d7e9a0b12
        fromPort: joined
        toPort: requestor
      - id: 2b4d6f80-0c1e-4b3d-9f5a-7b9d1f3c5e06
        from: 7c2e9a4d-5f1b-4e3a-9d6c-8a0f2b4c6e81
        to: 9d1e5f3a-7b2c-4d8e-a1f6-3c5d7e9a0b12
        fromPort: features
        toPort: supplier
      # joined (lod + lodMask + cityMaxLod) -> per-lod filters
      - id: 71f0a555-6c6d-4201-9e03-a2c8278bd5bf
        from: 9d1e5f3a-7b2c-4d8e-a1f6-3c5d7e9a0b12
        to: 04339391-dcfe-485a-9593-e12b0eddf864
        fromPort: joined
        toPort: features
      - id: 6d8c644d-3f72-4634-b2f5-0b62a7d9b813
        from: 9d1e5f3a-7b2c-4d8e-a1f6-3c5d7e9a0b12
        to: acf7b926-7c8b-4448-9a3d-af4a1d1aa2cd
        fromPort: joined
        toPort: features
      - id: 9ae53fa9-ed12-46ce-b628-494d610d93f3
        from: 9d1e5f3a-7b2c-4d8e-a1f6-3c5d7e9a0b12
