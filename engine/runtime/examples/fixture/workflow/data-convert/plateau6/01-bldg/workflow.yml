# yaml-language-server: $schema=https://raw.githubusercontent.com/reearth/reearth-flow/main/engine/schema/workflow.json
#
# PLATEAU6 data-convert 01-bldg (new-geometry).
#
# First-cut migration. Goal: a running pipeline that renders buildings, not a
# faithful port. Deliberate departures from the PLATEAU4 workflow:
#   - No subgraphs. File discovery is inlined: Feature File Path Extractor
#     unpacks the citymodel archive (`extractArchive`) and emits one feature per
#     file; a Feature Filter keeps the .gml files; the reader opens each `path`.
#   - Feature CityGML 2 Reader (new-geometry native), not Feature CityGML Reader.
#     Codelists resolve against the gml's own source_url, so no codelists param.
#   - LOD handling is Geometry Splitter + per-LOD Feature Filter on the hoisted
#     `lod` member attribute, not Feature LOD Filter (unimplemented under the
#     new-geometry feature). Per-building cascade fallback is replicated via
#     Attribute Aggregator + Feature Joiner (__citygml_gml_id -> lodMask). No
#     cross-city max yet.
#   - No PLATEAU4.AttributeFlattener, no UDX/CityCode chain, fixed output names.
id: 3f6d9c2a-1b7e-4a05-9c31-2d8e6f4a7b10
name: "PLATEAU6-DataConvert-01-bldg-workflow"
entryGraphId: 8f3a94c6-bb3e-4561-a405-09b65353986c
with:
  cityGmlPath:
graphs:
  - id: 8f3a94c6-bb3e-4561-a405-09b65353986c
    name: entry_point
    nodes:
      - id: d733672a-56d5-4a85-ac1d-a61e1ba174f5
        name: FeatureCreator
        type: action
        action: Feature Creator
        with:
          creator:
            type: flowExpr
            value: |
              [
                {
                  "cityGmlPath": env["cityGmlPath"],
                },
              ]

      - id: 6cc457fd-3d92-4e24-92b4-bcd5f4e0bbe0
        name: FilePathExtractor
        type: action
        action: Feature File Path Extractor
        with:
          sourceDataset:
            type: flowExpr
            value: attributes["cityGmlPath"]
          extractArchive: true

      - id: 8269fcb7-645d-4cc2-bb7e-215357fc960d
        name: GmlFileFilter
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: attributes["extension"] == "gml"
              outputPort: features

      - id: 25d2c806-4c6f-47dc-bfe9-e99c2f951f0a
        name: FeatureReaderByCityGml
        type: action
        action: Feature CityGML 3 Reader
        with:
          dataset:
            type: flowExpr
            value: attributes["path"]

      - id: 16247597-565a-40df-a8d4-7445468978fd
        name: GeometrySplitterByLod
        type: action
        action: Geometry Splitter

      # Collapse to one row per (gmlId, lod) pair first: a building can have
      # multiple geometry members at the same LOD, and the lodMask sum below
      # is only valid (sum of distinct powers of two == OR) if each distinct
      # lod contributes exactly once.
      - id: 6b1f2a3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c
        name: LodDistinctAggregator
        type: action
        action: Attribute Aggregator
        with:
          method: count
          aggregateAttributes:
            - newAttribute: __citygml_gml_id
              attribute: __citygml_gml_id
            - newAttribute: lod
              attribute: lod
          calculationAttribute: _dupCount
          calculationValue: 1

      - id: d12d66b8-834d-4d8b-95cd-b978069add10
        name: LodMaskAggregator
        type: action
        action: Attribute Aggregator
        with:
          method: count
          aggregateAttributes:
            - newAttribute: __citygml_gml_id
              attribute: __citygml_gml_id
          calculationAttribute: lodMask
          calculation:
            type: flowExpr
            value: 1 << attributes["lod"]

      - id: 5af9f07c-ec06-48b5-84bd-2ee0eb700e9c
        name: LodMaskJoiner
        type: action
        action: Feature Joiner
        with:
          joinType: left
          requestorAttribute:
            - __citygml_gml_id
          supplierAttribute:
            - __citygml_gml_id
          conflictResolution: requestorWins

      # --- LOD1 branch ---
      - id: 04339391-dcfe-485a-9593-e12b0eddf864
        name: FeatureFilterLod1
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: attributes["lod"] == 1
              outputPort: features

      - id: a4f07c6f-3972-4c4f-9e70-f93af486c78d
        name: Cesium3DTilesWriterLod1
        type: action
        action: Cesium 3D Tiles Writer
        with:
          schemaKey: __citygml_feature_type
          minZoom: 15
          maxZoom: 18
          attachTexture: false
          output:
            type: flowExpr
            value: '"bldg_lod1"'
          compressOutput:
            type: flowExpr
            value: |
              city_gml = env["cityGmlPath"].split("/")[-1].remove_suffix(".zip").remove_suffix("_bldg");
              city_gml + "_bldg_3dtiles_lod1.zip"

      # --- LOD2 branch ---
      - id: acf7b926-7c8b-4448-9a3d-af4a1d1aa2cd
        name: FeatureFilterLod2
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: |
                  mask = attributes["lodMask"];
                  best = 0;
                  i = 1;
                  while i <= 2 {
                    if (mask & (1 << i)) != 0 { best = i; }
                    i += 1;
                  }
                  attributes["lod"] == best
              outputPort: features

      - id: e44e7208-c0a6-4bca-829c-5d2769dd49f3
        name: Cesium3DTilesWriterLod2
        type: action
        action: Cesium 3D Tiles Writer
        with:
          schemaKey: __citygml_feature_type
          minZoom: 15
          maxZoom: 18
          attachTexture: true
          output:
            type: flowExpr
            value: '"bldg_lod2"'
          compressOutput:
            type: flowExpr
            value: |
              city_gml = env["cityGmlPath"].split("/")[-1].remove_suffix(".zip").remove_suffix("_bldg");
              city_gml + "_bldg_3dtiles_lod2.zip"

      # --- LOD3 branch ---
      - id: acd88b8a-708a-4adf-ad6e-b471d934191d
        name: FeatureFilterLod3
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: |
                  mask = attributes["lodMask"];
                  best = 0;
                  i = 1;
                  while i <= 3 {
                    if (mask & (1 << i)) != 0 { best = i; }
                    i += 1;
                  }
                  attributes["lod"] == best
              outputPort: features

      - id: a7b575b0-8a0b-44d6-a80e-1fef936058df
        name: Cesium3DTilesWriterLod3
        type: action
        action: Cesium 3D Tiles Writer
        with:
          schemaKey: __citygml_feature_type
          minZoom: 15
          maxZoom: 18
          attachTexture: true
          output:
            type: flowExpr
            value: '"bldg_lod3"'
          compressOutput:
            type: flowExpr
            value: |
              city_gml = env["cityGmlPath"].split("/")[-1].remove_suffix(".zip").remove_suffix("_bldg");
              city_gml + "_bldg_3dtiles_lod3.zip"

    edges:
      - id: b312699e-9e9f-48e9-9624-512c788bdbe1
        from: d733672a-56d5-4a85-ac1d-a61e1ba174f5
        to: 6cc457fd-3d92-4e24-92b4-bcd5f4e0bbe0
        fromPort: features
        toPort: features
      - id: 4cb2b94f-ad10-496a-b870-4cf1470be53f
        from: 6cc457fd-3d92-4e24-92b4-bcd5f4e0bbe0
        to: 8269fcb7-645d-4cc2-bb7e-215357fc960d
        fromPort: features
        toPort: features
      - id: 499a3897-53db-4825-be5b-73414dbadfcf
        from: 8269fcb7-645d-4cc2-bb7e-215357fc960d
        to: 25d2c806-4c6f-47dc-bfe9-e99c2f951f0a
        fromPort: features
        toPort: features
      - id: a2631c5e-f7e9-40c1-bec2-ddddee56257c
        from: 25d2c806-4c6f-47dc-bfe9-e99c2f951f0a
        to: 16247597-565a-40df-a8d4-7445468978fd
        fromPort: features
        toPort: features
      # split -> per-gmlId LOD mask (for cascade fallback) -> joined back onto each split feature
      - id: 83373a03-9e03-4f12-b5c2-b72200d249bf
        from: 16247597-565a-40df-a8d4-7445468978fd
        to: 6b1f2a3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c
        fromPort: features
        toPort: features
      - id: 2b4c6d8e-0a1b-4c2d-8e3f-4a5b6c7d8e9f
        from: 6b1f2a3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c
        to: d12d66b8-834d-4d8b-95cd-b978069add10
        fromPort: features
        toPort: features
      - id: c9b71d8c-8e82-4a9a-81ea-8aa3dc9bd776
        from: 16247597-565a-40df-a8d4-7445468978fd
        to: 5af9f07c-ec06-48b5-84bd-2ee0eb700e9c
        fromPort: features
        toPort: requestor
      - id: 1cf95ad1-9f49-47d8-88f6-411eb6655c8b
        from: d12d66b8-834d-4d8b-95cd-b978069add10
        to: 5af9f07c-ec06-48b5-84bd-2ee0eb700e9c
        fromPort: features
        toPort: supplier
      # joined (lod + lodMask) -> per-lod filters
      - id: 71f0a555-6c6d-4201-9e03-a2c8278bd5bf
        from: 5af9f07c-ec06-48b5-84bd-2ee0eb700e9c
        to: 04339391-dcfe-485a-9593-e12b0eddf864
        fromPort: joined
        toPort: features
      - id: 6d8c644d-3f72-4634-b2f5-0b62a7d9b813
        from: 5af9f07c-ec06-48b5-84bd-2ee0eb700e9c
        to: acf7b926-7c8b-4448-9a3d-af4a1d1aa2cd
        fromPort: joined
        toPort: features
      - id: 9ae53fa9-ed12-46ce-b628-494d610d93f3
        from: 5af9f07c-ec06-48b5-84bd-2ee0eb700e9c
        to: acd88b8a-708a-4adf-ad6e-b471d934191d
        fromPort: joined
        toPort: features
      # lod1 filter -> writer
      - id: 6cf1b755-369a-4d11-a9a5-83d46118a459
        from: 04339391-dcfe-485a-9593-e12b0eddf864
        to: a4f07c6f-3972-4c4f-9e70-f93af486c78d
        fromPort: features
        toPort: features
      # lod2 filter -> writer
      - id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        from: acf7b926-7c8b-4448-9a3d-af4a1d1aa2cd
        to: e44e7208-c0a6-4bca-829c-5d2769dd49f3
        fromPort: features
        toPort: features
      # lod3 filter -> writer
      - id: 3c4d5e6f-7a8b-4c9d-0e1f-2a3b4c5d6e7f
        from: acd88b8a-708a-4adf-ad6e-b471d934191d
        to: a7b575b0-8a0b-44d6-a80e-1fef936058df
        fromPort: features
        toPort: features
