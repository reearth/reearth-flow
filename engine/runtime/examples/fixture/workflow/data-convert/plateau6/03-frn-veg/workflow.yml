# yaml-language-server: $schema=https://raw.githubusercontent.com/reearth/reearth-flow/main/engine/schema/workflow.json
id: 4ae4f702-c028-41cf-bade-e92dbffc95c6
name: "PLATEAU6-DataConvert-03-frn-veg-workflow"
entryGraphId: 2c795293-163f-41e3-a91e-6da77c4a7078
with:
  cityGmlPath:
  codelistsPath:
  codelists:
  schemasPath:
  schemas:
  # read by AttributeTreePruner: these keys and everything below them are dropped
  attributeTreeDropKeys:
    - frn:adeOfCityFurniture
    - veg:adeOfAbstractVegetationObject
    - veg:adeOfSolitaryVegetationObject
    - veg:adeOfPlantCover
graphs:
  - !include ../../../../graphs/plateau6/folder_and_file_path_reader.yml
  - !include ../../../../graphs/plateau6/attribute_tree_pruner.yml
  - !include ../../../../graphs/plateau6/city_code_boundary_filter.yml
  - !include ../../../../graphs/plateau6/lod_splitter_with_dm.yml
  - !include ../../../../graphs/plateau6/dm_mvt_writer.yml
  - id: 2c795293-163f-41e3-a91e-6da77c4a7078
    name: entry_point
    nodes:
      - id: 09ab7a8e-8fd5-4475-953b-80d5228d6912
        name: FeatureCreator
        type: action
        action: Feature Creator
        with:
          creator:
            type: flowExpr
            value: |
              [
                {
                  "city_gml_path": variables["cityGmlPath"],
                  "codelists": variables.get("codelistsPath") or variables.get("codelists"),
                  "schemas": variables.get("schemasPath") or variables.get("schemas"),
                },
              ]

      - id: 3a99daee-3e42-4e92-bfe5-7237cd112f1e
        name: FolderAndFilePathReader
        type: subGraph
        subGraphId: 19e9f28c-8c77-4d3c-aa12-de7dbd6fee20

      - id: 89b1187c-0e2a-4684-a299-99e9b0cd1c1e
        name: FeatureReaderByCityGml
        type: action
        action: Feature CityGML 3 Reader
        with:
          dataset:
            type: flowExpr
            value: attributes["path"]
          keepAttributes: false
          inheritInputAttributes: true
          cityGmlAttributesKey: __city_gml_attributes
          # veg:height="12.4" uom="m" becomes the number 12.4 plus veg:height_uom, as in plateau4
          flattenLeafAttributes:
            - uom
          # urc:DmGeometricAttribute is deliberately not extracted: it stays in the furniture's
          # attribute tree, and its geometry rolls up into the furniture as members.
          extractTags:
            - frn:CityFurniture
            - veg:SolitaryVegetationObject
            - veg:PlantCover

      - id: 9f1fa99c-375c-4a2d-9341-98a062ba1b17
        name: TargetPackageFilter
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: |
                  path_segments = attributes["path"].split("/");
                  package = path_segments[path_segments.index("udx") + 1];
                  target_package = variables["cityGmlPath"].remove_suffix(".zip").rsplit("_", 1)[-1];
                  package == target_package
              outputPort: features

      - id: 34221770-f126-4bba-96b3-0935c02194fc
        name: AttributeMapperAfterTargetPackageFilter
        type: action
        action: Attribute Mapper
        with:
          mappers:
            - attribute: __citygml_gml_id
              valueAttribute: __citygml_gml_id
            - attribute: __citygml_parent_gml_id
              valueAttribute: __citygml_parent_gml_id
            - attribute: __citygml_root_gml_id
              valueAttribute: __citygml_root_gml_id
            - attribute: __citygml_feature_type
              valueAttribute: __citygml_feature_type
            - attribute: __city_gml_attributes
              valueAttribute: __city_gml_attributes
            - attribute: meshcode
              valueAttribute: meshcode
            - attribute: city_name
              valueAttribute: city_name
            - attribute: __base_city_code
              valueAttribute: __base_city_code

      # dictionary.json of the vegetation types present, as in plateau4
      - id: 1f6a8d34-b05c-4e92-a7d3-9c2e5b71f480
        name: FeatureFilterVegDict
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: attributes["__citygml_feature_type"].starts_with("veg:")
              outputPort: veg_only

      - id: a82c5e19-47d3-4b06-8f1a-d3e69b0c7254
        name: AttributeManagerStripPrefixDict
        type: action
        action: Attribute Manager
        with:
          operations:
            - attribute: feature_type_without_prefix
              method: create
              value:
                type: flowExpr
                value: attributes["__citygml_feature_type"].split(":")[1]

      - id: 6d0b93f7-2a51-4c8e-b6f4-18e7a5d3c09b
        name: AttributeDuplicateFilterDict
        type: action
        action: Attribute Duplicate Filter
        with:
          filterBy:
            - feature_type_without_prefix

      - id: d4e71a58-c963-4f20-85b1-7a0f2c6e93d8
        name: AttributeConversionTableDict
        type: action
        action: Attribute Conversion Table
        with:
          format: csv
          inline: |
            name,description
            PlantCover,植被
            SolitaryVegetationObject,単独木
          rules:
            - featureFroms:
                - feature_type_without_prefix
              featureTo: feature_type_ja
              conversionTableKeys:
                - name
              conversionTableTo: description

      - id: 93b5f0c2-e718-4d46-a3d9-52c8b1e7f06a
        name: JsonWriterDict
        type: action
        action: JSON Writer
        with:
          output:
            type: string
            value: dictionary.json
          converter:
            type: flowExpr
            value: |
              result = itertools.map(attributes["__features"], fn(f) {
                {"name": f["feature_type_without_prefix"], "description": f["feature_type_ja"]}
              });
              {"veg": result}

      # uro:CityFurnitureExtendedGeometry holding only geometry is left behind as ""
      - id: eb170294-4711-4ead-984c-19ebb1bb32a8
        name: AttributeTreePruner
        type: subGraph
        subGraphId: 833b0700-a741-4411-bfae-c310f7e3dc0c

      # top-level attributes, following plateau4's list; `attributes` keeps the full tree
      - id: d49f33bd-e255-4e3c-b706-035220d1328b
        name: AttributeTableExtractor
        type: action
        action: Attribute Table Extractor
        with:
          inline: !include ../../../../config/plateau6_frn_flat_attributes.json

      - id: f59f20f5-ce25-4f60-885c-d4ca3fa7022c
        name: LodSplitterWithDm
        type: subGraph
        subGraphId: c9694451-1158-4100-b171-3150faf3c4f8

      - id: 2986adf3-7c18-46b6-8b48-3f4f089c026a
        name: AttributeTableExtractorDmGeometricAttribute
        type: action
        action: Attribute Table Extractor
        with:
          typeAttribute: __dm
          inline: !include ../../../../config/plateau6_dm_flat_attributes.json

      - id: 8dc5a2bc-173c-4dc3-8279-334224d32f5a
        name: AttributeManager
        type: action
        action: Attribute Manager
        with:
          operations:
            # like plateau4, the full tree also carries meshcode, feature_type and gml:id
            - attribute: attributes
              method: create
              value:
                type: flowExpr
                value: |
                  out = {
                    "meshcode": attributes["meshcode"],
                    "feature_type": attributes["__citygml_feature_type"],
                    "gml:id": attributes["__citygml_gml_id"],
                  };
                  out.update(attributes.get("__city_gml_attributes", {}));
                  json.dumps(out)
            - attribute: __city_gml_attributes
              method: remove
            - attribute: __citygml_feature_type
              method: rename
              value:
                type: string
                value: feature_type
            - attribute: __citygml_gml_id
              method: rename
              value:
                type: string
                value: gml_id
            - attribute: city_code
              method: create
              value:
                type: flowExpr
                value: attributes["__base_city_code"]

      - id: 91bbe5b9-9886-4283-b15e-24663fddbfe3
        name: CityCodeBoundaryFilter
        type: subGraph
        subGraphId: 1d20a058-be90-4161-9573-52eeb8b97bc7

      - id: 59b6ae9a-d940-414a-98fe-93038f06191d
        name: AttributeManagerForOutputBase
        type: action
        action: Attribute Manager
        with:
          operations:
            - attribute: __output_base
              method: create
              value:
                type: flowExpr
                value: |
                  city_gml = variables["cityGmlPath"].rsplit("/", 1)[-1].remove_suffix(".zip");
                  suffix = "";
                  if attributes["city_code"] != attributes["__base_city_code"] {
                    suffix = "_" + attributes["city_code"] + "_" + attributes["__city_name_en"];
                  }
                  # like plateau4, each veg type is written to its own files
                  if attributes["feature_type"].starts_with("veg:") {
                    suffix = suffix + "_" + attributes["feature_type"].split(":")[1];
                  }
                  city_gml + suffix

      - id: 11732a8f-8213-440c-9800-f6a3cf40e88d
        name: GeometryFilterHasGeometry
        type: action
        action: Geometry Filter
        with:
          filterType: none

      - id: d54a209b-779b-41fe-b5ac-4f3539d0d2bb
        name: FeatureFilterByLod
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: attributes["__dm"] == null and attributes["lod"] in [0, 1, 2, 3]
              outputPort: features
            - expr:
                type: flowExpr
                value: attributes["__dm"] != null
              outputPort: dm

      - id: 48002798-a884-49f8-b220-e8d663985b12
        name: SchemaAttributeMapperFrn
        type: action
        action: Attribute Mapper
        with:
          mappers:
            - attribute: meshcode
              valueAttribute: meshcode
            - attribute: gml_id
              valueAttribute: gml_id
            - attribute: city_code
              valueAttribute: city_code
            - attribute: city_name
              valueAttribute: city_name
            - attribute: feature_type
              valueAttribute: feature_type
            - attribute: attributes
              valueAttribute: attributes
            - attribute: core:creationDate
              valueAttribute: core:creationDate
            - attribute: urc:geometrySrcDescLod1
              valueAttribute: urc:geometrySrcDescLod1
            - attribute: urc:lodType
              valueAttribute: urc:lodType
            - attribute: __lod
              valueAttribute: lod
            - attribute: __output_base
              valueAttribute: __output_base

      - id: 7a1c9e52-3b64-4d08-9f17-5e2a8c40b6d1
        name: FeatureFilterByType
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: attributes["feature_type"] == "frn:CityFurniture"
              outputPort: frn
            - expr:
                type: flowExpr
                value: attributes["feature_type"] == "veg:SolitaryVegetationObject"
              outputPort: solitaryVegetationObject
            - expr:
                type: flowExpr
                value: attributes["feature_type"] == "veg:PlantCover"
              outputPort: plantCover

      - id: 3e8b5d17-92a4-4c60-8b1f-d07a64e2c935
        name: SchemaAttributeMapperSolitaryVegetationObject
        type: action
        action: Attribute Mapper
        with:
          mappers:
            - attribute: meshcode
              valueAttribute: meshcode
            - attribute: gml_id
              valueAttribute: gml_id
            - attribute: city_code
              valueAttribute: city_code
            - attribute: city_name
              valueAttribute: city_name
            - attribute: feature_type
              valueAttribute: feature_type
            - attribute: attributes
              valueAttribute: attributes
            - attribute: gml:name
              valueAttribute: gml:name
            - attribute: core:creationDate
              valueAttribute: core:creationDate
            - attribute: veg:class
              valueAttribute: veg:class
            - attribute: veg:function
              valueAttribute: veg:function
            - attribute: veg:height
              valueAttribute: veg:height
            - attribute: veg:trunkDiameter
              valueAttribute: veg:trunkDiameter
            - attribute: veg:crownDiameter
              valueAttribute: veg:crownDiameter
            - attribute: urc:geometrySrcDescLod1
              valueAttribute: urc:geometrySrcDescLod1
            - attribute: urc:lodType
              valueAttribute: urc:lodType
            - attribute: __lod
              valueAttribute: lod
            - attribute: __output_base
              valueAttribute: __output_base

      - id: c46d0f83-71e5-4a2b-b839-6f1d9a35e270
        name: SchemaAttributeMapperPlantCover
        type: action
        action: Attribute Mapper
        with:
          mappers:
            - attribute: meshcode
              valueAttribute: meshcode
            - attribute: gml_id
              valueAttribute: gml_id
            - attribute: city_code
              valueAttribute: city_code
            - attribute: city_name
              valueAttribute: city_name
            - attribute: feature_type
              valueAttribute: feature_type
            - attribute: attributes
              valueAttribute: attributes
            - attribute: core:creationDate
              valueAttribute: core:creationDate
            - attribute: veg:class
              valueAttribute: veg:class
            - attribute: veg:averageHeight
              valueAttribute: veg:averageHeight
            - attribute: urc:geometrySrcDescLod1
              valueAttribute: urc:geometrySrcDescLod1
            - attribute: urc:lodType
              valueAttribute: urc:lodType
            - attribute: __lod
              valueAttribute: lod
            - attribute: __output_base
              valueAttribute: __output_base

      # LOD0 is the outline at height 0 (表1-533), so it goes to MVT rather than 3D Tiles
      - id: 626004f7-98e7-48e1-b52b-3e3657d95c41
        name: FeatureFilterLod0
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: attributes["__lod"] == 0
              outputPort: lod0
            - expr:
                type: flowExpr
                value: attributes["__lod"] != 0
              outputPort: features

      - id: e0b60004-e3a8-46f2-9a5c-c84a62e2a18c
        name: TwoDimensionForcerLod0
        type: action
        action: Two Dimension Forcer

      - id: e286da82-7140-43fa-8fd7-75e2bca6e250
        name: MVTWriterLod0
        type: action
        action: MVT Writer
        with:
          layerName:
            type: flowExpr
            value: attributes["feature_type"].split(":")[1]
          skipUnexposedAttributes: true
          minZoom: 8
          maxZoom: 16
          extent: 4096
          extentAtMaxZoom: 65536
          maxTileBytes: 10000000
          keepAllAtMaxZoom: true
          output:
            type: flowExpr
            value: attributes["__output_base"] + "_mvt_lod" + str(attributes["__lod"]) + ".zip"

      # as in plateau4, only city furniture is lifted; vegetation goes to 3D Tiles as-is
      - id: 5d92e6a0-48b7-4f13-a0c5-81b3f7d2e964
        name: FeatureFilterLiftTarget
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: attributes["feature_type"] == "frn:CityFurniture"
              outputPort: frn

      - id: 102fb097-ab9a-4a60-b170-948c562beeab
        name: GeometryFilterForLift
        type: action
        action: Geometry Filter
        with:
          filterType: geometryType

      # surfaces are lifted 3mm so they do not z-fight with the ground; solids are left as-is
      - id: 4c917f66-f04a-4e75-9817-c7866c7c259c
        name: OffsetterFor3mmLift
        type: action
        action: Offsetter
        with:
          offsetZ: 0.003

      - id: 12ad7a7b-02c5-4095-bd2e-9fcd8ab67d0c
        name: Cesium3DTilesWriter
        type: action
        action: Cesium 3D Tiles Writer
        with:
          dracoCompression:
            enabled:
              quantizationError: 0.003
          targetTileSize: 1048576
          attachTexture: true
          wrapTolerance: 0.1
          skipUnexposedAttributes: true
          output:
            type: flowExpr
            value: attributes["__output_base"] + "_3dtiles_lod" + str(attributes["__lod"]) + ".zip"

      # the DM feature carries its furniture's attributes, plus its own under dm_*
      - id: 4c431713-ebd7-41b7-b09e-ab85cf571167
        name: SchemaAttributeMapperDmGeometricAttribute
        type: action
        action: Attribute Mapper
        with:
          mappers:
            - attribute: meshcode
              valueAttribute: meshcode
            - attribute: gml_id
              valueAttribute: gml_id
            - attribute: city_code
              valueAttribute: city_code
            - attribute: city_name
              valueAttribute: city_name
            - attribute: feature_type
              valueAttribute: feature_type
            - attribute: attributes
              valueAttribute: attributes
            - attribute: core:creationDate
              valueAttribute: core:creationDate
            - attribute: urc:geometrySrcDescLod1
              valueAttribute: urc:geometrySrcDescLod1
            - attribute: urc:lodType
              valueAttribute: urc:lodType
            - attribute: dm_dmCode
              valueAttribute: dm_dmCode
            - attribute: dm_dmCode_code
              valueAttribute: dm_dmCode_code
            - attribute: dm_geometryType
              valueAttribute: dm_geometryType
            - attribute: dm_geometryType_code
              valueAttribute: dm_geometryType_code
            - attribute: dm_mapLevel
              valueAttribute: dm_mapLevel
            - attribute: dm_mapLevel_code
              valueAttribute: dm_mapLevel_code
            - attribute: dm_shapeType
              valueAttribute: dm_shapeType
            - attribute: dm_shapeType_code
              valueAttribute: dm_shapeType_code
            - attribute: dm_attributes
              valueAttribute: dm_attributes
            - attribute: __output_base
              valueAttribute: __output_base

      - id: 9b3f1a74-6c28-4e05-8d71-a2e50c9f4b36
        name: FeatureFilterByTypeDm
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: attributes["feature_type"] == "frn:CityFurniture"
              outputPort: frn
            - expr:
                type: flowExpr
                value: attributes["feature_type"] == "veg:SolitaryVegetationObject"
              outputPort: solitaryVegetationObject
            - expr:
                type: flowExpr
                value: attributes["feature_type"] == "veg:PlantCover"
              outputPort: plantCover

      - id: e17a4c92-0d5b-4f68-93a1-7b2c8e60d4f5
        name: SchemaAttributeMapperDmSolitaryVegetationObject
        type: action
        action: Attribute Mapper
        with:
          mappers:
            - attribute: meshcode
              valueAttribute: meshcode
            - attribute: gml_id
              valueAttribute: gml_id
            - attribute: city_code
              valueAttribute: city_code
            - attribute: city_name
              valueAttribute: city_name
            - attribute: feature_type
              valueAttribute: feature_type
            - attribute: attributes
              valueAttribute: attributes
            - attribute: gml:name
              valueAttribute: gml:name
            - attribute: core:creationDate
              valueAttribute: core:creationDate
            - attribute: veg:class
              valueAttribute: veg:class
            - attribute: veg:function
              valueAttribute: veg:function
            - attribute: veg:height
              valueAttribute: veg:height
            - attribute: veg:trunkDiameter
              valueAttribute: veg:trunkDiameter
            - attribute: veg:crownDiameter
              valueAttribute: veg:crownDiameter
            - attribute: urc:geometrySrcDescLod1
              valueAttribute: urc:geometrySrcDescLod1
            - attribute: urc:lodType
              valueAttribute: urc:lodType
            - attribute: dm_dmCode
              valueAttribute: dm_dmCode
            - attribute: dm_dmCode_code
              valueAttribute: dm_dmCode_code
            - attribute: dm_geometryType
              valueAttribute: dm_geometryType
            - attribute: dm_geometryType_code
              valueAttribute: dm_geometryType_code
            - attribute: dm_mapLevel
              valueAttribute: dm_mapLevel
            - attribute: dm_mapLevel_code
              valueAttribute: dm_mapLevel_code
            - attribute: dm_shapeType
              valueAttribute: dm_shapeType
            - attribute: dm_shapeType_code
              valueAttribute: dm_shapeType_code
            - attribute: dm_attributes
              valueAttribute: dm_attributes
            - attribute: __output_base
              valueAttribute: __output_base

      - id: 28d6b0e3-95f1-4a7c-b4e8-3c1a7f5d9026
        name: SchemaAttributeMapperDmPlantCover
        type: action
        action: Attribute Mapper
        with:
          mappers:
            - attribute: meshcode
              valueAttribute: meshcode
            - attribute: gml_id
              valueAttribute: gml_id
            - attribute: city_code
              valueAttribute: city_code
            - attribute: city_name
              valueAttribute: city_name
            - attribute: feature_type
              valueAttribute: feature_type
            - attribute: attributes
              valueAttribute: attributes
            - attribute: core:creationDate
              valueAttribute: core:creationDate
            - attribute: veg:class
              valueAttribute: veg:class
            - attribute: veg:averageHeight
              valueAttribute: veg:averageHeight
            - attribute: urc:geometrySrcDescLod1
              valueAttribute: urc:geometrySrcDescLod1
            - attribute: urc:lodType
              valueAttribute: urc:lodType
            - attribute: dm_dmCode
              valueAttribute: dm_dmCode
            - attribute: dm_dmCode_code
              valueAttribute: dm_dmCode_code
            - attribute: dm_geometryType
              valueAttribute: dm_geometryType
            - attribute: dm_geometryType_code
              valueAttribute: dm_geometryType_code
            - attribute: dm_mapLevel
              valueAttribute: dm_mapLevel
            - attribute: dm_mapLevel_code
              valueAttribute: dm_mapLevel_code
            - attribute: dm_shapeType
              valueAttribute: dm_shapeType
            - attribute: dm_shapeType_code
              valueAttribute: dm_shapeType_code
            - attribute: dm_attributes
              valueAttribute: dm_attributes
            - attribute: __output_base
              valueAttribute: __output_base

      - id: 67922827-2e83-45dd-a409-25fb33d79ce0
        name: DmMvtWriter
        type: subGraph
        subGraphId: da5a2614-60e3-42c1-ab01-86e5d73a55e6

    edges:
      - id: 338e6211-5817-4607-929c-5984b6b89ab3
        from: 09ab7a8e-8fd5-4475-953b-80d5228d6912
        to: 3a99daee-3e42-4e92-bfe5-7237cd112f1e
        fromPort: features
        toPort: features
      - id: 23bae8c5-5f1d-43e6-a164-94474de5883a
        from: 3a99daee-3e42-4e92-bfe5-7237cd112f1e
        to: 89b1187c-0e2a-4684-a299-99e9b0cd1c1e
        fromPort: features
        toPort: features
      - id: 6fc01710-2142-40e2-91f6-c2de774fdee2
        from: 89b1187c-0e2a-4684-a299-99e9b0cd1c1e
        to: 9f1fa99c-375c-4a2d-9341-98a062ba1b17
        fromPort: features
        toPort: features
      - id: 2cacca57-ef1c-4e18-baea-8db88ada624d
        from: 9f1fa99c-375c-4a2d-9341-98a062ba1b17
        to: 34221770-f126-4bba-96b3-0935c02194fc
        fromPort: features
        toPort: features
      - id: 3c7e9a14-b852-4d06-a1f9-e5d02b68c374
        from: 34221770-f126-4bba-96b3-0935c02194fc
        to: 1f6a8d34-b05c-4e92-a7d3-9c2e5b71f480
        fromPort: features
        toPort: features
      - id: f81d4b27-6e03-4a95-b8c2-0a7d93e5f168
        from: 1f6a8d34-b05c-4e92-a7d3-9c2e5b71f480
        to: a82c5e19-47d3-4b06-8f1a-d3e69b0c7254
        fromPort: veg_only
        toPort: features
      - id: 05b6c9e8-2d71-4f43-9a0e-c8f3e1d7a542
        from: a82c5e19-47d3-4b06-8f1a-d3e69b0c7254
        to: 6d0b93f7-2a51-4c8e-b6f4-18e7a5d3c09b
        fromPort: features
        toPort: features
      - id: 9e2a7d43-f10b-4c58-b3a6-7d5e8c0f1b29
        from: 6d0b93f7-2a51-4c8e-b6f4-18e7a5d3c09b
        to: d4e71a58-c963-4f20-85b1-7a0f2c6e93d8
        fromPort: features
