# yaml-language-server: $schema=https://raw.githubusercontent.com/reearth/reearth-flow/main/engine/schema/workflow.json
id: 91167003-ec0f-422c-962d-ad0f9322e35a
name: "PLATEAU6-DataConvert-04-luse-lsld-workflow"
entryGraphId: 44483fd7-93ee-4bf7-aba1-8fdbb049dbf3
with:
  cityGmlPath:
  codelistsPath:
  codelists:
  schemasPath:
  schemas:
graphs:
  - !include ../../../../graphs/plateau6/folder_and_file_path_reader.yml
  - !include ../../../../graphs/plateau6/city_code_boundary_filter.yml
  - !include ../../../../graphs/plateau6/lod_splitter_with_dm.yml
  - id: 44483fd7-93ee-4bf7-aba1-8fdbb049dbf3
    name: entry_point
    nodes:
      - id: 4016f03d-31b1-4f4d-b50c-a12ca676454c
        name: FeatureCreator
        type: action
        action: Feature Creator
        with:
          creator:
            type: flowExpr
            value: |
              [
                {
                  "city_gml_path": variables["cityGmlPath"],
                  "codelists": variables.get("codelistsPath") or variables.get("codelists"),
                  "schemas": variables.get("schemasPath") or variables.get("schemas"),
                },
              ]

      - id: 9aa1c618-36c2-4c38-967f-17e368dcda81
        name: FolderAndFilePathReader
        type: subGraph
        subGraphId: 19e9f28c-8c77-4d3c-aa12-de7dbd6fee20

      - id: 75ac4c58-f8f0-4188-be2b-9bc5c8bd9943
        name: FeatureReaderByCityGml
        type: action
        action: Feature CityGML 3 Reader
        with:
          dataset:
            type: flowExpr
            value: attributes["path"]
          keepAttributes: false
          inheritInputAttributes: true
          cityGmlAttributesKey: __city_gml_attributes
          extractTags:
            - luse:LandUse
            - urf:SedimentDisasterProneArea

      - id: c8721bbf-b2c9-41b4-83c6-203cdc1a842c
        name: TargetPackageFilter
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: |
                  path_segments = attributes["path"].split("/");
                  package = path_segments[path_segments.index("udx") + 1];
                  target_package = variables["cityGmlPath"].remove_suffix(".zip").rsplit("_", 1)[-1];
                  package == target_package
              outputPort: features

      - id: 7634a8d6-6c0d-419e-b993-45ddd01ec973
        name: AttributeMapperAfterTargetPackageFilter
        type: action
        action: Attribute Mapper
        with:
          mappers:
            - attribute: __citygml_gml_id
              valueAttribute: __citygml_gml_id
            - attribute: __citygml_feature_type
              valueAttribute: __citygml_feature_type
            - attribute: __city_gml_attributes
              valueAttribute: __city_gml_attributes
            - attribute: meshcode
              valueAttribute: meshcode
            - attribute: city_name
              valueAttribute: city_name
            - attribute: __base_city_code
              valueAttribute: __base_city_code

      # top-level attributes, following plateau4's list; `attributes` keeps the full tree
      - id: 88535305-e9d6-4e7d-8e0d-775c624b4a01
        name: AttributeTableExtractor
        type: action
        action: Attribute Table Extractor
        with:
          inline: !include ../../../../config/plateau6_luse_lsld_flat_attributes.json

      - id: 03257f43-d589-4cc5-81c0-e2c47bc77bee
        name: LodSplitterWithDm
        type: subGraph
        subGraphId: c9694451-1158-4100-b171-3150faf3c4f8

      - id: 720e326f-4396-44f3-a69a-2827b650a524
        name: AttributeManager
        type: action
        action: Attribute Manager
        with:
          operations:
            # like plateau4, the full tree also carries meshcode, feature_type and gml:id
            - attribute: attributes
              method: create
              value:
                type: flowExpr
                value: |
                  out = {
                    "meshcode": attributes["meshcode"],
                    "feature_type": attributes["__citygml_feature_type"],
                    "gml:id": attributes["__citygml_gml_id"],
                  };
                  out.update(attributes.get("__city_gml_attributes", {}));
                  json.dumps(out)
            # like plateau4, sediment disaster areas are drawn in areaType code order, so a
            # special warning area (2) lies over the warning area (1) it is inside of
            - attribute: __sort_order
              method: create
              value:
                type: flowExpr
                value: |
                  code = attributes.get("__city_gml_attributes", {}).get("urf:areaType_code");
                  if code == null { 999 } else { int(code) }
            - attribute: __city_gml_attributes
              method: remove
            - attribute: __citygml_feature_type
              method: rename
              value:
                type: string
                value: feature_type
            - attribute: __citygml_gml_id
              method: rename
              value:
                type: string
                value: gml_id
            - attribute: city_code
              method: create
              value:
                type: flowExpr
                value: attributes["__base_city_code"]

      - id: c2060a99-2407-4bc3-a481-38228b70f06a
        name: CityCodeBoundaryFilter
        type: subGraph
        subGraphId: 1d20a058-be90-4161-9573-52eeb8b97bc7

      - id: 4902fb8c-2765-4722-ac57-05194a62fcdd
        name: AttributeManagerForOutputBase
        type: action
        action: Attribute Manager
        with:
          operations:
            - attribute: __output_base
              method: create
              value:
                type: flowExpr
                value: |
                  city_gml = variables["cityGmlPath"].rsplit("/", 1)[-1].remove_suffix(".zip");
                  suffix = "";
                  if attributes["city_code"] != attributes["__base_city_code"] {
                    suffix = "_" + attributes["city_code"] + "_" + attributes["__city_name_en"];
                  }
                  city_gml + suffix

      # land use and urf areas are LOD1 only (MultiSurface)
      - id: c4a72bc0-9f7f-4d53-ad33-9f633990f5d9
        name: FeatureFilterLod1
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: attributes["lod"] == 1
              outputPort: features

      - id: 3944e300-8e9a-4a1a-a9d2-f068cfe9827d
        name: TwoDimensionForcer
        type: action
        action: Two Dimension Forcer

      - id: 22583f9d-3420-46cb-a679-aafcab0875ea
        name: GeometryFilter
        type: action
        action: Geometry Filter
        with:
          filterType: geometryType

      - id: 1625e17b-8bc4-4342-9d7b-826119643553
        name: GeometrySplitter
        type: action
        action: Geometry Splitter

      - id: c4d3ebd3-8dc5-400c-a4d4-c8c80364998d
        name: Dissolver
        type: action
        action: Dissolver
        with:
          groupBy:
            - gml_id
          attributeAccumulation: useOneFeature

      - id: 239f5374-4959-4028-a72a-480cb8b72ce2
        name: FeatureSorter
        type: action
        action: Feature Sorter
        with:
          attributes:
            - __sort_order
          order: ascending

      # layer and file named by package, as in plateau4
      - id: 08ef4c5e-85c6-45c0-b5c4-5bd003891939
        name: MVTWriter
        type: action
        action: MVT Writer
        with:
          layerName:
            type: flowExpr
            value: variables["cityGmlPath"].remove_suffix(".zip").rsplit("_", 1)[-1]
          skipUnexposedAttributes: true
          minZoom: 8
          maxZoom: 16
          extent: 4096
          extentAtMaxZoom: 65536
          maxTileBytes: 10000000
          keepAllAtMaxZoom: true
          output:
            type: flowExpr
            value: attributes["__output_base"] + "_mvt"
          compressOutput:
            type: flowExpr
            value: attributes["__output_base"] + "_mvt.zip"

    edges:
      - id: 9e1567df-d00b-4090-ab43-90d4ebf448bd
        from: 4016f03d-31b1-4f4d-b50c-a12ca676454c
        to: 9aa1c618-36c2-4c38-967f-17e368dcda81
        fromPort: features
        toPort: features
