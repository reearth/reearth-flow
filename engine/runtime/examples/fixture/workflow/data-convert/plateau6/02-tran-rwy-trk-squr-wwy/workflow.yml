# yaml-language-server: $schema=https://raw.githubusercontent.com/reearth/reearth-flow/main/engine/schema/workflow.json
id: 653e2dba-2113-4351-b50c-861a2c26eea0
name: "PLATEAU6-DataConvert-02-tran-workflow"
entryGraphId: 6058bda7-db22-4c23-8c40-f8fcb91e6d22
with:
  cityGmlPath:
  codelistsPath:
  codelists:
  schemasPath:
  schemas:
  # read by AttributeTreePruner: these keys and everything below them are dropped
  attributeTreeDropKeys:
    - tran:trafficSpace
    - tran:auxiliaryTrafficSpace
    - tran:section
    - tran:intersection
graphs:
  - !include ../../../../graphs/plateau6/folder_and_file_path_reader.yml
  - !include ../../../../graphs/plateau6/attribute_tree_measure_caster.yml
  - !include ../../../../graphs/plateau6/attribute_tree_pruner.yml
  - !include ../../../../graphs/plateau6/city_code_boundary_filter.yml
  - !include ../../../../graphs/plateau6/lod_splitter_with_dm.yml
  - !include ../../../../graphs/plateau6/dm_mvt_writer.yml
  - !include ../../../../graphs/plateau6/dm_attribute_mapper.yml
  - id: 6058bda7-db22-4c23-8c40-f8fcb91e6d22
    name: entry_point
    nodes:
      - id: 290a0b62-5165-4981-9463-ab67b51b4ffa
        name: FeatureCreator
        type: action
        action: Feature Creator
        with:
          creator:
            type: flowExpr
            value: |
              [
                {
                  "city_gml_path": variables["cityGmlPath"],
                  "codelists": variables.get("codelistsPath") or variables.get("codelists"),
                  "schemas": variables.get("schemasPath") or variables.get("schemas"),
                },
              ]

      - id: 33b72285-db89-4519-92a4-1f4f608ce2ee
        name: FolderAndFilePathReader
        type: subGraph
        subGraphId: 19e9f28c-8c77-4d3c-aa12-de7dbd6fee20

      - id: aef40c4c-350e-4fe4-af37-ffe33b885f56
        name: FeatureReaderByCityGml
        type: action
        action: Feature CityGML 3 Reader
        with:
          dataset:
            type: flowExpr
            value: attributes["path"]
          inheritInputAttributes: true
          cityGmlAttributesKey: __city_gml_attributes
          hoistAttributes:
            - uom
          # urc:DmGeometricAttribute is extracted, so each record keeps its own lod0Geometry;
          # DmAttributeMapper puts the record back into its owner's tree and gives the DM feature
          # the owner's attributes.
          extractTags:
            - urc:DmGeometricAttribute
            - tran:AuxiliaryTrafficArea
            # - tran:AuxiliaryTrafficSpace
            # - tran:ClearanceSpace
            # - tran:Hole
            # - tran:HoleSurface
            # - tran:Intersection
            # - tran:Marking
            - tran:Railway
            - tran:Road
            # - tran:Section
            - tran:Square
            - tran:Track
            - tran:TrafficArea
            # - tran:TrafficSpace
            - tran:Waterway

      - id: f3385b5d-f081-45f9-8b5d-37202dfa2717
        name: AttributeTreeMeasureCaster
        type: subGraph
        subGraphId: d9f0c1d7-3bd4-49d8-a8ba-f56994776d22

      - id: 0a6bfd76-2b97-4b57-8ac5-3707c8526147
        name: TargetPackageFilter
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: |
                  path_segments = attributes["path"].split("/");
                  package = path_segments[path_segments.index("udx") + 1];
                  target_package = variables["cityGmlPath"].remove_suffix(".zip").rsplit("_", 1)[-1];
                  package == target_package
              outputPort: features

      - id: a484f3f7-c960-436e-ab95-4958236088e6
        name: AttributeMapperAfterTargetPackageFilter
        type: action
        action: Attribute Mapper
        with:
          mappers:
            - attribute: __citygml_gml_id
              valueAttribute: __citygml_gml_id
            - attribute: __citygml_parent_gml_id
              valueAttribute: __citygml_parent_gml_id
            - attribute: __citygml_root_gml_id
              valueAttribute: __citygml_root_gml_id
            - attribute: __citygml_feature_type
              valueAttribute: __citygml_feature_type
            - attribute: __city_gml_attributes
              valueAttribute: __city_gml_attributes
            - attribute: meshcode
              valueAttribute: meshcode
            - attribute: city_name
              valueAttribute: city_name
            - attribute: __base_city_code
              valueAttribute: __base_city_code
            # package of the file the feature was read from; a TrafficArea reached through a
            # squr file's cross-file core:boundary xlink is read from that squr file
            - attribute: __package
              expr:
                type: flowExpr
                value: |
                  path_segments = attributes["path"].split("/");
                  path_segments[path_segments.index("udx") + 1]

      # the extracted (Auxiliary)TrafficArea leaves its core:boundary wrapper behind as ""
      - id: a458769b-0703-46ab-bbed-ad1cd603ed8a
        name: AttributeTreePruner
        type: subGraph
        subGraphId: 833b0700-a741-4411-bfae-c310f7e3dc0c

      # joins each extracted urc:DmGeometricAttribute back to its owner (see the subgraph)
      - id: 0f6893c9-553d-4d29-a8da-4d7c4f0ca3ee
        name: DmAttributeMapper
        type: subGraph
        subGraphId: 7632ce18-8fc0-4188-84ef-3a503911bdfa

      - id: 12ae8af6-389c-4c70-85df-02e607edb34a
        name: LodSplitterWithDm
        type: subGraph
        subGraphId: c9694451-1158-4100-b171-3150faf3c4f8

      - id: f5eb79fb-89c4-4e86-92e1-a37ead0ac15f
        name: FeatureFilterDmForTableExtractor
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: type(attributes.get("__dm")) == dict
              outputPort: dm

      - id: f5687fd3-3399-4f64-bad4-a0f0ffdd296a
        name: AttributeTableExtractorDmGeometricAttribute
        type: action
        action: Attribute Table Extractor
        with:
          inline: !include ../../../../config/plateau6_dm_flat_attributes.json

      # like plateau4, the feature's full tree holds its ancestors' full trees (root first) under
      # "ancestors", and each tree also carries its own meshcode, feature_type and gml:id
      - id: 3d2c4fa7-2f82-4ca1-92a4-e46757fa735c
        name: AttributeChainMapper
        type: action
        action: Feature Group Mapper
        with:
          attribute: __citygml_root_gml_id
          expr:
            type: flowExpr
            value: |
              by_id = {};
              for f in features {
                by_id[f["__citygml_gml_id"]] = f;
              }
              results = [];
              for f in features {
                chain = [];
                id = f["__citygml_gml_id"];
                while id != null {
                  current = by_id[id];
                  tree = {
                    "meshcode": current["meshcode"],
                    "feature_type": current["__citygml_feature_type"],
                    "gml:id": current["__citygml_gml_id"],
                  };
                  tree.update(current.get("__city_gml_attributes", {}));
                  chain.append(tree);
                  id = current.get("__citygml_parent_gml_id");
                }
                entry = {};
                for k in f {
                  entry[k] = f[k];
                }
                chain.reverse();
                own = chain.pop();
                if len(chain) > 0 {
                  own["ancestors"] = chain;
                }
                entry["attributes"] = own;
                results.append(entry);
              }
              results

      # the flat tables are keyed by feature type only, and a TrafficArea's ancestor columns
      # depend on its parent, which the package fixes: squr -> tran:Square, trk -> tran:Track,
      # rwy -> tran:Railway, wwy -> tran:Waterway
      - id: edc4f8dc-f638-41e7-9b3d-f7c301f76d7d
        name: FeatureFilterByPackage
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: attributes["__package"] == "squr"
              outputPort: squr
            - expr:
                type: flowExpr
                value: attributes["__package"] == "trk"
              outputPort: trk
            - expr:
                type: flowExpr
                value: attributes["__package"] == "rwy"
              outputPort: rwy
            - expr:
                type: flowExpr
                value: attributes["__package"] == "wwy"
              outputPort: wwy

      # the extractors run after AttributeChainMapper so that "attributes ancestors ..." rows can resolve
      - id: 8f1c2a3b-4d5e-4f60-9a1b-2c3d4e5f6a7b
        name: AttributeTableExtractor
        type: action
        action: Attribute Table Extractor
        with:
          typeAttribute: __citygml_feature_type
          inline: !include ../../../../config/plateau6_tran_flat_attributes.json

      - id: fd01991f-fc9d-4829-abd6-73079bd6e504
        name: AttributeTableExtractorSqur
        type: action
        action: Attribute Table Extractor
        with:
          typeAttribute: __citygml_feature_type
          inline: !include ../../../../config/plateau6_squr_flat_attributes.json

      - id: 83e059ff-3d4c-4278-bef3-5e014ea89b32
        name: AttributeTableExtractorTrk
        type: action
        action: Attribute Table Extractor
        with:
          typeAttribute: __citygml_feature_type
          inline: !include ../../../../config/plateau6_trk_flat_attributes.json

      - id: c0998e5f-67ef-48e5-84dd-047ffc9c42e3
        name: AttributeTableExtractorRwy
        type: action
        action: Attribute Table Extractor
        with:
          typeAttribute: __citygml_feature_type
          inline: !include ../../../../config/plateau6_rwy_flat_attributes.json

      - id: d8f7167b-1fa4-4ecd-8209-b0234fca62b1
        name: AttributeTableExtractorWwy
        type: action
        action: Attribute Table Extractor
        with:
          typeAttribute: __citygml_feature_type
          inline: !include ../../../../config/plateau6_wwy_flat_attributes.json

      - id: 36c60099-916a-47ce-9e50-cd33ee300cd7
        name: AttributeManager
        type: action
        action: Attribute Manager
        with:
          operations:
            - attribute: attributes
              method: convert
              value:
                type: flowExpr
                value: json.dumps(attributes["attributes"])
            - attribute: __city_gml_attributes
              method: remove
            - attribute: __citygml_feature_type
              method: rename
              value:
                type: string
                value: feature_type
            - attribute: gml_id
              method: create
              value:
                type: flowExpr
                value: attributes["__citygml_gml_id"]
            - attribute: city_code
              method: create
              value:
                type: flowExpr
                value: attributes["__base_city_code"]

      - id: ebff0627-09e7-4a4b-ada8-fb15ae6352f3
        name: CityCodeBoundaryFilter
        type: subGraph
        subGraphId: 1d20a058-be90-4161-9573-52eeb8b97bc7

      - id: 048967ac-f0ac-4bfb-90b5-c5a80d0acede
        name: AttributeManagerForOutputBase
        type: action
        action: Attribute Manager
        with:
          operations:
            - attribute: __output_base
              method: create
              value:
                type: flowExpr
                value: |
                  city_gml = variables["cityGmlPath"].rsplit("/", 1)[-1].remove_suffix(".zip");
                  suffix = "";
                  if attributes["city_code"] != attributes["__base_city_code"] {
                    suffix = "_" + attributes["city_code"] + "_" + attributes["__city_name_en"];
                  }
                  city_gml + suffix

      # Builds the final attribute order from four groups, each kept in order on its own:
      # base keys, __flat (AttributeTableExtractor), the dm_* keys of a
      # DmGeometricAttribute feature. No earlier step can affect it. The writers do not
      # expose "__" keys; the ones the later nodes read are kept after the others.
      - id: 7e9a1c3b-5d2f-4b8a-a6c0-1f3b5d7a9c24
        name: AttributeOrderMapper
        type: action
        action: Attribute Mapper
        with:
          mappers:
            - multipleExpr:
                type: flowExpr
                value: |
                  out = {};
                  for k in ["meshcode", "feature_type", "city_code", "city_name", "gml_id", "attributes"] {
                    if k in attributes { out[k] = attributes[k]; }
                  }
                  flat = attributes.get("__flat", {});
                  for k in flat.keys() { out[k] = flat[k]; }
                  for k in ["dm_dmCode", "dm_dmCode_code", "dm_geometryType", "dm_geometryType_code", "dm_mapLevel", "dm_mapLevel_code", "dm_shapeType", "dm_shapeType_code", "dm_attributes"] {
                    if k in attributes { out[k] = attributes[k]; }
                  }
                  out
            - attribute: __dm
              valueAttribute: __dm
            - attribute: __citygml_gml_id
              valueAttribute: __citygml_gml_id
            - attribute: __lod
              valueAttribute: __lod
            - attribute: __output_base
              valueAttribute: __output_base

      - id: 6ebb79f9-67e8-490d-b397-187e9889b4da
        name: GeometryFilterHasGeometry
        type: action
        action: Geometry Filter
        with:
          filterType: none

      - id: 2a3b4c5d-6e7f-4801-8a1b-2c3d4e5f6a7b
        name: FeatureFilterByLod
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: attributes["__lod"] == 0
              outputPort: lod0
            - expr:
                type: flowExpr
                value: attributes["__lod"] == 1
              outputPort: lod1
            - expr:
                type: flowExpr
                value: attributes["__lod"] == 2
              outputPort: lod2
            - expr:
                type: flowExpr
                value: attributes["__lod"] == 3
              outputPort: lod3

      - id: f1a2b3c4-d5e6-4f70-8a9b-0c1d2e3f4a5b
        name: FeatureFilterTrafficAreaForLod2And3
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: attributes["feature_type"] in ["tran:TrafficArea", "tran:AuxiliaryTrafficArea"]
              outputPort: features

      - id: 3b4c5d6e-7f80-4912-8b2c-3d4e5f6a7b8c
        name: Cesium3DTilesWriterLod2And3
        type: action
        action: Cesium 3D Tiles Writer
        with:
          dracoCompression:
            enabled:
              quantizationError: 0.003
          targetTileSize: 1048576
          attachTexture: true
          wrapTolerance: 0.1
          skipUnexposedAttributes: true
          output:
            type: flowExpr
            value: attributes["__output_base"] + "_3dtiles_lod" + str(attributes["__lod"]) + ".zip"

      - id: aef63371-49d5-484b-bdca-0e4f00520526
        name: TwoDimensionForcer
        type: action
        action: Two Dimension Forcer

      - id: b410723e-979a-4eb1-9dde-4316ce3ee9d9
        name: GeometryFilter
        type: action
        action: Geometry Filter
        with:
          filterType: geometryType

      - id: 615752ac-2d0f-46c3-b3d3-e62400234b85
        name: GeometrySplitter
        type: action
        action: Geometry Splitter

      - id: eb7833a5-a11d-4481-9e80-8d4d64d0b7c8
        name: Dissolver
        type: action
        action: Dissolver
        with:
          groupBy:
            - __citygml_gml_id
          attributeAccumulation: useOneFeature

      - id: e0dc2253-b75a-4bde-bc9f-01901b1af1c7
        name: MVTWriter
        type: action
        action: MVT Writer
        with:
          layerName:
            type: flowExpr
            value: attributes["feature_type"].split(":")[1]
          skipUnexposedAttributes: true
          minZoom: 8
          maxZoom: 16
          extent: 4096
          extentAtMaxZoom: 65536
          maxTileBytes: 10000000
          keepAllAtMaxZoom: true
          output:
            type: flowExpr
            value: attributes["__output_base"] + "_mvt_lod" + str(attributes["__lod"]) + ".zip"

      - id: b7f7453c-3f9f-45c2-8517-b6104b94de42
        name: FeatureFilterDmGeometricAttribute
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: type(attributes.get("__dm")) == dict
              outputPort: features

      - id: 6475a47b-563b-417a-b65d-dbe54e0992f2
        name: DmMvtWriter
        type: subGraph
        subGraphId: da5a2614-60e3-42c1-ab01-86e5d73a55e6

    edges:
      - id: 70e3d5c3-bb1e-4528-ac75-778a502fbf83
