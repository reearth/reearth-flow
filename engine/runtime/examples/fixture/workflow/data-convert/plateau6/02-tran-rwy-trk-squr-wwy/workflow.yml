# yaml-language-server: $schema=https://raw.githubusercontent.com/reearth/reearth-flow/main/engine/schema/workflow.json
id: 653e2dba-2113-4351-b50c-861a2c26eea0
name: "PLATEAU6-DataConvert-02-tran-workflow"
entryGraphId: 6058bda7-db22-4c23-8c40-f8fcb91e6d22
with:
  cityGmlPath:
graphs:
  - id: 6058bda7-db22-4c23-8c40-f8fcb91e6d22
    name: entry_point
    nodes:
      - id: 290a0b62-5165-4981-9463-ab67b51b4ffa
        name: FeatureCreator
        type: action
        action: Feature Creator
        with:
          creator:
            type: flowExpr
            value: |
              [
                {
                  "city_gml_path": variables["cityGmlPath"],
                },
              ]

      - id: 348477a8-6253-42b2-8cc1-308e3592015a
        name: FilePathExtractor
        type: action
        action: Feature File Path Extractor
        with:
          sourceDataset:
            type: flowExpr
            value: attributes["city_gml_path"]
          extractArchive: true

      - id: a7668d0d-2f24-4a89-ae69-49258fd9fdc7
        name: GmlFileFilter
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: attributes["extension"] == "gml"
              outputPort: features

      - id: aef40c4c-350e-4fe4-af37-ffe33b885f56
        name: FeatureReaderByCityGml
        type: action
        action: Feature CityGML 3 Reader
        with:
          dataset:
            type: flowExpr
            value: attributes["path"]
          keepAttributes: false
          cityGmlAttributesKey: cityGmlAttributes
          extractTags:
            - tran:AuxiliaryTrafficArea
            # - tran:AuxiliaryTrafficSpace
            # - tran:ClearanceSpace
            # - tran:Hole
            # - tran:HoleSurface
            # - tran:Intersection
            # - tran:Marking
            - tran:Railway
            - tran:Road
            # - tran:Section
            - tran:Square
            - tran:Track
            - tran:TrafficArea
            # - tran:TrafficSpace
            - tran:Waterway
            # - urc:DmGeometricAttribute

      - id: 8f1c2a3b-4d5e-4f60-9a1b-2c3d4e5f6a7b
        name: AttributeTableExtractor
        type: action
        action: Attribute Table Extractor
        with:
          inline: !include ../../../../config/plateau6_tran_flatten_attributes.json

      - id: 9c8b7a6d-5e4f-4321-8a9b-0c1d2e3f4a5b
        name: AttributeFlattener
        type: action
        action: Attribute Flattener
        with:
          attributes:
            - attributes

      - id: 3a4b5c6d-7e8f-4901-8a2b-3c4d5e6f7a8b
        name: FeatureMergerForFlattenedAttributes
        type: action
        action: Feature Merger
        with:
          requestorAttribute:
            - __citygml_gml_id
          supplierAttribute:
            - __citygml_gml_id

      - id: 36c60099-916a-47ce-9e50-cd33ee300cd7
        name: AttributeManager
        type: action
        action: Attribute Manager
        with:
          operations:
            - attribute: attributes
              method: convert
              value:
                type: flowExpr
                value: json.dumps(attributes.get("attributes") or {})
            - attribute: __citygml_feature_type
              method: rename
              value:
                type: string
                value: feature_type
            # The reader copies the input feature's attributes onto every
            # parsed city object; drop them so local paths do not end up as
            # tile properties, as the plateau4 workflows do here too.
            - attribute: city_gml_path
              method: remove
            - attribute: path
              method: remove
            - attribute: name
              method: remove
            - attribute: extension
              method: remove
            - attribute: gml_id
              method: create
              value:
                type: flowExpr
                value: attributes["__citygml_gml_id"]
            - attribute: parent_gml_id
              method: create
              value:
                type: flowExpr
                value: attributes.get("__citygml_parent_gml_id")
            - attribute: city_code
              method: create
              value:
                type: flowExpr
                value: variables.get("cityCode") or variables["cityGmlPath"].rsplit("/", 1)[-1][:5]
            - attribute: __base_city_code
              method: create
              value:
                type: flowExpr
                value: variables.get("cityCode") or variables["cityGmlPath"].rsplit("/", 1)[-1][:5]

      - id: 83aea69a-6df3-4dbd-9ef8-58461978155c
        name: AttributeConversionTableForWardName
        type: action
        action: Attribute Conversion Table
        with:
          format: csv
          inline: !include ../../../../config/admin_ward_list.csv.txt
          rules:
            - featureFroms: ["city_code"]
              featureTo: "__city_name_en"
              conversionTableKeys: ["ward_code"]
              conversionTableTo: "ward_name_en"
            - featureFroms: ["city_code"]
              featureTo: "__ward_parent_code"
              conversionTableKeys: ["ward_code"]
              conversionTableTo: "city_code"

      - id: 6a6c572f-2f37-4db4-8546-2f50f52af432
        name: CityCodeBoundaryFilter
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: attributes["city_code"] == attributes["__base_city_code"] or attributes["__ward_parent_code"] == attributes["__base_city_code"]
              outputPort: features

      - id: 048967ac-f0ac-4bfb-90b5-c5a80d0acede
        name: AttributeManagerForOutputBase
        type: action
        action: Attribute Manager
        with:
          operations:
            - attribute: __output_base
              method: create
              value:
                type: flowExpr
                value: |
                  city_gml = variables["cityGmlPath"].split("/")[-1].remove_suffix(".zip");
                  suffix = "";
                  if attributes["city_code"] != attributes["__base_city_code"] {
                    suffix = "_" + attributes["city_code"] + "_" + attributes["__city_name_en"];
                  }
                  city_gml + suffix

      - id: d46e567a-831f-476a-bbb2-ce130a2db7a0
        name: GeometrySplitterByLod
        type: action
        action: Geometry Splitter
        with:
          groupBy: "lod"

      - id: 2a3b4c5d-6e7f-4801-8a1b-2c3d4e5f6a7b
        name: FeatureFilterByLod
        type: action
        action: Feature Filter
        with:
          conditions:
            - expr:
                type: flowExpr
                value: attributes["lod"] == 0
              outputPort: lod0
            - expr:
                type: flowExpr
                value: attributes["lod"] == 1
              outputPort: lod1
            - expr:
                type: flowExpr
                value: attributes["lod"] == 2
              outputPort: lod2
            - expr:
                type: flowExpr
                value: attributes["lod"] == 3
              outputPort: lod3

      - id: 3b4c5d6e-7f80-4912-8b2c-3d4e5f6a7b8c
        name: Cesium3DTilesWriterLod2And3
        type: action
        action: Cesium 3D Tiles Writer
        with:
          targetTileSize: 1048576
          attachTexture: true
          skipUnexposedAttributes: true
          output:
            type: flowExpr
            value: attributes["__output_base"] + "_3dtiles_lod" + str(attributes["lod"]) + ".zip"

      - id: aef63371-49d5-484b-bdca-0e4f00520526
        name: TwoDimensionForcer
        type: action
        action: Two Dimension Forcer

      - id: b410723e-979a-4eb1-9dde-4316ce3ee9d9
        name: GeometryFilter
        type: action
        action: Geometry Filter
        with:
          filterType: geometryType

      - id: 615752ac-2d0f-46c3-b3d3-e62400234b85
        name: GeometrySplitter
        type: action
        action: Geometry Splitter

      - id: eb7833a5-a11d-4481-9e80-8d4d64d0b7c8
        name: Dissolver
        type: action
        action: Dissolver
        with:
          groupBy:
            - __citygml_gml_id
          attributeAccumulation: useOneFeature

      - id: e0dc2253-b75a-4bde-bc9f-01901b1af1c7
        name: MVTWriter
        type: action
        action: MVT Writer
        with:
          layerName:
            type: flowExpr
            value: attributes["feature_type"].split(":")[1]
          skipUnexposedAttributes: true
          minZoom: 8
          maxZoom: 16
          extent: 65536
          output:
            type: flowExpr
            value: attributes["__output_base"] + "_lod" + str(attributes["lod"])
          compressOutput:
            type: flowExpr
            value: attributes["__output_base"] + "_mvt_lod" + str(attributes["lod"]) + ".zip"

    edges:
      - id: 70e3d5c3-bb1e-4528-ac75-778a502fbf83
        from: 290a0b62-5165-4981-9463-ab67b51b4ffa
        to: 348477a8-6253-42b2-8cc1-308e3592015a
