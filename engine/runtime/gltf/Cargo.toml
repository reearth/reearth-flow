[package]
description = "Re:Earth Flow GLTF library"
name = "reearth-flow-gltf"

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# Temporary migration flag for the new-geometry migration.
# TODO: Remove after migration.
new-geometry = ["dep:image", "dep:ktx2-rw"]

[dependencies]
reearth-flow-common.workspace = true
reearth-flow-geometry.workspace = true
reearth-flow-storage.workspace = true
reearth-flow-types.workspace = true

nusamai-citygml.workspace = true
nusamai-gltf.workspace = true

ahash.workspace = true
base64.workspace = true
byteorder.workspace = true
bytes.workspace = true
draco-oxide = { workspace = true, features = ["decoder"] }
gltf.workspace = true
image = { workspace = true, optional = true }
indexmap.workspace = true
ktx2-rw = { workspace = true, optional = true }
nalgebra.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
