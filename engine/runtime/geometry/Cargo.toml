[package]
description = "Re:Earth Flow geometry library"
name = "reearth-flow-geometry"

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# Temporary migration flag for the new-geometry migration.
# TODO: Remove after migration.
new-geometry = []

# When enabled, geometry leaves keep their derived `serde` impls, which write the
# raw internal representation (index-buffer widths, CSR offset buffers, the packed
# point-cloud byte stream). This is a debug-only intermediate-data form. When
# disabled (the default), the leaves use the hand-written, lossless intermediate
# form in each leaf's `feature_write.rs`, which decodes those internal structures.
debug-geom-feature-write = []

