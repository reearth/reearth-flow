[[codes]]
code = "citygml.non_citygml_geometry"
category = "geometry"
default_disposition = "warn_drop"
message = "skipped feature with non-CityGML geometry"
help = "CityGML Writer only writes CityGML geometry; route other geometry types to a different writer."

[[codes]]
code = "citygml.empty_geometry"
category = "geometry"
default_disposition = "warn_drop"
message = "skipped feature with no geometry for the configured LOD mask"
help = "Check the feature's LODs against the writer's LOD configuration."

[[codes]]
code = "citygml.parse_failed"
category = "parse"
default_disposition = "fatal"
message = "the document could not be parsed as the reader's CityGML version"
help = "Check that the file is well-formed UTF-8 XML and that its CityGML version matches the reader; a 3.0 document needs the CityGML 3 version of the reader, a 2.0 document the CityGML 2 version."

[[codes]]
code = "citygml.malformed_input"
category = "parse"
default_disposition = "fatal"
message = "the document is well-formed XML but contains content that cannot be read"
help = "The read's error message names the file and what could not be read, such as a coordinate list or an xlink:href, with the element's gml:id where one is available; correct that content in the source file."

[[codes]]
code = "citygml.lod1_shell_conflict"
category = "geometry"
default_disposition = "warn_drop"
message = "dropped lod1MultiSurface from an object that also carries lod1Solid"
help = "CityGML 2.0 allows only one of lod1Solid and lod1MultiSurface, and defines them as identical at LOD1. Supply just one of the two."

# The eleven codes below are raised only through `NodeDiagnosticsHandle::report_warn`,
# which records warn-and-continue and never resolves a disposition. Read
# `warn_drop` here as "the least-severe value the enum offers", as in
# `geometry.toml`: the feature is still written, without the content named, or
# as `gen:GenericCityObject` for `citygml.unknown_feature_type`.
[[codes]]
code = "citygml.attribute_not_placed"
category = "schema"
default_disposition = "warn_drop"
message = "left out an attribute that could not be written as a CityGML 2.0 property"
help = "Give the attribute a CityGML 2.0 property name of the feature's class as prefix:name; geometry property names and flattened keys are never written, and an ADE property such as uro: needs its ADE listed in adeSchemas. Read gen: attributes and coded values with keepAttributes on, so names are kept and each _code entry matches one value."

[[codes]]
code = "citygml.attribute_over_limit"
category = "schema"
default_disposition = "warn_drop"
message = "left out values beyond the number the CityGML 2.0 schema allows"
help = "The property allows fewer values than the attribute holds; most allow one. Keep only the values to write."

[[codes]]
code = "citygml.nested_object_not_written"
category = "schema"
default_disposition = "warn_drop"
message = "left out a city object referenced through a property such as core:generalizesTo or grp:groupMember, or the data of a geometry owner that is not a city object"
help = "Reference properties are not written yet. The referenced object is written where it is a member or nested object of its own. A geometry owner whose type is not a CityGML city object, such as an ADE object whose ADE is not listed in adeSchemas, is not written as an object, so its geometry is written on its nearest city object and its own data is left out."

[[codes]]
code = "citygml.empty_value_not_written"
category = "schema"
default_disposition = "warn_drop"
message = "left out an element or XML attribute that had no value"
help = "An element is written only with a value or a child element, so an empty string writes nothing, as does an element with only XML attributes such as uom or codeSpace; one holding only an xlink:href reference is still written. An element an empty value leaves without a part its schema requires, such as a generic attribute without gen:value or an address without core:xalAddress, is left out whole, and an empty XML attribute is left off its element. Fill the value upstream, or remove the attribute before the writer."

[[codes]]
code = "citygml.codelist_not_staged"
category = "io"
default_disposition = "warn_drop"
message = "could not copy a codelist beside the output; its original URL was written instead"
help = "Check that the codelist the reader recorded under the attribute's _codeSpace key is still readable where the workflow runs."

[[codes]]
code = "citygml.unknown_feature_type"
category = "schema"
default_disposition = "warn_drop"
message = "wrote a feature as gen:GenericCityObject because its feature type names no CityGML class"
help = "Give the feature type as a class's qualified name, such as bldg:Building or uro:UndergroundBuilding, or a CityGML 2.0 class name alone, such as Building. A name found in several modules, such as WallSurface or Door, needs its prefix. An ADE class needs its ADE listed in adeSchemas."

[[codes]]
code = "citygml.parent_not_found"
category = "schema"
default_disposition = "warn_drop"
message = "wrote a nested city object as a top-level object because no object, or more than one, has its parent's key"
help = "An upstream filter may have removed the parent, the parent has no gml:id, or the parent key does not match the parent's gml:id. Keep the parent in the stream, or correct parentGmlId."

[[codes]]
code = "citygml.parent_cannot_hold"
category = "schema"
default_disposition = "warn_drop"
message = "wrote a nested city object as a top-level object because its parent's class has no property for it"
help = "CityGML 2.0 nests each class only under certain parents, such as a window under a wall surface's bldg:opening, not under the building. Check the parent key and the owner's feature type."

[[codes]]
code = "citygml.parent_cycle"
category = "schema"
default_disposition = "warn_drop"
message = "wrote a nested city object as a top-level object because its parent links form a cycle"
help = "Each object's parent key leads back to the object itself. Correct parentGmlId so the links end at a top-level object."

[[codes]]
code = "citygml.nested_data_not_matched"
category = "schema"
default_disposition = "warn_drop"
message = "wrote a nested object's geometry on its feature because no nested object in the feature's attributes matched it"
help = "Nested objects are matched to their geometry by gml:id alone. The object that owns the geometry has no gml:id, or the feature's attributes carry none for it, as when the CityGML reader runs with keepAttributes off, so its geometry is written on the feature and its data, if any, as an object of its own with a generated gml:id."

[[codes]]
code = "citygml.duplicate_object_not_written"
category = "schema"
default_disposition = "warn_drop"
message = "left out a second copy of a city object already written in the document"
help = "The CityGML reader inlines an object reached through xlink:href, so the same gml:id can arrive twice; the first copy is written. Writing an xlink:href instead is not supported yet."

# Raised only through `NodeDiagnosticsHandle::report_warn`, as
# `citygml.unknown_feature_type` is, so `warn_drop` here is equally inert: the
# feature is still written, without the geometry its class has no property for.
[[codes]]
code = "citygml.geometry_not_written"
category = "schema"
default_disposition = "warn_drop"
message = "left geometry out of a feature because its class declares no property for that LOD and geometry type"
help = "The feature's CityGML class declares no property for that LOD and geometry type, and no lodNGeometry for that LOD to hold it instead, so that geometry was skipped and the rest of the feature written. Set the feature's source property name to one the class declares, change the geometry's LOD, or change the feature type to a class that declares such a property."

# The four terrain codes are raised only through `NodeDiagnosticsHandle`, as
# `citygml.geometry_not_written` is, so `warn_drop` here is equally inert.
[[codes]]
code = "citygml.tin_not_triangles"
category = "geometry"
default_disposition = "warn_drop"
message = "left terrain out because not every face is a triangle"
help = "A dem:TINRelief holds triangles only, and one face that is not a triangle leaves out all of that object's terrain. Add a Geometry Coercer with the Triangular Mesh target before the CityGML Writer."

[[codes]]
code = "citygml.tin_not_surface"
category = "geometry"
default_disposition = "warn_drop"
message = "left terrain out because it is a solid or curves, not triangles"
help = "A dem:TINRelief holds a triangulated surface. Convert the geometry to triangles first, for example with a Geometry Coercer set to Triangular Mesh."

[[codes]]
code = "citygml.relief_feature_geometry"
category = "schema"
default_disposition = "warn_drop"
message = "left geometry off a dem:ReliefFeature, which declares no geometry property"
help = "Type the feature dem:TINRelief to write its triangles as terrain, or give it dem:TINRelief components through the parent key."

[[codes]]
code = "citygml.tin_appearance_dropped"
category = "geometry"
default_disposition = "warn_drop"
message = "wrote terrain without its appearance"
help = "This writer does not texture terrain: the triangles are written and their materials and textures are left out."
