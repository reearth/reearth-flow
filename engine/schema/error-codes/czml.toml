[[codes]]
code = "czml.missing_feature_id"
category = "schema"
default_disposition = "warn_drop"
message = "skipped feature without a feature_id"
help = "Ensure upstream features carry a CityGML gml:id before reaching the CZML Writer."

[[codes]]
code = "czml.non_citygml_geometry"
category = "geometry"
default_disposition = "warn_drop"
message = "skipped feature with non-CityGML geometry"
help = "CZML Writer only converts CityGML geometry to polygons; route other geometry types to a different writer."

[[codes]]
code = "czml.empty_geometry"
category = "geometry"
default_disposition = "warn_drop"
message = "skipped feature with no drawable geometry"
help = "CZML draws points, lines and faces. A feature with no geometry, or one carrying only point-cloud or unevaluated CSG data, has nothing the writer can draw."

[[codes]]
code = "czml.unplaceable_frame"
category = "geometry"
default_disposition = "warn_drop"
message = "skipped feature whose coordinates cannot be placed on the globe"
help = "CZML positions are longitude, latitude and height on the WGS84 globe, so the writer needs to know what coordinate system the feature is in. Reproject it, or set its CRS, before the CZML Writer."

[[codes]]
code = "czml.too_many_faces"
category = "geometry"
default_disposition = "warn_drop"
message = "skipped feature with more faces than the writer will emit"
help = "Each face becomes its own CZML entity, so a finely tessellated surface such as a terrain mesh produces an unusably large file. Simplify or split the geometry before the CZML Writer."
[[codes]]
code = "czml.unsupported_position"
category = "geometry"
default_disposition = "warn_drop"
message = "skipped packet with a position this reader cannot interpret"
help = "Interval-scoped property arrays, `reference`/`references` positions and time-tagged `cartesian` positions are not read yet. Use a static `cartographicDegrees`, `cartographicRadians` or `cartesian` value."

[[codes]]
code = "czml.inertial_frame"
category = "geometry"
default_disposition = "warn_drop"
message = "skipped packet whose cartesian position is in an inertial reference frame"
help = "`referenceFrame: \"INERTIAL\"` is not earth-fixed, so it cannot be placed without a time. Convert the positions to the FIXED frame before reading."

[[codes]]
code = "czml.geocentric_force_2d"
category = "geometry"
default_disposition = "warn_drop"
message = "skipped geocentric packet because force2D was requested"
help = "EPSG:4978 has no 2D form and dropping Z from an ECEF coordinate is meaningless, not merely lossy. Turn force2D off, or supply the positions as `cartographicDegrees`."

[[codes]]
code = "czml.untimed_sample"
category = "schema"
default_disposition = "warn_drop"
message = "dropped position with no time value from a grouped entity"
help = "Features grouped by groupTimeseriesBy share one entity. When some of them carry a value in timeField, the entity's positions are written as time-tagged samples and a feature without one has no place on that timeline. When none of them do, the entity is static and holds a single position, so only the first can be written. Either way the rest are dropped. Give every feature in the group a time value, or group it separately."

[[codes]]
code = "czml.unparsable_time"
category = "schema"
default_disposition = "warn_drop"
message = "dropped position whose time value is neither a timestamp nor a number"
help = "CZML writes times as ISO 8601 timestamps, or as numbers of seconds counted from an epoch. A timeField value that is neither cannot be written, and writing it unchanged produced a file no viewer could load. Correct the attribute, or point timeField at one that holds a time."

[[codes]]
code = "czml.areal_samples_dropped"
category = "geometry"
default_disposition = "warn_drop"
message = "wrote an areal entity's first footprint and dropped its time samples"
help = "A CZML polygon carries its own coordinates, so an entity drawn as a polygon cannot be moved by its position samples. A group whose features are areal is therefore written as one static footprint, taken from the first feature that could be placed. Group the features as points to animate them, or write one entity per feature."

[[codes]]
code = "czml.style_not_applied"
category = "config"
default_disposition = "warn_drop"
message = "polygonStyle was set but this batch is written straight from geometry, which it does not reach"
help = "polygonStyle colours and extrudes the single polygon the writer derives for a time-dynamic entity or for a feature read back from CZML. A feature written straight from its geometry gets one packet per face instead, and those faces are not styled. Set timeField, or read the features back through the CZML Reader, to get a styled entity."

[[codes]]
code = "czml.parse_failed"
category = "parse"
default_disposition = "fatal"
message = "could not parse the CZML file"
help = "The file is not valid CZML: it must be a JSON array of packets whose first packet has id \"document\". Check that the file is CZML rather than GeoJSON or another JSON format, and that it is not truncated."
