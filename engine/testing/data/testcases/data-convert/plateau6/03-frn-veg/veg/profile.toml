citygml_zip_name = "08220_tsukuba-shi_city_2023_citygml_2_op_veg.zip"

# Every LOD of both types is written, and nothing else is.
# Attributes do not change with LOD, so only LOD1 of each type is compared below.
[tests.output_files.outputs]
must_include = [
    "dictionary.json",
    "08220_tsukuba-shi_city_2023_citygml_2_op_veg_PlantCover_3dtiles_lod1.zip",
    "08220_tsukuba-shi_city_2023_citygml_2_op_veg_PlantCover_3dtiles_lod2.zip",
    "08220_tsukuba-shi_city_2023_citygml_2_op_veg_PlantCover_3dtiles_lod3.zip",
    "08220_tsukuba-shi_city_2023_citygml_2_op_veg_PlantCover_dm_geometric_attributes.zip",
    "08220_tsukuba-shi_city_2023_citygml_2_op_veg_SolitaryVegetationObject_3dtiles_lod1.zip",
